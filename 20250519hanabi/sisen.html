<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>花火タッチ</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      background-size: 120% 120%;
      background-position: center;
      background-repeat: no-repeat;
      touch-action: none;
      transition: background-image 1s ease;
    }

    body.animate-bg {
      animation: bgMoveZoom 40s linear infinite;
    }

    @keyframes bgMoveZoom {
      0% {
        background-size: 120% 120%;
        background-position: center center;
      }
      50% {
        background-size: 125% 125%;
        background-position: 60% 40%;
      }
      100% {
        background-size: 120% 120%;
        background-position: center center;
      }
    }

    .firework {
      position: absolute;
      pointer-events: none;
    }

    .bg-selector {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(255, 255, 255, 0.7);
      padding: 10px;
      border-radius: 10px;
      font-size: 20px;
    }

    .settings-menu {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55);
    }

    .settings-panel {
      min-width: 280px;
      padding: 24px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.95);
      color: #222;
      font-size: 18px;
    }

    .settings-panel fieldset {
      margin: 0 0 16px;
      padding: 10px;
    }

    .settings-panel button {
      width: 100%;
      padding: 10px;
      font-size: 18px;
    }

    .settings-panel input[type="number"] {
      width: 80px;
      font-size: 18px;
    }

    .settings-panel input[type="range"] {
      width: 100%;
    }

    #dwellZone {
      position: fixed;
      z-index: 10;
      display: none;
      border: 2px dashed rgba(180, 255, 190, 0.9);
      background: rgba(180, 255, 190, 0.08);
      pointer-events: none;
      transform: translate(-50%, -50%);
    }

    .button-container {
      position: fixed;
      bottom: 160px;
      right: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .action-button {
      width: 100px;
      height: auto;
      transition: transform 1s ease;
      cursor: pointer;
    }

    .action-button:active {
      transform: scale(1.5);
    }

    .anim-toggle {
      position: fixed;
      bottom: 20px;
      right: 10px;
      background: rgba(255, 255, 255, 0.7);
      padding: 10px;
      border-radius: 10px;
      font-size: 18px;
    }
  </style>

  <!-- PWA対応: manifestとService Worker登録 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</head>
<body>

<div id="dwellZone" aria-hidden="true"></div>


<!-- 花火カウント用ボタン（花火ボタンの上に表示） -->
<!-- このエリアは削除しました -->

<!-- 花火ボタン（画面右下に配置） -->
<div class="button-container" style="flex-direction:column-reverse;">
  <img src="tokudai.png" alt="特大花火" id="tokudaiBtn" class="action-button">
  <img src="randam.png" alt="ランダム花火" id="randamBtn" class="action-button">
</div>

<!-- 花火カウント用ボタン（画面下中央に配置）は画像ボタンに置き換えたため削除 -->

<!-- 花火数表示モーダル -->
<div id="countModal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#fff; border-radius:15px; box-shadow:0 0 20px #0008; padding:30px 40px; z-index:9999; font-size:2em; text-align:center;">
  <span id="countResult"></span><br>
  <button onclick="document.getElementById('countModal').style.display='none'" style="margin-top:20px; font-size:1em;">閉じる</button>
</div>

<!-- 初期設定メニュー -->
<div class="settings-menu" id="settingsMenu">
  <div class="settings-panel">
    <fieldset>
      <legend>背景</legend>
      <label><input type="radio" name="bg" value="h1.jpg" checked> スペシャル銀河</label><br>
      <label><input type="radio" name="bg" value="h2.jpg"> ふつうの銀河</label><br>
      <label><input type="radio" name="bg" value="h3.jpg"> 紫夜空</label><br>
      <label><input type="radio" name="bg" value="h4.jpg"> 山の夜空</label><br>
      <label><input type="radio" name="bg" value="h5.jpg"> 星</label>
    </fieldset>
    <fieldset>
      <legend>背景の動き</legend>
      <label><input type="radio" name="bgAnimation" value="on"> 動く</label><br>
      <label><input type="radio" name="bgAnimation" value="off" checked> 動かない</label>
    </fieldset>
    <fieldset>
      <legend>視線カーソル</legend>
      <label>反応時間 <input id="dwellDuration" type="number" min="0.1" max="5" step="0.1" value="0.6"> 秒</label><br>
      <label>反応範囲 <output id="dwellAreaValue">200</output> × <output id="dwellAreaValueY">200</output> px</label>
      <input id="dwellArea" type="range" min="100" max="500" step="50" value="200" aria-label="視線カーソルの反応範囲">
    </fieldset>
    <button type="button" id="startGameBtn">この設定で開始</button>
  </div>
</div>
<script>
  // 初期背景設定（h1.jpg）
  document.body.style.backgroundImage = "url('h1.jpg')";

  const NUM_VARIANTS = 8;
  let dwellDuration = 0.6;
  let dwellArea = 200;
  let dwellAnchor = null;
  let latestPointer = null;
  let dwellTimer = null;
  let hasFiredInZone = false;
  const dwellZone = document.getElementById('dwellZone');

  // 花火カウント用変数
  let hanabiCount = 0;
  let isCounting = false;

  // 同時に表示できる最大花火数
  const MAX_FIREWORKS = 50;
  let currentFireworks = 0;

  function launchFirework(x, y, size = null) {
    if (currentFireworks >= MAX_FIREWORKS) return;
    currentFireworks++;
    const randIndex = Math.floor(Math.random() * NUM_VARIANTS) + 1;
    const fwSize = size || (Math.floor(Math.random() * 200) + 250);
    const hueRotate = Math.floor(Math.random() * 360);

    const gif = document.createElement('img');
    gif.src = `hanabi${randIndex}.gif?${Date.now()}`;
    gif.className = 'firework';
    gif.style.width = `${fwSize}px`;
    gif.style.left = `${x - fwSize / 2}px`;
    gif.style.top = `${y - fwSize / 2}px`;
    gif.style.position = 'absolute';
    gif.style.filter = `hue-rotate(${hueRotate}deg)`;
    document.body.appendChild(gif);

    setTimeout(() => {
      gif.remove();
      currentFireworks = Math.max(0, currentFireworks - 1);
    }, 2000);

    const audio = new Audio(`hanabi${randIndex}.mp3`);
    audio.play();

    // カウント中ならカウントアップ
    if (isCounting) hanabiCount++;
  }
  // 初期設定メニュー
  document.querySelectorAll('input[name="bg"]').forEach(radio => {
    radio.addEventListener('change', (e) => {
      document.body.style.backgroundImage = `url('${e.target.value}')`;
    });
  });
  const dwellAreaInput = document.getElementById('dwellArea');
  dwellAreaInput.addEventListener('input', () => {
    document.getElementById('dwellAreaValue').value = dwellAreaInput.value;
    document.getElementById('dwellAreaValueY').value = dwellAreaInput.value;
  });
  document.getElementById('startGameBtn').addEventListener('click', () => {
    const animateBackground = document.querySelector('input[name="bgAnimation"]:checked').value === 'on';
    const durationInput = document.getElementById('dwellDuration');
    dwellDuration = Math.max(0.1, Math.min(5, Number(durationInput.value) || 0.6));
    durationInput.value = dwellDuration.toFixed(1);
    dwellArea = Number(dwellAreaInput.value);
    document.body.classList.toggle('animate-bg', animateBackground);
    document.getElementById('settingsMenu').style.display = 'none';
  });

  // ボタン操作
  const tokudaiBtn = document.getElementById('tokudaiBtn');
  tokudaiBtn.addEventListener('click', () => {
    const x = Math.random() * window.innerWidth;
    const y = Math.random() * window.innerHeight;
    launchFirework(x, y, 1200);
  });

  document.getElementById('randamBtn').addEventListener('click', () => {
    const x = Math.random() * window.innerWidth;
    const y = Math.random() * window.innerHeight;
    launchFirework(x, y);
  });

  // Enterキーでランダム花火
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || document.getElementById('settingsMenu').style.display !== 'none') return;
    e.preventDefault();
    const x = Math.random() * window.innerWidth;
    const y = Math.random() * window.innerHeight;
    launchFirework(x, y);
  });

  // ミドルクリックで特大花火
  document.body.addEventListener('mousedown', (e) => {
    if (e.button === 1) { // ミドルボタン
      e.preventDefault();
      tokudaiBtn.click();
    }
  });

  // 視線の細かな揺れは反応範囲内として扱い、範囲内で一定時間静止したら1発だけ発射する。
  function clearDwell() {
    if (dwellTimer !== null) {
      clearTimeout(dwellTimer);
      dwellTimer = null;
    }
    dwellAnchor = null;
    latestPointer = null;
    hasFiredInZone = false;
    dwellZone.style.display = 'none';
  }

  function beginDwell(x, y) {
    dwellAnchor = { x, y };
    latestPointer = { x, y };
    hasFiredInZone = false;
    dwellZone.style.width = `${dwellArea}px`;
    dwellZone.style.height = `${dwellArea}px`;
    dwellZone.style.left = `${x}px`;
    dwellZone.style.top = `${y}px`;
    dwellZone.style.display = 'block';
    dwellTimer = setTimeout(() => {
      if (!latestPointer || hasFiredInZone) return;
      launchFirework(latestPointer.x, latestPointer.y);
      hasFiredInZone = true;
      dwellTimer = null;
      dwellZone.style.display = 'none';
    }, dwellDuration * 1000);
  }

  document.body.addEventListener('pointermove', (e) => {
    if (document.getElementById('settingsMenu').style.display !== 'none') return;
    if (e.target.closest('.button-container') || e.target.closest('.anim-toggle')) {
      clearDwell();
      return;
    }

    const x = e.clientX;
    const y = e.clientY;
    if (!dwellAnchor) {
      beginDwell(x, y);
      return;
    }

    latestPointer = { x, y };
    const outsideZone = Math.abs(x - dwellAnchor.x) > dwellArea / 2 ||
      Math.abs(y - dwellAnchor.y) > dwellArea / 2;
    if (outsideZone) beginDwell(x, y);
  });

  document.body.addEventListener('pointerleave', clearDwell);
  document.body.addEventListener('pointercancel', clearDwell);

  // 右クリックでも花火
  document.body.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    const x = Math.random() * window.innerWidth;
    const y = Math.random() * window.innerHeight;
    launchFirework(x, y);
  });

  // タッチスクロール無効
  document.addEventListener('touchmove', function (e) {
    e.preventDefault();
  }, { passive: false });
</script>


</body>
</html>
