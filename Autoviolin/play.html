<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Autoviolin 演奏</title>
  <style>
    :root {
      --bg: #0f1b32;
      --panel: #132746;
      --accent: #f7db82;
      --accent-2: #7aeaff;
      --text: #ffffff;
      --muted: #c6d7ef;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Yu Gothic", "Meiryo", sans-serif;
      background: radial-gradient(circle at top, #17355e, #0b1424);
      color: var(--text);
      padding: 18px;
    }
    .shell {
      max-width: 1180px;
      margin: 0 auto;
      display: grid;
      gap: 14px;
    }
    .panel {
      border-radius: 18px;
      background: rgba(15, 25, 49, 0.94);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 16px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.35);
    }
    .row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    select, button {
      font-size: 1rem;
      border-radius: 12px;
      border: none;
      padding: 12px 14px;
      touch-action: manipulation;
    }
    select {
      min-width: 260px;
      background: #f6faff;
      color: #173559;
    }
    button {
      font-weight: 700;
      cursor: pointer;
      background: var(--accent);
      color: #10243a;
    }
    .stage {
      position: relative;
      min-height: calc(100vh - 130px);
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border-radius: 20px;
      overflow: hidden;
      user-select: none;
      touch-action: none;
      outline: none;
      cursor: pointer;
    }
    .stage::after {
      content: "";
      position: absolute;
      inset: 20px;
      border-radius: 18px;
      pointer-events: none;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.04), 0 0 32px rgba(122, 234, 255, 0.15);
    }
    .violin-wrap {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      transition: filter 0.12s ease;
    }
    .violin-wrap.active {
      filter: drop-shadow(0 0 20px rgba(122, 234, 255, 0.72));
    }
    .violin-wrap canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .hud {
      color: var(--muted);
      font-size: 0.98rem;
      min-height: 26px;
    }
    .hide { display: none; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="panel">
      <div class="row">
        <label for="songSelect" style="font-weight:700;">保存済み曲</label>
        <select id="songSelect"></select>
        <a href="setup.html" style="text-decoration:none;"><button type="button">設定へ</button></a>
        <button type="button" id="rotL">⟲ 左回し</button>
        <button type="button" id="rotR">⟳ 右回し</button>
      </div>
      <div class="hud" id="hud">画面を押した瞬間に次の音を再生し、離すと音が減衰します。</div>
    </div>

    <div class="panel stage" id="playArea" tabindex="0">
      <div class="violin-wrap" id="violinWrap"></div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getFirestore, collection, getDocs, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    let THREE = null;
    try {
      THREE = await import('three');
    } catch (error) {
      console.error('Three.js の読み込みに失敗しました:', error);
    }

    const NOTE_FILES = {
      G3: 'violin_G3_15_forte_arco-normal.mp3',
      Gs3: 'violin_Gs3_15_mezzo-forte_arco-normal.mp3',
      A3: 'violin_A3_15_forte_arco-normal.mp3',
      As3: 'violin_As3_1_mezzo-forte_arco-normal.mp3',
      B3: 'violin_B3_15_forte_arco-normal.mp3',
      C4: 'violin_C4_15_forte_arco-normal.mp3',
      Cs4: 'violin_Cs4_1_mezzo-forte_arco-normal.mp3',
      D4: 'violin_D4_15_forte_arco-normal.mp3',
      Ds4: 'violin_Ds4_15_forte_arco-normal.mp3',
      E4: 'violin_E4_1_mezzo-forte_arco-normal.mp3',
      F4: 'violin_F4_1_forte_arco-normal.mp3',
      Fs4: 'violin_Fs4_15_forte_arco-normal.mp3',
      G4: 'violin_G4_15_mezzo-forte_arco-normal.mp3',
      Gs4: 'violin_Gs4_15_forte_arco-normal.mp3',
      A4: 'violin_A4_05_forte_arco-normal.mp3',
      As4: 'violin_As4_15_forte_arco-normal.mp3',
      B4: 'violin_B4_15_forte_arco-normal.mp3',
      C5: 'violin_C5_1_mezzo-forte_arco-normal.mp3',
      Cs5: 'violin_Cs5_1_forte_arco-normal.mp3',
      D5: 'violin_D5_15_forte_arco-normal.mp3',
      Ds5: 'violin_Ds5_15_forte_arco-normal.mp3',
      E5: 'violin_E5_15_forte_arco-normal.mp3',
      F5: 'violin_F5_1_forte_arco-normal.mp3',
      Fs5: 'violin_Fs5_15_forte_arco-normal.mp3',
      G5: 'violin_G5_15_forte_arco-normal.mp3'
    };

    const songSelect = document.getElementById('songSelect');
    const playArea = document.getElementById('playArea');
    const violinWrap = document.getElementById('violinWrap');
    const hud = document.getElementById('hud');

    const state = {
      songs: [],
      db: null,
      currentSong: null,
      index: 0,
      activeAudios: [],
      activePointerId: null,
      audioCache: new Map(),
      fadeInterval: null
    };

    const firebaseConfig = {
      apiKey: 'REPLACE_WITH_API_KEY',
      authDomain: 'autoviolin.firebaseapp.com',
      projectId: 'autoviolin',
      storageBucket: 'autoviolin.appspot.com',
      messagingSenderId: '269061883781',
      appId: 'REPLACE_WITH_APP_ID'
    };

    const displayNote = (note) => note.replace('Gs', 'G#').replace('As', 'A#').replace('Cs', 'C#').replace('Ds', 'D#').replace('Fs', 'F#');

    /* ---------------- 3D ヴァイオリン ---------------- */

    const NUT_X = 2.9;
    const BRIDGE_X = 9.4;
    const TAIL_X = 11.55;
    const BOARD_END_X = 6.9;
    const STR_Y = 1.13;

    const STRINGS = [
      { zNut: 0.42, zBridge: 0.85, radius: 0.05, color: 0x6a6f78, notes: ['G3', 'Gs3', 'A3', 'As3', 'B3', 'C4', 'Cs4'] },
      { zNut: 0.15, zBridge: 0.31, radius: 0.04, color: 0x4a4f57, notes: ['D4', 'Ds4', 'E4', 'F4', 'Fs4', 'G4', 'Gs4'] },
      { zNut: -0.15, zBridge: -0.31, radius: 0.032, color: 0x3a3e45, notes: ['A4', 'As4', 'B4', 'C5', 'Cs5', 'D5', 'Ds5'] },
      { zNut: -0.42, zBridge: -0.85, radius: 0.024, color: 0xd9d9db, notes: ['E5', 'F5', 'Fs5', 'G5'] }
    ];

    const zAt = (s, x) => s.zNut + (s.zBridge - s.zNut) * (x - NUT_X) / (BRIDGE_X - NUT_X);

    let visualOK = false;
    let model3D = null;
    let playing = false;
    let activeNote = null;
    let bow = null;
    let ring = null;
    const bowTargetPos = new (THREE ? THREE.Vector3 : Object)();
    const bowTargetRot = new (THREE ? THREE.Vector3 : Object)();

    const NOTE_JP = {
      G3: 'ソ', Gs3: 'ソ♯', A3: 'ラ', As3: 'ラ♯', B3: 'シ',
      C4: 'ド', Cs4: 'ド♯', D4: 'レ', Ds4: 'レ♯', E4: 'ミ',
      F4: 'ファ', Fs4: 'ファ♯', G4: 'ソ', Gs4: 'ソ♯', A4: 'ラ',
      As4: 'ラ♯', B4: 'シ', C5: 'ド', Cs5: 'ド♯', D5: 'レ',
      Ds5: 'レ♯', E5: 'ミ', F5: 'ファ', Fs5: 'ファ♯', G5: 'ソ'
    };

    let noteSprite = null;
    let noteTexture = null;
    const noteCanvas = document.createElement('canvas');
    noteCanvas.width = 512;
    noteCanvas.height = 256;
    const noteCtx = noteCanvas.getContext('2d');

    function drawNoteSprite(note) {
      if (!noteCtx || !noteTexture) return;
      const ctx = noteCtx;
      ctx.clearRect(0, 0, 512, 256);
      const eng = displayNote(note).replace('#', '♯');
      const jp = NOTE_JP[note] || '';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(41,242,255,0.9)';
      ctx.shadowBlur = 34;
      ctx.font = 'bold 118px "Yu Gothic", "Meiryo", Arial, sans-serif';
      ctx.fillStyle = '#eaffff';
      ctx.fillText(eng, 256, 92);
      if (jp) {
        ctx.shadowBlur = 22;
        ctx.font = 'bold 56px "Yu Gothic", "Meiryo", Arial, sans-serif';
        ctx.fillStyle = '#8fe9ff';
        ctx.fillText(jp, 256, 186);
      }
      noteTexture.needsUpdate = true;
    }

    function noteInfo(note) {
      for (const s of STRINGS) {
        const i = s.notes.indexOf(note);
        if (i >= 0) {
          const open = i === 0;
          const f = open ? 0 : Math.pow(i / (s.notes.length - 1), 1.15);
          const bowX = Math.max(7.2, Math.min(8.6, NUT_X + f * (BOARD_END_X - NUT_X) + 1.6));
          return { s, i, open, f, bowX };
        }
      }
      return null;
    }

    function showVisual(note) {
      if (!visualOK) return;
      const info = noteInfo(note);
      if (!info) return;
      activeNote = info;
      playing = true;
      drawNoteSprite(note);
      if (noteSprite) noteSprite.visible = true;
      if (info.open) {
        ring.visible = false;
      } else {
        const fx = NUT_X + info.f * (BOARD_END_X - NUT_X);
        ring.position.set(fx, STR_Y, zAt(info.s, fx));
        ring.scale.setScalar(1);
        ring.visible = true;
      }
    }

    function hideVisual() {
      if (!visualOK) return;
      playing = false;
      activeNote = null;
      ring.visible = false;
    }

    try {
      const scene = new THREE.Scene();
      const model = new THREE.Group();
      scene.add(model);
      model3D = model;

      const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
      camera.up.set(-1, 0, 0);
      camera.position.set(6.6, 12, 15);
      camera.lookAt(6.6, 0.8, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setClearColor(0x000000, 0);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      violinWrap.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 0.55));
      const keyLight = new THREE.DirectionalLight(0xfff2dd, 1.2);
      keyLight.position.set(4, 12, 6);
      scene.add(keyLight);
      const fillLight = new THREE.DirectionalLight(0x9bd0ff, 0.45);
      fillLight.position.set(-4, 6, -6);
      scene.add(fillLight);
      const rimLight = new THREE.DirectionalLight(0xffd9a0, 0.5);
      rimLight.position.set(10, 4, -8);
      scene.add(rimLight);

      function makeWoodTexture(base, dark, light, lines) {
        const c = document.createElement('canvas');
        c.width = 512;
        c.height = 512;
        const ctx = c.getContext('2d');
        ctx.fillStyle = base;
        ctx.fillRect(0, 0, 512, 512);
        for (let i = 0; i < lines; i++) {
          const y = Math.random() * 512;
          const w = 1 + Math.random() * 4;
          const amp = 2 + Math.random() * 6;
          ctx.strokeStyle = dark;
          ctx.globalAlpha = 0.08 + Math.random() * 0.2;
          ctx.lineWidth = w;
          ctx.beginPath();
          ctx.moveTo(0, y);
          for (let x = 0; x <= 512; x += 6) ctx.lineTo(x, y + Math.sin(x * 0.02 + i * 1.7) * amp);
          ctx.stroke();
        }
        for (let i = 0; i < lines * 0.4; i++) {
          const y = Math.random() * 512;
          const amp = 2 + Math.random() * 5;
          ctx.strokeStyle = light;
          ctx.globalAlpha = 0.05 + Math.random() * 0.12;
          ctx.lineWidth = 2 + Math.random() * 3;
          ctx.beginPath();
          ctx.moveTo(0, y);
          for (let x = 0; x <= 512; x += 6) ctx.lineTo(x, y + Math.sin(x * 0.02 + i) * amp);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        return tex;
      }

      const woodTex = makeWoodTexture('rgb(178,116,58)', 'rgba(56,30,6,1)', 'rgba(236,196,140,1)', 42);
      woodTex.repeat.set(0.15, 0.2);
      const woodTexDark = makeWoodTexture('rgb(122,74,30)', 'rgba(42,22,4,1)', 'rgba(196,148,90,1)', 34);

      const MAT = {
        wood: new THREE.MeshStandardMaterial({ map: woodTex, color: 0xffffff, roughness: 0.62, metalness: 0.05, bumpMap: woodTex, bumpScale: 0.5 }),
        maple: new THREE.MeshStandardMaterial({ color: 0xd9a05e, roughness: 0.55, metalness: 0.05 }),
        ebony: new THREE.MeshStandardMaterial({ color: 0x1a1a1f, roughness: 0.45, metalness: 0.05 }),
        ivory: new THREE.MeshStandardMaterial({ color: 0xf2ead8, roughness: 0.5, metalness: 0.05 }),
        fhole: new THREE.MeshStandardMaterial({ color: 0x120d08, roughness: 0.4, metalness: 0.1 }),
        bowWood: new THREE.MeshStandardMaterial({ map: woodTexDark, color: 0xffffff, roughness: 0.55, metalness: 0.05 }),
        hair: new THREE.MeshStandardMaterial({ color: 0xf5f2e8, roughness: 0.9, metalness: 0.0 }),
        gold: new THREE.MeshStandardMaterial({ color: 0xd9b35c, roughness: 0.35, metalness: 0.7 })
      };

      function addMesh(geo, mat, x, y, z) {
        const m = new THREE.Mesh(geo, mat);
        m.position.set(x, y, z);
        model.add(m);
        return m;
      }

      /* ボディ */
      function createBodyShape() {
        const s = new THREE.Shape();
        s.moveTo(12.5, 0);
        s.bezierCurveTo(12.6, 1.4, 12.2, 2.5, 10.8, 2.6);
        s.bezierCurveTo(9.6, 2.7, 9.2, 2.3, 8.7, 1.9);
        s.bezierCurveTo(8.0, 1.2, 8.2, 0.95, 7.6, 1.0);
        s.bezierCurveTo(6.4, 1.1, 6.6, 2.0, 5.6, 2.05);
        s.bezierCurveTo(4.6, 2.1, 4.1, 1.3, 4.0, 0);
        s.bezierCurveTo(4.1, -1.3, 4.6, -2.1, 5.6, -2.05);
        s.bezierCurveTo(6.6, -2.0, 6.4, -1.1, 7.6, -1.0);
        s.bezierCurveTo(8.2, -0.95, 8.0, -1.2, 8.7, -1.9);
        s.bezierCurveTo(9.2, -2.3, 9.6, -2.7, 10.8, -2.6);
        s.bezierCurveTo(12.2, -2.5, 12.6, -1.4, 12.5, 0);
        return s;
      }

      const bodyGeo = new THREE.ExtrudeGeometry(createBodyShape(), {
        depth: 0.7,
        bevelEnabled: true,
        bevelThickness: 0.12,
        bevelSize: 0.1,
        bevelSegments: 3
      });
      bodyGeo.rotateX(-Math.PI / 2);
      addMesh(bodyGeo, MAT.wood, 0, 0, 0);

      /* Fホール */
      function addFHole(sign) {
        const pts = [
          [8.7, 1.35], [9.05, 1.05], [9.45, 0.82], [9.9, 0.72], [10.3, 0.9], [10.55, 1.35]
        ].map(([x, z]) => new THREE.Vector3(x, 0.84, z * sign));
        const curve = new THREE.CatmullRomCurve3(pts);
        const tube = new THREE.TubeGeometry(curve, 24, 0.09, 8);
        addMesh(tube, MAT.fhole, 0, 0, 0);
      }
      addFHole(1);
      addFHole(-1);

      /* ネック・ペグボックス・スクロール */
      const neck = new THREE.Mesh(new THREE.BoxGeometry(3.7, 0.9, 0.7), MAT.wood);
      neck.position.set(4.1, 0.46, 0);
      model.add(neck);

      const pegbox = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.0, 0.5), MAT.wood);
      pegbox.position.set(1.65, 0.55, 0);
      model.add(pegbox);

      /* スクロール（アンモナイト状の渦巻き。ネックと同じ太さで、横に90度回転して立てる） */
      const spiralPts = [];
      const spiralTurns = 1.7;
      const spiralSteps = 120;
      const tubeR = 0.34;
      const cx = 0.75, cy = 1.0;
      for (let i = 0; i <= spiralSteps; i++) {
        const t = (i / spiralSteps) * spiralTurns * Math.PI * 2;
        const r = 0.45 + 0.35 * (i / spiralSteps);
        spiralPts.push(new THREE.Vector3(cx + r * Math.cos(t), cy + r * Math.sin(t) + 0.05 * (i / spiralSteps), 0));
      }
      const spiralMesh = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(spiralPts), spiralSteps, tubeR, 16, false), MAT.wood);
      model.add(spiralMesh);

      /* ペグ（横向き。側面に上下2本ずつ＝各弦1本） */
      const PEG_DEFS = [
        { z: 0.15, x: 1.45 },  // D 弦
        { z: 0.42, x: 2.15 },  // G 弦
        { z: -0.15, x: 1.45 }, // A 弦
        { z: -0.42, x: 2.15 }  // E 弦
      ];
      PEG_DEFS.forEach((p) => {
        const peg = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.7, 12), MAT.ebony);
        peg.rotation.x = Math.PI / 2;
        peg.position.set(p.x, 0.95, p.z);
        model.add(peg);
        const cap = new THREE.Mesh(new THREE.SphereGeometry(0.11, 12, 12), MAT.ebony);
        cap.position.set(p.x, 0.95, p.z + (p.z >= 0 ? 0.35 : -0.35));
        model.add(cap);
      });

      /* 指板 */
      const fingerboard = new THREE.Mesh(new THREE.BoxGeometry(4.0, 0.18, 0.85), MAT.ebony);
      fingerboard.position.set(4.9, 0.96, 0);
      model.add(fingerboard);

      /* 駒（ブリッジ） */
      const bridge = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.33, 1.7), MAT.maple);
      bridge.position.set(9.05, 0.99, 0);
      model.add(bridge);

      /* テールピース */
      const tailpiece = new THREE.Mesh(new THREE.BoxGeometry(1.05, 0.14, 1.9), MAT.ebony);
      tailpiece.position.set(11.0, 0.94, 0);
      model.add(tailpiece);

      function cylinderBetween(p1, p2, radius, mat) {
        const dir = new THREE.Vector3().subVectors(p2, p1);
        const len = dir.length();
        const geo = new THREE.CylinderGeometry(radius, radius, len, 10);
        geo.translate(0, len / 2, 0);
        const mesh = new THREE.Mesh(geo, mat);
        mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
        mesh.position.copy(p1);
        return mesh;
      }

      /* 弦（ナット → 駒 → テールピースまでつなぐ） */
      STRINGS.forEach((s) => {
        s.baseY = STR_Y;
        s.mat = new THREE.MeshStandardMaterial({ color: s.color, roughness: 0.35, metalness: 0.55, emissive: 0x000000 });

        const main = cylinderBetween(
          new THREE.Vector3(NUT_X, STR_Y, zAt(s, NUT_X)),
          new THREE.Vector3(BRIDGE_X, STR_Y, zAt(s, BRIDGE_X)),
          s.radius, s.mat
        );
        model.add(main);
        s.mesh = main;

        const tail = cylinderBetween(
          new THREE.Vector3(BRIDGE_X, STR_Y, zAt(s, BRIDGE_X)),
          new THREE.Vector3(TAIL_X, 1.02, zAt(s, BRIDGE_X)),
          s.radius, s.mat
        );
        model.add(tail);
      });

      /* 押さえ位置の〇（リング） */
      ring = new THREE.Mesh(
        new THREE.TorusGeometry(0.3, 0.05, 16, 40),
        new THREE.MeshStandardMaterial({ color: 0x29f2ff, emissive: 0x0fccff, emissiveIntensity: 0.9, transparent: true, opacity: 0.95 })
      );
      ring.rotation.y = Math.PI / 2;
      ring.visible = false;
      model.add(ring);

      const ringLight = new THREE.PointLight(0x29f2ff, 0, 5, 1.6);
      ring.add(ringLight);

      /* 弾いている音名の3D表示 */
      noteTexture = new THREE.CanvasTexture(noteCanvas);
      noteSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: noteTexture, transparent: true, depthWrite: false, opacity: 0 }));
      noteSprite.scale.set(2.6, 1.3, 1);
      noteSprite.visible = false;
      model.add(noteSprite);

      /* 弓 */
      bow = new THREE.Group();

      const stickCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, -0.03, -3.2),
        new THREE.Vector3(0, 0.26, 0),
        new THREE.Vector3(0, -0.03, 3.2)
      ]);
      const stick = new THREE.Mesh(new THREE.TubeGeometry(stickCurve, 40, 0.055, 8, false), MAT.bowWood);
      bow.add(stick);

      const hair = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 6.2, 12), MAT.hair);
      hair.rotation.x = Math.PI / 2;
      hair.position.set(0, -0.16, 0);
      bow.add(hair);

      const frog = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.32, 0.34), MAT.ebony);
      frog.position.set(0, 0.1, -3.12);
      bow.add(frog);

      const tip = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.18, 0.18), MAT.ivory);
      tip.position.set(0, 0.08, 3.15);
      bow.add(tip);

      const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.075, 0.7, 12), MAT.ebony);
      grip.rotation.x = Math.PI / 2;
      grip.position.set(0, 0.05, -2.6);
      bow.add(grip);

      model.add(bow);

      function updateBow(t) {        if (playing && activeNote) {
          const s = activeNote.s;
          const stroke = Math.sin(t * 6.5) * 0.28;
          bowTargetPos.set(activeNote.bowX, 1.34, zAt(s, activeNote.bowX) + stroke);
          bowTargetRot.set(0, 0, 0);
        } else {
          bowTargetPos.set(9.2 + Math.sin(t * 0.6) * 0.2, 2.6 + Math.sin(t * 0.9) * 0.12, -4.6);
          bowTargetRot.set(0.2, 0, -0.12);
        }
        bow.position.lerp(bowTargetPos, 0.16);
        bow.rotation.x += (bowTargetRot.x - bow.rotation.x) * 0.16;
        bow.rotation.y += (bowTargetRot.y - bow.rotation.y) * 0.16;
        bow.rotation.z += (bowTargetRot.z - bow.rotation.z) * 0.16;
      }

      function updateNoteSprite(t) {
        if (playing && activeNote) {
          noteSprite.visible = true;
          noteSprite.material.opacity = 0.9 + Math.sin(t * 8) * 0.1;
          noteSprite.position.set(
            activeNote.bowX,
            2.9 + Math.sin(t * 2) * 0.06,
            zAt(activeNote.s, activeNote.bowX) + 0.15
          );
        } else {
          noteSprite.material.opacity = Math.max(0, noteSprite.material.opacity - 0.08);
          if (noteSprite.material.opacity <= 0.01) noteSprite.visible = false;
        }
      }

      function updateRing(t) {
        if (ring.visible && activeNote) {
          ring.scale.setScalar(1 + Math.sin(t * 9) * 0.12);
          ringLight.intensity = 2.2;
        } else {
          ringLight.intensity = 0;
        }
      }

      function updateStrings(t) {
        STRINGS.forEach((s, i) => {
          const on = playing && activeNote && activeNote.s === s;
          s.mesh.position.y = s.baseY + (on ? Math.sin(t * 95 + i) * 0.012 : 0);
          s.mat.emissive.setHex(on ? 0x0c3340 : 0x000000);
          s.mat.emissiveIntensity = on ? 1 : 0;
        });
      }

      function resize() {
        const w = violinWrap.clientWidth || 1;
        const h = violinWrap.clientHeight || 1;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }

      function animate(time) {
        requestAnimationFrame(animate);
        const t = time * 0.001;
        updateBow(t);
        updateRing(t);
        updateNoteSprite(t);
        updateStrings(t);
        renderer.render(scene, camera);
      }

      resize();
      const resizeObserver = new ResizeObserver(resize);
      resizeObserver.observe(violinWrap);
      requestAnimationFrame(animate);

      visualOK = true;
    } catch (error) {
      console.error('3D 初期化に失敗しました:', error);
      hud.textContent = '3D 表示を初期化できませんでした（音声は再生できます）。';
    }

    /* ---------------- 音声再生 ---------------- */

    function loadLocalSongs() {
      const local = JSON.parse(localStorage.getItem('autoviolin_local_songs') || '[]');
      return local;
    }

    async function initFirebase() {
      try {
        const app = initializeApp(firebaseConfig);
        state.db = getFirestore(app);
      } catch (error) {
        state.db = null;
      }
    }

    async function loadSongs() {
      const songs = loadLocalSongs();

      if (state.db) {
        try {
          const q = query(collection(state.db, 'songs'), orderBy('createdAt', 'desc'));
          const result = await getDocs(q);
          result.forEach((docSnap) => {
            const data = docSnap.data();
            songs.push({ title: data.title || 'Untitled', notes: data.notes || [], createdAt: data.createdAt?.toDate?.() || new Date() });
          });
        } catch (error) {
          hud.textContent = 'Firestore 取得に失敗したため、ローカル保存されている曲を表示します。';
        }
      }

      state.songs = songs;
      if (!state.songs.length) {
        songSelect.innerHTML = '<option value="">保存済み曲がありません</option>';
        return;
      }

      songSelect.innerHTML = '';
      state.songs.forEach((song, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = song.title;
        songSelect.appendChild(option);
      });

      songSelect.value = '0';
      state.currentSong = state.songs[0];
      state.index = 0;
    }

    function preloadAllAudios() {
      Object.keys(NOTE_FILES).forEach((note) => {
        if (!state.audioCache.has(note)) {
          const audio = new Audio(`./${NOTE_FILES[note]}`);
          audio.preload = 'auto';
          audio.volume = 1;
          audio.load();
          state.audioCache.set(note, audio);
        }
      });
      hud.textContent = '音源を事前読み込みしました。';
    }

    function getAudio(note) {
      if (!state.audioCache.has(note)) {
        const audio = new Audio(`./${NOTE_FILES[note]}`);
        audio.preload = 'auto';
        audio.volume = 1;
        state.audioCache.set(note, audio);
      }
      return state.audioCache.get(note);
    }

    function playNote(note) {
      const template = getAudio(note);
      const audio = template.cloneNode();
      audio.currentTime = 0;
      audio.loop = false;
      audio.volume = 1;
      state.activeAudios.push(audio);
      audio.play().catch(() => {});
      violinWrap.classList.add('active');
      showVisual(note);
    }

    function stopNoteFade() {
      if (!state.activeAudios.length) {
        violinWrap.classList.remove('active');
        hideVisual();
        return;
      }

      if (state.fadeInterval) {
        clearInterval(state.fadeInterval);
      }

      state.fadeInterval = setInterval(() => {
        let stillPlaying = 0;
        state.activeAudios = state.activeAudios.filter((audio) => {
          if (!audio) return false;
          if (audio.volume <= 0.03) {
            audio.pause();
            audio.currentTime = 0;
            return false;
          }
          audio.volume = Math.max(0, audio.volume - 0.05);
          stillPlaying += 1;
          return true;
        });

        if (!stillPlaying) {
          clearInterval(state.fadeInterval);
          state.fadeInterval = null;
          violinWrap.classList.remove('active');
          hideVisual();
        }
      }, 45);
    }

    function playNextNote() {
      if (!state.currentSong || !state.currentSong.notes || !state.currentSong.notes.length) {
        return;
      }

      const note = state.currentSong.notes[state.index];
      if (!note) {
        state.index = 0;
        return;
      }

      playNote(note);
      state.index += 1;
    }

    songSelect.addEventListener('change', () => {
      const selected = Number(songSelect.value);
      const song = state.songs[selected];
      if (!song) return;
      state.currentSong = song;
      state.index = 0;
      hud.textContent = `曲「${song.title}」を選択しました。画面を押して演奏してください。`;
    });

    playArea.addEventListener('pointerdown', (event) => {
      if (event.button > 0) return;
      if (state.activePointerId !== null && state.activePointerId !== event.pointerId) return;
      state.activePointerId = event.pointerId;
      if (state.currentSong) {
        playNextNote();
      } else {
        hud.textContent = '先に曲を選んでください。';
      }
    });

    window.addEventListener('pointerup', () => {
      state.activePointerId = null;
      stopNoteFade();
    });

    window.addEventListener('pointerleave', () => {
      state.activePointerId = null;
      stopNoteFade();
    });

    window.addEventListener('pointercancel', () => {
      state.activePointerId = null;
      stopNoteFade();
    });

    document.getElementById('rotL').addEventListener('click', () => {
      if (model3D) model3D.rotation.y += Math.PI / 12;
    });

    document.getElementById('rotR').addEventListener('click', () => {
      if (model3D) model3D.rotation.y -= Math.PI / 12;
    });

    preloadAllAudios();
    initFirebase().then(loadSongs);
  </script>
</body>
</html>
