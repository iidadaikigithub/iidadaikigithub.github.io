// 筐体ライト自由配置（custom1.html→cabLights）＋プレイ中発光
function createCabLights(){
  cabLightObjs=[];
  const list=(CABLIGHTS&&CABLIGHTS.length)?CABLIGHTS:[{x:0,y:7.9,z:3.6,color:'#ffdd44',intensity:1.2,mode:'play'}];
  list.forEach(cfg=>{
    try{
      const col=new THREE.Color(cfg.color||'#ffffff');
      const li=new THREE.PointLight(col,cfg.intensity!=null?cfg.intensity:1.2,14);
      li.position.set(cfg.x||0,cfg.y!=null?cfg.y:7,cfg.z||0);
      scene.add(li);
      const bulb=new THREE.Mesh(
        new THREE.SphereGeometry(0.07,10,10),
        new THREE.MeshStandardMaterial({color:0x222222,emissive:col,emissiveIntensity:1.5,roughness:.3})
      );
      bulb.position.copy(li.position);
      scene.add(bulb);
      cabLightObjs.push({light:li,bulb,base:(cfg.intensity!=null?cfg.intensity:1.2),cfg});
    }catch(e){}
  });
}
function updateCabLights(t,dt){
  const playing=(state!==ST.WAIT&&state!==ST.RESULT&&state!==ST.RETURN);
  if(winFlashT>0)winFlashT=Math.max(0,winFlashT-(dt||0.016));
  cabLightObjs.forEach((o,i)=>{
    const m=o.cfg.mode||'play';
    if(m==='off'){o.light.intensity=0;o.bulb.material.emissiveIntensity=0.05;return;}
    if(m==='always'){o.light.intensity=o.base;o.bulb.material.emissiveIntensity=1.6;return;}
    if(m==='win'){
      if(winFlashT>0){const bl=(Math.sin(t*14+i)+1)/2;o.light.intensity=o.base*(1+bl*2);o.bulb.material.emissiveIntensity=1+bl*3;}
      else{o.light.intensity=o.base*0.25;o.bulb.material.emissiveIntensity=0.4;}
      return;
    }
    if(playing){const bl=(Math.sin(t*2.2+i*1.7)+1)/2;o.light.intensity=o.base*(1.0+bl*0.25);o.bulb.material.emissiveIntensity=1.3+bl*0.5;}
    else{o.light.intensity=o.base*0.35;o.bulb.material.emissiveIntensity=0.6;}
  });
}

// ===== 物理：床・ピット（落とし穴）・スロープ =====
function setupPhysics(){
  world=new CANNON.World();world.gravity.set(0,-12,0);
  world.solver.iterations=20;
  world.solver.tolerance=0.001;
  world.defaultContactMaterial.friction=.12;
  world.defaultContactMaterial.contactEquationStiffness=1e7;
  prizeMat=new CANNON.Material('prize');
  // 床（左）x[-3.85,-2.1] / （右）x[2.1,3.95] / （奥）z[-3.95,-3.0]／中央手前はボタン下まで開いた穴
  addStatBox(-2.975,FLOOR_Y-.05,-0.15,0.875,.05,3.8);
  addStatBox(3.025,FLOOR_Y-.05,-0.15,0.925,.05,3.8);
  addStatBox(0,FLOOR_Y-.05,-3.475,2.1,.05,.475);
  // ボタン下の台（手前フロアを底上げ：左右ストリップ＋ボタン直下のブリッジとその胴）
  addStatBox(-2.95,DECK_Y-.05,2.8,.85,.05,.5);
  addStatBox(2.95,DECK_Y-.05,2.8,.85,.05,.5);
  addStatBox(0,DECK_Y-.05,3.225,2.1,.05,.075);
  addStatBox(-2.95,(DECK_Y+FLOOR_Y)/2,2.8,.85,(DECK_Y-FLOOR_Y)/2,.5);
  addStatBox(2.95,(DECK_Y+FLOOR_Y)/2,2.8,.85,(DECK_Y-FLOOR_Y)/2,.5);
  // 外周の壁
  addStatBox(0,FLOOR_Y+3,-2.6,3.3,3,.25);
  addStatBox(0,FLOOR_Y+3,3.3,3.3,3,.25);
  addStatBox(-3.1,FLOOR_Y+3,0,.25,3,2.9);
  addStatBox(3.62,FLOOR_Y+3,0,.25,3,2.9);
  // ピットの地下壁（落ちた景品が横・奥へ逃げない／出口は手前＝受け皿）
  addStatBox(-2.12,.775,-.85,.04,.775,2.15);    // 左・奥側（床と同高の縁1.55）
  addStatBox(2.12,.775,-.85,.04,.775,2.15);     // 右・奥側
  addStatBox(-2.12,1.225,2.3,.04,1.225,1.0);  // 左・手前側（台の高さ2.45＝穴の縁）
  addStatBox(2.12,1.225,2.3,.04,1.225,1.0);   // 右・手前側
  // （手前＝出口なので閉じ壁は無い：ブリッジは操作台の構造材）
  // ピット底のスロープ（逆向き：奥z=-3.0・床と同高y=1.45 → 手前z=3.3・高さ0.0へ一直線＝手前へ流れる）
  const fm=new CANNON.Material('funnel');funnelMat=fm;
  // ※この物理エンジンはスロープ上でも摩擦が効きすぎて止まるので、坂だけ摩擦0（床はdefault .12）
  world.addContactMaterial(new CANNON.ContactMaterial(prizeMat,fm,{friction:0,restitution:0}));
  const funnel=new CANNON.Body({mass:0,material:fm});
  funnel.addShape(new CANNON.Box(new CANNON.Vec3(2.1,.04,3.2324)));
  funnel.position.set(0,.725,.15);
  funnel.quaternion.setFromAxisAngle(new CANNON.Vec3(1,0,0),.2264);
  funnel.collisionFilterGroup=1;funnel.collisionFilterMask=1|2;world.addBody(funnel);

// ===== 穴あき壁（景品と棒の間・穴は複数可：大きさ／位置／形をそれぞれ設定・重なりは差分で表現） =====
function holeRadius(sz){return 0.08+Math.max(1,Math.min(10,sz|0))*0.09;}
function holeApothem(R,shape){           // 中心〜穴の辺までの距離（参考値）
  const s=shape||'circle';
  if(s==='square')return R*0.885;
  if(s==='diamond')return R*0.7071;
  if(s==='triangle')return R*0.5;
  return R*Math.cos(Math.PI/24);         // 24角形近似のアポテム
}
function holePolygon(R,shape){           // 穴の外形（中心0,0・CCWに正規化）
  const s=shape||'circle',pts=[];
  if(s==='square'){const a=R*0.885;pts.push([a,a],[-a,a],[-a,-a],[a,-a]);}
  else if(s==='diamond'){pts.push([0,R],[-R,0],[0,-R],[R,0]);}
  else if(s==='triangle'){for(let i=0;i<3;i++){const a=Math.PI/2+i*Math.PI*2/3;pts.push([R*Math.cos(a),R*Math.sin(a)]);}}
  else{for(let i=0;i<24;i++){const a=i/24*Math.PI*2;pts.push([R*Math.cos(a),R*Math.sin(a)]);}}
  let ar=0;
  for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[(i+1)%pts.length];ar+=p[0]*q[1]-q[0]*p[1];}
  if(ar<0)pts.reverse();
  return pts;
}
function ptInHole(px,py,h){              // 点が穴の中か（h.ptsは中心基準・レイキャスティング）
  let inside=false;
  const pts=h.pts;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const xi=pts[i][0],yi=pts[i][1],xj=pts[j][0],yj=pts[j][1];
    if(((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi))inside=!inside;
  }
  return inside;
}
function openOdd(px,py){                 // 点が開口か＝奇数個の穴に含まれる（ブーリアン差分＝XOR）
  let c=0;
  for(let i=0;i<holeList.length;i++){if(ptInHole(px-holeList[i].x,py-holeList[i].y,holeList[i]))c++;}
  return (c%2)===1;
}
function buildHoleWall(cab,lipM){
  holeWallBody=null;holeWallGrp=null;holeList=[];
  if(!(CFG.holeWall|0))return;
  // 穴を整える（壁の内側にクランプ・重なりは許可＝かぶった部分は差分で壁が残る）
  const src=(Array.isArray(CFG.holes)?CFG.holes.slice(0,60):[]);
  src.forEach(h0=>{
    if(!h0||typeof h0!=='object')return;
    const r=Math.max(0.12,holeRadius(h0.size));
    const shape=(HOLE_SHAPES.indexOf(h0.shape)>=0)?h0.shape:'circle';
    const cx=Math.max(HOLEW.x0+r+0.04,Math.min(HOLEW.x1-r-0.04,Number(h0.x)||0));
    const cy=Math.max(HOLEW.y0+r+0.04,Math.min(HOLEW.y1-r-0.04,isFinite(Number(h0.y))?Number(h0.y):4.7));
    holeList.push({x:cx,y:cy,r:r,shape:shape,pts:holePolygon(r,shape)});
  });
  if(!holeList.length)return;
  // ---- 見た目（キャンバス描画のパネル：evenodd＝かぶった部分は差分として壁が残る） ----
  const grp=new THREE.Group();
  const cvW=1480,cvH=Math.round(cvW*(HOLEW.y1-HOLEW.y0)/(HOLEW.x1-HOLEW.x0));
  const pxU=cvW/(HOLEW.x1-HOLEW.x0);
  const cvs=document.createElement('canvas');cvs.width=cvW;cvs.height=cvH;
  const ctx=cvs.getContext('2d');
  const toX=x=>(x-HOLEW.x0)*pxU,toY=y=>cvH-(y-HOLEW.y0)*(cvH/(HOLEW.y1-HOLEW.y0));
  function holePath2D(h){
    ctx.beginPath();
    if(h.shape==='circle')ctx.arc(toX(h.x),toY(h.y),h.r*pxU,0,Math.PI*2);
    else h.pts.forEach((p,i)=>{const X=toX(h.x+p[0]),Y=toY(h.y+p[1]);(i===0)?ctx.moveTo(X,Y):ctx.lineTo(X,Y);});
    ctx.closePath();
  }
  ctx.fillStyle='rgba(191,214,238,0.34)';ctx.fillRect(0,0,cvW,cvH);
  ctx.globalCompositeOperation='destination-out';       // 穴を抜く（evenodd＝重なりは差分）
  ctx.beginPath();
  holeList.forEach(h=>{
    if(h.shape==='circle'){ctx.moveTo(toX(h.x)+h.r*pxU,toY(h.y));ctx.arc(toX(h.x),toY(h.y),h.r*pxU,0,Math.PI*2);}
    else h.pts.forEach((p,i)=>{const X=toX(h.x+p[0]),Y=toY(h.y+p[1]);(i===0)?ctx.moveTo(X,Y):ctx.lineTo(X,Y);});
    ctx.closePath();
  });
  ctx.fill('evenodd');
  ctx.globalCompositeOperation='source-over';
  ctx.lineWidth=Math.max(6,0.1*pxU);ctx.strokeStyle='#f5f0e8';   // 各穴の白い縁
  holeList.forEach(h=>{holePath2D(h);ctx.stroke();});
  const tex=new THREE.CanvasTexture(cvs);
  tex.colorSpace=THREE.SRGBColorSpace;
  const pm=new THREE.MeshStandardMaterial({map:tex,transparent:true,roughness:.25,metalness:.08,side:THREE.DoubleSide});
  const panel=new THREE.Mesh(new THREE.PlaneGeometry(HOLEW.x1-HOLEW.x0,HOLEW.y1-HOLEW.y0),pm);
  panel.position.set((HOLEW.x0+HOLEW.x1)/2,(HOLEW.y0+HOLEW.y1)/2,HOLEW.z);
  grp.add(panel);
  cab.add(grp);holeWallGrp=grp;
  // ---- 物理（0.15間隔のグリッドで「開口（奇数個の穴の内側）」以外を埋める） ----
  const body=new CANNON.Body({mass:0});
  const hz=HOLEW.t/2;
  const nx=Math.max(1,Math.round((HOLEW.x1-HOLEW.x0)/0.15)),ny=Math.max(1,Math.round((HOLEW.y1-HOLEW.y0)/0.15));
  const cw=(HOLEW.x1-HOLEW.x0)/nx,ch=(HOLEW.y1-HOLEW.y0)/ny;
  for(let iy=0;iy<ny;iy++){
    const yc=HOLEW.y0+(iy+0.5)*ch;
    let run=-1;
    for(let ix=0;ix<=nx;ix++){
      let solid=false;
      if(ix<nx){
        const xc=HOLEW.x0+(ix+0.5)*cw;
        solid=!openOdd(xc,yc);
      }
      if(solid&&run<0)run=ix;
      if(run>=0&&!solid){
        const x0=HOLEW.x0+run*cw,x1=HOLEW.x0+ix*cw;
        if(x1-x0>1e-6){
          const box=new CANNON.Box(new CANNON.Vec3((x1-x0)/2,ch/2,hz));
          body.addShape(box,new CANNON.Vec3((x0+x1)/2,yc,HOLEW.z));
        }
        run=-1;
      }
    }
  }
  body.collisionFilterGroup=1;body.collisionFilterMask=1|2;
  world.addBody(body);holeWallBody=body;
}
// 棒が開口（差分を考慮した穴の合わさった形）を通れるか（通れる=null／塞がり=壁の手前で止めるext上限）
function wallExtCap(rd){
  if(!(CFG.holeWall|0)||!holeWallBody||!holeList.length)return null;
  const rr=rd+0.015;                       // 少し余裕を持たせて判定
  const N=28;
  for(let k=0;k<N;k++){
    const a=k/N*Math.PI*2;
    if(!openOdd(craneX+Math.cos(a)*rr,rodY+Math.sin(a)*rr))return ROD_Z0-(HOLEW.z+HOLEW.t/2+rd+0.01);
  }
  if(!openOdd(craneX,rodY))return ROD_Z0-(HOLEW.z+HOLEW.t/2+rd+0.01);
  return null;
}

// 棒のパラメータ（太さ・長さ・勢い・形・弾力性）
function pushParams(){
  const th=Math.max(1,Math.min(10,CFG.rodThick|0));
  const r=0.035+th*0.013;                                   // 棒の半径
  const thickPen=1-(th-1)/9*0.25;                           // 太いほど力が分散
  const Fbase=0.6+Math.max(1,Math.min(10,CFG.pushPow))*0.85;// 押しだす勢い
  const shapeF=0.35+Math.max(0,Math.min(10,CFG.rodShape))*0.095; // 丸い→すべる／とがる→引っかかる
  const flexF=1+Math.max(0,Math.min(10,CFG.rodFlex))*0.04;   // 弾力性（バネで力が増える）
  const speed=0.8+Math.max(1,Math.min(10,CFG.pushPow))*0.25;
  const extMax=2.0+Math.max(1,Math.min(10,CFG.pushLen))*0.32;
  return {r:r,F:Fbase*shapeF*flexF*thickPen,speed:speed,extMax:extMax,cone:(CFG.rodShape>=5)};
}
function rodRadius(){return pushParams().r;}

function updRigVis(){
  if(!rigGrp)return;
  carGrp.position.set(craneX,RAIL_Y,RAIL_Z);
  mastGrp.position.set(craneX,RAIL_Y-3.3,RAIL_Z);
  rodGrp.position.set(craneX,rodY,ROD_Z0);
  rodGrp.rotation.x=-rodBend;        // 奥へ押すと先端が下がる
  const p=pushParams();
  const len=Math.max(.12,ext);
  rodMesh.scale.set(p.r/0.5,len,p.r/0.5);
  rodMesh.position.set(0,0,0);
  // 先端の形（とがった＝円錐／丸い＝球）
  if(p.cone&&rodTipMesh.geometry.type!=='ConeGeometry'){
    rodTipMesh.geometry.dispose();rodTipMesh.geometry=new THREE.ConeGeometry(.5,1,14);rodTipMesh.geometry.translate(0,.5,0);
  }else if(!p.cone&&rodTipMesh.geometry.type!=='SphereGeometry'){
    rodTipMesh.geometry.dispose();rodTipMesh.geometry=new THREE.SphereGeometry(.5,12,10);
  }
  const tipR=(p.cone?0.62:1.0);
  rodTipMesh.scale.set(p.r*tipR/0.5,p.r*1.3/0.5,p.r*tipR/0.5);
  rodTipMesh.position.set(0,0,-len-(p.cone?0:p.r));
  if(aimGrp){
    aimGrp.position.set(craneX,rodY,ROD_Z0);
    aimGrp.visible=aimOn;
  }
}

// ===== 景品スロット（4列×4段のグリッド・奥行きは全部同じz=RACK_Z＝手前穴の真上） =====
function buildSlots(){
  SLOTS=[];
  const n=Math.max(4,Math.min(NSLOT,CFG.prize|0));
  const Y0=3.4,Y1=7.3;
  const rows=Math.ceil(n/4);
  let idx=0;
  for(let k=0;k<rows&&idx<n;k++){
    const cy=rows===1?(Y0+Y1)/2:Y0+k*(Y1-Y0)/(rows-1);
    const bar=cy+RING_TOP_OFF+0.28;          // 最大サイズの景品でも上端が揃う高さ
    const cnt=Math.min(4,n-idx);
    for(let j=0;j<cnt;j++){
      const info=prizeInfo.length?prizeInfo[prizeOrder[idx%prizeOrder.length]]:null;
      const slotSz=info&&info.size?info.size:CFG.psz;
      const sz=Math.min(0.28+(Number(slotSz)||5)*0.05,0.56);
      SLOTS.push({x:(j-(cnt-1)/2)*1.0,z:RACK_Z,y:bar-RING_TOP_OFF-sz/2,bar:bar,sz:sz});
      idx++;
    }
  }
}
function createPrizes(){
  for(let i=0;i<SLOTS.length;i++){
    const sp=SLOTS[i];
    const slotInfo=prizeInfo.length?prizeInfo[prizeOrder[i%prizeOrder.length]]:null;
    const sz=sp.sz;
    const col=prizeCol[i%prizeCol.length];
    const tex=prizeImgTextures.length?prizeImgTextures[prizeOrder[i%prizeOrder.length]]:null;
    const shape=slotInfo&&slotInfo.shape?slotInfo.shape:'sphere';
    let m;
    if(shape==='box'){
      const boxMat=new THREE.MeshStandardMaterial({color:col,roughness:0.6,metalness:0.05});
      m=new THREE.Mesh(new THREE.BoxGeometry(sz,sz,sz),boxMat);m.castShadow=true;m.receiveShadow=true;
      if(tex){
        tex.colorSpace=THREE.SRGBColorSpace;
        const planeSz=sz*0.88;
        const pMat=new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide});
        const p1=new THREE.Mesh(new THREE.PlaneGeometry(planeSz,planeSz),pMat);p1.position.set(0,0,sz/2+0.011);m.add(p1);
        const p2=new THREE.Mesh(new THREE.PlaneGeometry(planeSz,planeSz),pMat.clone());p2.position.set(0,0,-sz/2-0.011);p2.rotation.y=Math.PI;m.add(p2);
      }
    }else{
      const outerMat=new THREE.MeshPhysicalMaterial({color:0xffffff,transparent:true,opacity:0.18,roughness:0.05,metalness:0.05,clearcoat:1,clearcoatRoughness:0.05,envMapIntensity:0.5,side:THREE.DoubleSide,depthWrite:false});
      m=new THREE.Mesh(new THREE.SphereGeometry(sz/2,24,24),outerMat);m.castShadow=true;m.receiveShadow=true;
      if(tex){
        tex.colorSpace=THREE.SRGBColorSpace;
        const plane=new THREE.Mesh(new THREE.PlaneGeometry(sz*0.62,sz*0.62),new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide}));
        plane.renderOrder=2;m.add(plane);m.userData.plane=plane;
      }else{
        m.add(new THREE.Mesh(new THREE.SphereGeometry(sz/2*.92,16,16),new THREE.MeshStandardMaterial({color:col,roughness:0.5,metalness:0.05})));
      }
    }
    const topY=sp.bar-RING_TOP_OFF,cy=topY-sz/2;
    m.position.set(sp.x,cy,sp.z);
    m.userData.info=slotInfo;
    m.userData.color='#'+col.toString(16).padStart(6,'0');
    scene.add(m);prizeMeshes.push(m);prizeSizes.push(sz);
    // 開口付きフック（C字・L字風）：開口は手前側(+Z)。景品を奥(-Z)へ押すとバーが開口から抜ける
    const gapA=1.5;                                   // 開口の角度（約86°）
    const rg=new THREE.TorusGeometry(.1,.018,8,20,Math.PI*2-gapA);
    rg.rotateZ(gapA/2);                               // 開口をθ=0（+X）方向へ寄せる
    rg.rotateY(-Math.PI/2);                           // +X→+Z：開口が手前を向く／輪の軸はバー方向(X)
    const ring=new THREE.Mesh(rg,M.chrome);
    ring.position.set(sp.x,sp.bar-.05,sp.z);ring.castShadow=true;scene.add(ring);
    const link=new THREE.Mesh(new THREE.CylinderGeometry(.014,.014,.07,6),M.cl);
    link.position.set(sp.x,sp.bar-.175,sp.z);scene.add(link);
    anchors.push(new CANNON.Vec3(sp.x,topY,sp.z));
    hooked.push(true);
    prizeGroups.push({ring:ring,link:link});
    const b=new CANNON.Body({mass:Math.max(0.05,CFG.prizeW*0.2*sz),material:prizeMat});
    if(shape==='box')b.addShape(new CANNON.Box(new CANNON.Vec3(sz/2,sz/2,sz/2)));else b.addShape(new CANNON.Sphere(sz/2));
    b.position.set(sp.x,cy,sp.z);
    if(shape==='box'){b.linearDamping=.15;b.angularDamping=.18;}else{b.linearDamping=.2;b.angularDamping=.5;}
    b.collisionFilterGroup=2;b.collisionFilterMask=1|2;
    world.addBody(b);prizeBodies.push(b);
  }
}
// 吊るしてある状態に戻す（フロアに落ち直した景品を再掛け）
function reHangPrizes(){
  for(let i=prizeBodies.length-1;i>=0;i--){
    const b=prizeBodies[i];
    if(hooked[i])continue;
    if(b.position.z<-3.05){removePrize(i);continue;} // 取り出し口の外（景品台）へ出た景品は撤去（二重勝ち・誤勝ち防止）
    const rp=prizeSizes[i]/2,a=anchors[i];
    b.position.set(a.x,a.y-rp,a.z);
    b.velocity.set(0,0,0);b.angularVelocity.set(0,0,0);
    b.quaternion.set(0,0,0,1);
    hooked[i]=true;
  }
}

function startPush(){state=ST.PUSH;ext=0;pushTimer=0;contactIdx=-1;holeWin=false;wonIdx=-1;sPush();updateUI();}

// 棒が押している景品を探す（X/Yが重なり、先端が届いた最初＝最も手前の景品）
function findContact(){
  const p=pushParams(),tip=ROD_Z0-ext;
  let best=null;
  for(let i=0;i<prizeBodies.length;i++){
    if(!hooked[i])continue;
    const m=prizeMeshes[i],rp=prizeSizes[i]/2;
    const dx=Math.abs(craneX-m.position.x);
    if(dx>p.r+rp)continue;
    if(rodY<m.position.y-rp-p.r||rodY>m.position.y+rp+p.r)continue;
    const face=m.position.z+rp;
    if(tip>face+0.02)continue;
    if(!best||face>best.face+1e-6||(Math.abs(face-best.face)<1e-4&&dx<best.dx))best={i:i,face:face,dx:dx,rp:rp};
  }
  return best;
}

function updatePush(dt){
  if(state===ST.PUSH){
    const p=pushParams();
    ext+=p.speed*dt;
    // 穴あき壁：棒が穴を通れないときは壁の手前で止まる
    const wCap=wallExtCap(p.r);
    const effMax=(wCap===null)?p.extMax:Math.min(p.extMax,wCap);
    if(ext>effMax)ext=effMax;
    const c=findContact();
    if(c){
      if(contactIdx!==c.i){contactIdx=c.i;sClank();}
      const face=prizeMeshes[c.i].position.z+c.rp;
      const allowed=Math.min(ROD_Z0-face,effMax);
      if(ext>allowed)ext=allowed;          // 景品に当たったら先はそれ以上入らない
      pushTimer+=dt;
      if(!hooked[c.i]){state=ST.RET;sRet();}           // 外れた！即リトラクト
      else if(pushTimer>=PUSH_HOLD){state=ST.RET;sRet();}
    }else if(contactIdx>=0){
      // 押した相手が見つからなくなった（外れた等）
      state=ST.RET;sRet();
    }else if(ext>=effMax-1e-6){
      ext=effMax;state=ST.RET;sRet();    // 壁に当たった／空を押した＝届かなかった
    }
  }else if(state===ST.RET){
    const p=pushParams();
    ext-=p.speed*1.6*dt;
    contactIdx=-1;
    if(ext<=0){ext=0;state=ST.WATCH;armTimer=0;}
  }else if(state===ST.WATCH){
    armTimer+=dt;
    if(armTimer>=WATCH_T)showRes(holeWin);
  }else if(state===ST.RETURN){
    armTimer+=dt;
    const te=Math.min(armTimer/0.6,1),t=te*te*(3-2*te);
    craneX=dropStartX+(PX_MIN-dropStartX)*t;
    rodY=dropStartY+(Y_MIN-dropStartY)*t;
    if(armTimer>=0.6){craneX=PX_MIN;rodY=Y_MIN;ext=0;state=ST.WAIT;armTimer=0;reHangPrizes();updateUI();}
  }
  // 棒の弾力性（押してる間は曲がり、離れてからバネで揺れる）
  if(state===ST.PUSH&&contactIdx>=0){
    const target=0.02+(CFG.rodFlex/10)*0.11;
    rodBend+=(target-rodBend)*Math.min(1,dt*10);
    rodBendV=0;
  }else if(Math.abs(rodBend)>0.0005||Math.abs(rodBendV)>0.0005){
    const k=60/(1+CFG.rodFlex*0.35);
    rodBendV+=(-k*rodBend-4*rodBendV)*dt;
    rodBend+=rodBendV*dt;
  }else{rodBend=0;rodBendV=0;}
  updRigVis();
}

  else if(state===ST.VMOV){rodY+=SPD_Y*(CFG.spd/50)*dt;if(rodY>=Y_MAX){rodY=Y_MAX;state=ST.VSTOP;mtrOff();sMtrOff();setTimeout(startPush,300);}}

let wonIdx=-1;
const HOOK_K=40,HOOK_C=7;            // 吊りバネの強さ・減衰（景品の質量に比例）
const DISL_FWD=0.14;                 // 開口（手前）からバーが抜けるまでの奥方向(-Z)の移動量
const LAUNCH_MAX=2.0,AIR_DRAG=0.94;  // 外れた直後の水平速度の上限／空中での水平減速
const UP_V=new THREE.Vector3(0,1,0);
function removePrize(i){
  try{
    const m=prizeMeshes[i];if(m)scene.remove(m);
    const g=prizeGroups[i];if(g){if(g.ring)scene.remove(g.ring);if(g.link)scene.remove(g.link);}
    const b=prizeBodies[i];if(b)world.removeBody(b);
    prizeMeshes.splice(i,1);prizeSizes.splice(i,1);anchors.splice(i,1);
    hooked.splice(i,1);prizeGroups.splice(i,1);prizeBodies.splice(i,1);
    if(contactIdx===i)contactIdx=-1;else if(contactIdx>i)contactIdx--;
  }catch(e){}
}
// リングと吊りリンクを景品に追従させる
function syncHang(i){
  const m=prizeMeshes[i],g=prizeGroups[i],a=anchors[i];
  if(!m||!g||!a)return;
  try{
    const rp=prizeSizes[i]/2;
    const rx=m.position.x;
    const ry=hooked[i]?a.y+0.15:m.position.y+rp+0.07;
    const rz=m.position.z;
    g.ring.position.set(rx,ry,rz);
    // 押し出されるほどフックが前方へ傾き、開口からバーが抜ける
    if(hooked[i]){
      const prog=Math.max(0,Math.min(1,(a.z-m.position.z)/DISL_FWD));
      g.ring.rotation.x=prog*0.45;
    }else g.ring.rotation.x=0;
    const top=m.position.y+rp,y0=ry-0.05;
    const dx=m.position.x-rx,dy=top-y0,dz=m.position.z-rz;
    const len=Math.sqrt(dx*dx+dy*dy+dz*dz);
    g.link.position.set((rx+m.position.x)/2,(y0+top)/2,(rz+m.position.z)/2);
    g.link.scale.y=Math.max(0.05,len/0.07);
    if(len>0.001)g.link.quaternion.setFromUnitVectors(UP_V,new THREE.Vector3(dx,dy,dz).normalize());
  }catch(e){}
}
function updatePhysics(dt){
  dt=dt||1/60;
  // 景品＝リングから吊るされる（振り子バネ＋重力補償）
  for(let i=0;i<prizeBodies.length;i++){
    const b=prizeBodies[i];if(!b||!hooked[i])continue;
    b.wakeUp();
    const a=anchors[i],rp=prizeSizes[i]/2,m=b.mass;
    const dx=a.x-b.position.x,dy=a.y-rp-b.position.y,dz=a.z-b.position.z;
    const k=HOOK_K*m,c=HOOK_C*m;
    b.applyForce(new CANNON.Vec3(k*dx-c*b.velocity.x,
                                 k*dy-c*b.velocity.y+12*m,
                                 k*dz-c*b.velocity.z),b.position);
    // 開口（手前側）からバーが抜ける＝奥(-Z)へ押しだされた分だけ外れる
    if(a.z-b.position.z>=DISL_FWD){
      hooked[i]=false;
      const hv=Math.sqrt(b.velocity.x*b.velocity.x+b.velocity.z*b.velocity.z);
      if(hv>LAUNCH_MAX){const s=LAUNCH_MAX/hv;b.velocity.x*=s;b.velocity.z*=s;}
      sClank();
    }
  }
  // 棒の押し出し力（接触している景品を奥(-Z)＝落とし穴側へ押す）
  if(state===ST.PUSH&&contactIdx>=0&&contactIdx<prizeBodies.length&&hooked[contactIdx]){
    const b=prizeBodies[contactIdx],m=prizeMeshes[contactIdx];
    if(b&&m){
      const p=pushParams(),rp=prizeSizes[contactIdx]/2;
      const align=Math.max(0.3,1-Math.abs(rodY-m.position.y)/(rp+p.r));
      b.wakeUp();
      b.applyForce(new CANNON.Vec3(0,0,-p.F*align),b.position);
    }
  }
  world.step(1/60,dt,3);
  for(let i=prizeBodies.length-1;i>=0;i--){
    const b=prizeBodies[i],m=prizeMeshes[i];
    if(!b||!m)continue;
    if(b.position.y<-8){removePrize(i);continue;}
    m.position.copy(b.position);m.quaternion.copy(b.quaternion);
    syncHang(i);
    const pos=b.position;
    if(!hooked[i]&&pos.y>3.0){b.velocity.x*=AIR_DRAG;b.velocity.z*=AIR_DRAG;}
    if((state===ST.PUSH||state===ST.RET||state===ST.WATCH)&&
       pos.y<2.9&&pos.x>-2.05&&pos.x<2.05&&pos.z>-3.05&&pos.z<3.3&&!holeWin){
      holeWin=true;wonIdx=i;
    }
  }
}
// =====================================================
//  ループ
// =====================================================
let lastFrameT=0;
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now();
  const dt=Math.min(0.05,Math.max(0.001,(now-lastFrameT)/1000));
  lastFrameT=now;
  if(controls)controls.update();
  updateGame(dt);
  updatePhysics(dt);
  updateCabLights(now/1000,dt);
  if(renderer)renderer.render(scene,camera);
}
// =====================================================
//  結果表示
// =====================================================
function showRes(won){
  state=ST.RESULT;
  // ピット内に落ちた景品／取り出し口の外へ出た景品＝獲得
  const inBox=pos=>pos.y<2.9&&pos.x>-2.05&&pos.x<2.05&&pos.z>-3.05&&pos.z<3.3;
  const outBox=pos=>pos.y<1.45&&pos.y>-0.6&&pos.z<-3.05&&Math.abs(pos.x)<4;
  const got=[];
  for(let i=0;i<prizeBodies.length;i++){
    const pos=prizeBodies[i].position;
    if(inBox(pos)||outBox(pos)||(won&&i===wonIdx))got.push(i);
  }
  if(won&&wonIdx>=0&&got.indexOf(wonIdx)<0)got.push(wonIdx);
  got.sort((a,b)=>b-a);
  got.forEach(i=>{
    const m=prizeMeshes[i],info=(m&&m.userData.info)||null;
    wonPrizes.push({
      imgId:(info&&info.imgId)||'',
      name:(info&&info.name)||'景品',
      desc:(info&&info.desc)||'',
      color:(m&&m.userData.color)||'#888888'
    });
    removePrize(i);
  });
  renderWinPanel();
  rT.textContent=won?'🎉 ゲット！ 🎉':'残念…';
  rM.textContent=(won?'ピットに落ちました！':'落とせませんでした…')+'　累計 '+wonPrizes.length+' 個';
  resOv.style.display='flex';
  if(won){winFlashT=2.2;sWin();}else{sLose();}
  saveScore();
  updateUI();
}
// =====================================================
//  獲得景品パネル
// =====================================================
function renderWinPanel(){
  try{
    const wp=document.getElementById('winPanel');
    if(!wp)return;
    wp.innerHTML='<div class="wh">獲得景品 ('+wonPrizes.length+')</div>';
    wonPrizes.forEach(w=>{
      const d=document.createElement('div');
      d.className='wi';
      const url=(w.imgId&&IMG_MAP[w.imgId])||w.img||'';
      if(url){const im=document.createElement('img');im.src=url;d.appendChild(im);}
      else{d.style.background=w.color||'#555';d.style.color='#FFD700';d.style.fontWeight='700';d.textContent='🎁';}
      d.title=w.name||'';
      d.onclick=()=>{
        const pi=document.getElementById('pmImg');
        if(url){pi.src=url;pi.style.display='';}else{pi.style.display='none';}
        document.getElementById('pmName').textContent=w.name||'景品';
        document.getElementById('pmDesc').textContent=w.desc||'';
        document.getElementById('prizeModal').classList.add('show');
      };
      wp.appendChild(d);
    });
  }catch(e){}
}
function saveScore(){
  // ※獲得景品リストは保存しない（リロードごとにリセットする仕様）
  try{if(db)db.collection('players').doc(DOC).set({name:PLAYER||'ゲスト',wonCount:wonPrizes.length,ts:Date.now()},{merge:true});}catch(e){}
}
// =====================================================
//  ロード（オフラインJSON → Firestore）
// =====================================================
let db=null;
const IMG_MAP={};
function applySettings(d){
  if(!d||typeof d!=='object')return;
  try{
    for(const k in CFG_DEF)if(typeof d[k]==='number')CFG[k]=d[k];
    if(Array.isArray(d.holes)){
      const arr=[];
      d.holes.forEach(h=>{
        if(!h||typeof h!=='object'||arr.length>=20)return;
        const size=Math.max(1,Math.min(10,Number(h.size)|0||5));
        arr.push({x:(isFinite(Number(h.x))?Number(h.x):0.5),
                  y:(isFinite(Number(h.y))?Number(h.y):4.7),
                  size:size,shape:(HOLE_SHAPES.indexOf(h.shape)>=0)?h.shape:'circle'});
      });
      CFG.holes=arr;
    }else if(d.holeSize!==undefined||d.holeX!==undefined||d.holeY!==undefined||d.holeShape!==undefined){
      // 旧形式（穴1個）の保存データを移行
      CFG.holes=[{x:(isFinite(Number(d.holeX))?Number(d.holeX):0.5),
                  y:(isFinite(Number(d.holeY))?Number(d.holeY):4.7),
                  size:Math.max(1,Math.min(10,Number(d.holeSize)|0||5)),
                  shape:(HOLE_SHAPES.indexOf(d.holeShape)>=0)?d.holeShape:'circle'}];
    }
    if(d.cabinetColors&&typeof d.cabinetColors==='object')Object.assign(CABCOL,d.cabinetColors);
    if(Array.isArray(d.cabLights)&&d.cabLights.length)CABLIGHTS=d.cabLights.slice(0,6);
    if(d.bgm&&typeof d.bgm==='object')BGMC={file:d.bgm.file||'none',volume:(typeof d.bgm.volume==='number'?d.bgm.volume:0.4)};
    if(Array.isArray(d.prizeImages))buildPrizeData(d.prizeImages);
    if(d.wallImages&&typeof d.wallImages==='object')buildWalls(d.wallImages);
  }catch(e){}
}
function buildPrizeData(list){
  prizeInfo=[];prizeImgTextures=[];prizeOrder=[];
  if(!list.length)return;
  const loader=new THREE.TextureLoader();
  list.forEach(it=>{
    if(!it||!it.imgId)return;
    prizeInfo.push(it);
    let tex=null;
    const url=IMG_MAP[it.imgId];
    if(url){try{tex=loader.load(url);tex.colorSpace=THREE.SRGBColorSpace;}catch(e){tex=null;}}
    prizeImgTextures.push(tex);
  });
  if(!prizeInfo.length)return;   // 画像が1つも無ければ抽選しない（空リストで無限ループになる防止）
  // 景品画像をスロットへランダムに割り当てる（リロードのたびに再抽選＝画像数が足りなくても等間隔にならない）
  const n=Math.max(4,Math.min(NSLOT,CFG.prize|0));
  while(prizeOrder.length<n){
    const bag=[];
    for(let i=0;i<prizeInfo.length;i++)bag.push(i);
    if(!bag.length)break;        // 念のため（通常は上の return で抜けてる）
    for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=bag[i];bag[i]=bag[j];bag[j]=t;}
    for(let k=0;k<bag.length&&prizeOrder.length<n;k++)prizeOrder.push(bag[k]);
  }
}
function buildWalls(map){
  const loader=new THREE.TextureLoader();
  ['back','front','left','right'].forEach(k=>{
    const id=map[k];if(!id)return;
    const url=IMG_MAP[id];if(!url)return;
    try{wallTex[k]=loader.load(url);}catch(e){}
  });
}
function loadFB(){
  let lf=null;
  try{lf=JSON.parse(localStorage.getItem('craneCfg')||'null');}catch(e){}
  if(!lf||typeof lf!=='object')lf={};
  // custom1（筐体色・ライト・BGM・壁）のオフライン保存（クラウド設定が無ければこれで表示）
  try{const cu=JSON.parse(localStorage.getItem('craneCustom')||'null');if(cu&&typeof cu==='object')Object.assign(lf,cu);}catch(e){}
  // hole1（穴あき壁）のオフライン保存
  try{const hl=JSON.parse(localStorage.getItem('craneHole')||'null');if(hl&&typeof hl==='object')Object.assign(lf,hl);}catch(e){}
  try{const im=JSON.parse(localStorage.getItem('craneImgs')||'null');if(im&&typeof im==='object')Object.assign(IMG_MAP,im);}catch(e){}
  // 獲得景品はリロードごとにリセット：旧バージョンの保存データも消去する
  try{localStorage.removeItem('craneWon__'+DOC);}catch(e){}
  if(!window.firebase||!firebase.firestore){applySettings(lf);return Promise.resolve();}
  try{db=firebase.firestore();}catch(e){applySettings(lf);return Promise.resolve();}
  const imgsP=db.collection('images').get().then(snap=>{
    snap.forEach(dd=>{const t=dd.data();if(t&&t.data)IMG_MAP[dd.id]='data:image/jpeg;base64,'+t.data;});
  }).catch(()=>{});
  const setP=db.collection('settings').doc(DOC).get().then(doc=>{
    if(doc&&doc.exists){const d=doc.data();if(d)Object.assign(lf,d);}
  }).catch(()=>{});
  return Promise.all([imgsP,setP]).then(()=>{applySettings(lf);}).catch(()=>{applySettings(lf);});
}
// テスト用：内部状態の参照（通常プレイには影響しない）
window.__dbg=function(){
  return {state:state,craneX:craneX,rodY:rodY,ext:ext,holeWin:holeWin,contactIdx:contactIdx,
    CFG:Object.assign({},CFG),ST:ST,
    wall:{on:(CFG.holeWall|0),holes:holeList.map(h=>({x:+h.x.toFixed(2),y:+h.y.toFixed(2),r:+h.r.toFixed(2),shape:h.shape}))},
    phys:{allowSleep:world&&world.allowSleep,defFric:world&&world.defaultContactMaterial.friction,
      cms:(world&&world.contactmaterials||[]).map(function(c){return {a:c.materials[0]&&c.materials[0].name,b:c.materials[1]&&c.materials[1].name,f:c.friction};}),
      p0:prizeBodies[0]?{vz:+prizeBodies[0].velocity.z.toFixed(3),vy:+prizeBodies[0].velocity.y.toFixed(3),ss:prizeBodies[0].sleepState,al:prizeBodies[0].allowSleep,linDamp:prizeBodies[0].linearDamping}:null},
    slots:SLOTS.map(function(s){return {x:s.x,y:+s.y.toFixed(3),bar:+s.bar.toFixed(3),sz:s.sz};}),
    anch:anchors.map(function(a){return {y:+a.y.toFixed(3)};}),
    sizes:prizeSizes.slice(),
    prizes:prizeBodies.map(function(b,i){
      return {i:i,hooked:hooked[i],
        x:+b.position.x.toFixed(3),y:+b.position.y.toFixed(3),z:+b.position.z.toFixed(3),
        name:(prizeMeshes[i]&&prizeMeshes[i].userData&&prizeMeshes[i].userData.info&&prizeMeshes[i].userData.info.name)||''};
    })};
};
// テスト用：カメラ視点の変更（通常プレイには影響しない）
window.__view=function(px,py,pz,tx,ty,tz){controls.minDistance=0.3;camera.position.set(px,py,pz);controls.target.set(tx,ty,tz);controls.update();return {p:[camera.position.x,camera.position.y,camera.position.z],t:[controls.target.x,controls.target.y,controls.target.z]};};
// テスト用：1フレーム手動実行（通常プレイでは未使用）
window.__tick=function(dt){dt=dt||1/60;updateGame(dt);updatePhysics(dt);updateCabLights(performance.now()/1000,dt);};
// =====================================================
//  メイン処理の開始
// =====================================================
setTimeout(async()=>{
  await loadFB();
  init();
  animate();
},200);
})();
