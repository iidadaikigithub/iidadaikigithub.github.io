<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026年12月版　Googleアカウント</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:#e8eaed;font-family:"Meiryo","Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;color:#111;-webkit-print-color-adjust:exact;print-color-adjust:exact}

  /* ===== 操作パネル（印刷されません） ===== */
  .toolbar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:2px solid #d5d9de;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px}
  .row1{flex:1 1 100%;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .toolbar h1{font-size:17px;margin:0}
  .toolbar .status{font-size:13px;font-weight:bold;color:#0b57d0}
  .cols{flex:1 1 100%;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .colbox{display:flex;flex-direction:column;gap:3px;min-width:0}
  .colhead{font-size:12.5px;font-weight:bold}
  .colhead .ccnt{font-weight:normal;color:#0b57d0;font-size:11.5px;margin-left:6px}
  textarea{width:100%;height:100px;font-size:12px;line-height:1.4;font-family:Consolas,Meiryo,monospace;padding:6px;border:1px solid #bbb;border-radius:4px;resize:vertical}
  textarea:focus{outline:2px solid #1a73e8;outline-offset:-1px}
  .row3{flex:1 1 100%;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  button{font-size:13px;padding:7px 16px;border:1px solid #888;border-radius:4px;background:#f7f7f7;cursor:pointer}
  button:hover{background:#eef}
  button.primary{background:#1a73e8;border-color:#1a73e8;color:#fff;font-weight:bold}
  button.primary:hover{background:#1558c0}
  .hint{font-size:11.5px;color:#555;line-height:1.55;flex:1 1 100%}

  /* ===== A4ページ（1人＝1ページ＝大きなカード1枚） ===== */
  #pages{padding:16px 0 60px}
  .page{width:210mm;height:297mm;background:#fff;margin:0 auto 14px;box-shadow:0 2px 10px rgba(0,0,0,.28);padding:9mm 12mm 7mm;display:flex;flex-direction:column}
  .phead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:.5mm solid #333;padding-bottom:1.5mm}
  .phead .ptitle{font-size:14pt;font-weight:bold;letter-spacing:.3mm}
  .phead .pnum{font-size:9.5pt;color:#666}
  .card{flex:1;margin-top:5mm;border:.5mm solid #444;border-radius:3mm;padding:6mm 10mm;display:flex;flex-direction:column;justify-content:space-evenly;min-height:0}
  .line{display:flex;align-items:baseline;min-width:0}
  .lbl{flex:0 0 45mm;font-size:14pt;color:#333}
  .val{font-size:22pt;font-weight:bold;word-break:break-all;overflow-wrap:anywhere;min-width:0;line-height:1.25}
  .val.name{font-size:40pt}
  .val.acc{font-size:18pt}
  .val.pass{font-size:30pt;letter-spacing:1.5mm}
  .line.newpass .lbl{font-weight:bold;color:#000}
  .blank{flex:1;border-bottom:.6mm solid #000;min-height:12mm;align-self:flex-end}
  .pfoot{text-align:center;font-size:11pt;font-weight:bold;color:#333;margin-top:2mm}
  .page.empty{justify-content:center;align-items:center;color:#888;font-size:14px;text-align:center}

  /* ===== 印刷（A4・1ページ＝1人） ===== */
  @page{size:A4 portrait;margin:0}
  @media print{
    .toolbar{display:none!important}
    body{background:#fff}
    #pages{padding:0}
    .page{width:210mm;height:296.5mm;margin:0;box-shadow:none;page-break-after:always;break-after:page}
    .page:last-child{page-break-after:auto;break-after:auto}
  }
</style>
</head>
<body>

<div class="toolbar">
  <div class="row1">
    <h1>2026年12月版　Googleアカウント 一斉印刷</h1>
    <span class="status" id="status"></span>
  </div>

  <div class="cols">
    <div class="colbox">
      <div class="colhead">a. 学年名<span class="ccnt" id="cnt0"></span></div>
      <textarea id="col0" spellcheck="false" placeholder="スプレッドシートの「学年名」の列を縦にコピーして貼り付け"></textarea>
    </div>
    <div class="colbox">
      <div class="colhead">b. 名前<span class="ccnt" id="cnt1"></span></div>
      <textarea id="col1" spellcheck="false" placeholder="「名前」の列を縦にコピーして貼り付け"></textarea>
    </div>
    <div class="colbox">
      <div class="colhead">c. アカウント名<span class="ccnt" id="cnt2"></span></div>
      <textarea id="col2" spellcheck="false" placeholder="「アカウント名」の列を縦にコピーして貼り付け"></textarea>
    </div>
    <div class="colbox">
      <div class="colhead">d. 初期パスワード<span class="ccnt" id="cnt3"></span></div>
      <textarea id="col3" spellcheck="false" placeholder="「初期パスワード」の列を縦にコピーして貼り付け"></textarea>
    </div>
  </div>

  <div class="row3">
    <button class="primary" onclick="applyData()">反映する</button>
    <button onclick="window.print()">印刷 / PDF保存（全ページ一括）</button>
    <button onclick="document.getElementById('file').click()">CSVファイルを開く</button>
    <input type="file" id="file" accept=".csv,.txt,.tsv" style="display:none">
    <button onclick="loadSample()">サンプル200件</button>
    <button onclick="clearAll()">クリア</button>
  </div>

  <div class="hint">
    <b>使い方：</b>スプレッドシートで縦1列ずつ選択してコピーし、上の<b>4つの枠にそれぞれ貼り付け</b>ます（1行＝1人）。貼り付けると自動で反映されます。行数が違うと⚠で警告します。<br>
    <b>PDFにする方法：</b>「印刷 / PDF保存」→ 印刷ダイアログの<b>保存先を「PDFに保存」</b>に変更 → 保存。<br>
    1人＝A4 1ページ（大きなカード1枚）、約200人で約200枚。用紙はA4固定・余白なし設定です。
  </div>
</div>

<div id="pages"></div>

<script>
let DATA = [];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

/* ---- 列ごとの解析（1行＝1人。見出し行は自動でスキップ） ---- */
const COLKEYS = [/学年|組|学年名/i, /名前|氏名|児童|生徒/i, /アカウント|account|id/i, /パスワード|password|pass/i];

function colLines(text, idx){
  let out = String(text || '').replace(/\r\n?/g, '\n').split('\n')
    .map(l => l.replace(/[\s\u3000]+$/, '')).filter(l => l.trim() !== '');
  if(out.length && COLKEYS[idx].test(out[0])) out = out.slice(1);
  return out;
}

function updateCounts(){
  for(let i = 0; i < 4; i++){
    const a = colLines($('col' + i).value, i);
    $('cnt' + i).textContent = a.length ? a.length + '件' : '';
  }
}

/* ---- 反映：4列を1行ずつ組み合わせる ---- */
function applyData(){
  const cols = [0, 1, 2, 3].map(i => colLines($('col' + i).value, i));
  const n = Math.max(cols[0].length, cols[1].length, cols[2].length, cols[3].length);
  DATA = [];
  for(let i = 0; i < n; i++){
    const r = {grade: cols[0][i] || '', name: cols[1][i] || '', account: cols[2][i] || '', pass: cols[3][i] || ''};
    if(r.grade || r.name || r.account || r.pass) DATA.push(r);
  }
  updateCounts();
  const counts = cols.map(c => c.length);
  const same = counts.every(c => c === counts[0]);
  const st = $('status');
  st.textContent = n ? `${n}人 → A4 ${n}枚` + (same ? '' : `　⚠行数が違います(${counts.join('/')})`) : 'データなし';
  st.style.color = (n && !same) ? '#d93025' : '#0b57d0';
  render();
}

/* ---- 貼り付けで自動反映 ---- */
let debounce = null;
for(let i = 0; i < 4; i++){
  $('col' + i).addEventListener('input', () => {
    updateCounts();
    clearTimeout(debounce);
    debounce = setTimeout(applyData, 400);
  });
}

function clearAll(){
  for(let i = 0; i < 4; i++) $('col' + i).value = '';
  DATA = [];
  applyData();
}

/* ---- 画面・印刷用のページ生成（1人＝A4 1ページ・大きなカード1枚） ---- */
function render(){
  const n = DATA.length;
  const pages = $('pages');
  if(!n){
    pages.innerHTML = '<div class="page empty"><p>データがありません。<br>上の4つの枠にスプレッドシートから縦1列ずつ貼り付けてください。<br>「サンプル200件」で形式を確認できます。</p></div>';
    return;
  }
  let html = '';
  for(let i = 0; i < n; i++){
    const d = DATA[i];
    html += `<div class="page">`
      + `<div class="phead"><span class="ptitle">2026年12月版　Googleアカウント</span><span class="pnum">${i + 1} / ${n}</span></div>`
      + `<div class="card">`
      + `<div class="line newpass"><span class="lbl">新しいパスワード</span><span class="blank"></span></div>`
      + `<div class="line"><span class="lbl">学年名</span><span class="val">${esc(d.grade)}</span></div>`
      + `<div class="line"><span class="lbl">名前</span><span class="val name">${esc(d.name)}</span></div>`
      + `<div class="line"><span class="lbl">アカウント名</span><span class="val acc">${esc(d.account)}</span></div>`
      + `<div class="line"><span class="lbl">初期パスワード</span><span class="val pass">${esc(d.pass)}</span></div>`
      + `</div>`
      + `<div class="pfoot">初期パスワードを入れたら、新しいパスワードを設定してください</div></div>`;
  }
  pages.innerHTML = html;
}

/* ---- CSVファイル読み込み（UTF-8 / Shift_JIS両対応）→ 4つの枠に分配 ---- */
function splitLine(line, delim){
  if(delim === '\t') return line.split('\t');
  const out = []; let cur = '', q = false;
  for(let i = 0; i < line.length; i++){
    const ch = line[i];
    if(q){ if(ch === '"'){ if(line[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += ch; }
    else if(ch === '"') q = true;
    else if(ch === ','){ out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur); return out;
}

function parseRows(text){
  const lines = String(text || '').replace(/\r\n?/g, '\n').split('\n')
    .map(l => l.replace(/[\s\u3000]+$/, '')).filter(l => l.trim() !== '');
  if(!lines.length) return [];
  const delim = lines.some(l => l.includes('\t')) ? '\t' : ',';
  let rows = lines.map(l => splitLine(l, delim).map(c => c.trim()));
  const head = rows[0].join('\t');
  if(/学年/.test(head) || /名前|氏名/.test(head) || /アカウント/.test(head)) rows = rows.slice(1);
  return rows;
}

$('file').addEventListener('change', e => {
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ev => {
    const buf = ev.target.result;
    let text;
    try { text = new TextDecoder('utf-8', {fatal:true}).decode(buf); }
    catch(err){ text = new TextDecoder('shift_jis').decode(buf); }
    const cols = [[], [], [], []];
    parseRows(text).forEach(row => {
      for(let i = 0; i < 4; i++) cols[i].push(row[i] || '');
    });
    for(let i = 0; i < 4; i++) $('col' + i).value = cols[i].join('\n');
    applyData();
  };
  r.readAsArrayBuffer(f);
  e.target.value = '';
});

/* ---- サンプルデータ200件（実際のデータを貼り付ければ入れ替わります） ---- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const SEI = ["佐藤","鈴木","高橋","田中","渡辺","伊藤","山本","中村","小林","加藤","吉田","山口","松本","井上","木村","林","斎藤","清水","山下","池田","阿部","橋本","山村","石川","中山","前川","藤田","長谷川","村上","近藤","石井","斉藤","坂本","上田","森","原田","岡田","中島","藤原","吉川","野口","松田","竹内","西村","福田","太田","藤井","岡本","金子","三浦"];
const MEI_M = ["大翔","蓮","陽翔","湊","朝陽","颯太","悠真","悠","蒼","碧","大和","律","晴斗","翔","海翔","拓真","琉生","陽太","壮真","奏","歩","蒼真","湊斗","大智","遼","健太","陸","圭吾","光","大河"];
const MEI_F = ["紬","結菜","陽葵","葵","凛","咲良","芽依","結愛","杏","さくら","結月","美月","花音","夢","莉子","心愛","楓","真央","優奈","千尋","彩","ひなた","茉莉","澪","小春","未来","詩","玲奈","愛莉","雛"];
const CHARS = 'abcdefghjkmnpqrstuvwxyz23456789';

function loadSample(){
  const rnd = mulberry32(202612);
  const pick = a => a[Math.floor(rnd() * a.length)];
  const g = ['学年名'], nm = ['名前'], ac = ['アカウント名'], pw = ['初期パスワード'];
  for(let i = 0; i < 200; i++){
    g.push(Math.min(6, Math.floor(i / 33) + 1) + '年');
    nm.push(pick(SEI) + '\u3000' + pick(MEI_M.concat(MEI_F)));
    ac.push('s26' + String(i + 1).padStart(3, '0') + '@example.ed.jp');
    let p = ''; for(let k = 0; k < 8; k++) p += CHARS[Math.floor(rnd() * CHARS.length)];
    pw.push(p);
  }
  const vals = [g, nm, ac, pw];
  for(let i = 0; i < 4; i++) $('col' + i).value = vals[i].join('\n');
  applyData();
}

// 起動時は4枠とも空。スプレッドシートから貼り付けてください。
applyData();
</script>
</body>
</html>
