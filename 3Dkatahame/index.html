<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>3D かたはめパズル</title>
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  html, body { width:100%; height:100%; overflow:hidden; }
  body { font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif; background:#eef0f3; }
  #stage { position:fixed; inset:0; }
  #stage canvas { display:block; touch-action:none; }

  .screen { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:20; }
  .hidden { display:none !important; }
  .panel {
    position:relative;
    background:linear-gradient(180deg, rgba(255,255,255,.985), rgba(252,250,246,.96));
    border-radius:26px; border:1px solid rgba(190,172,140,.4);
    padding:34px 40px 28px;
    box-shadow:0 26px 60px rgba(30,40,60,.22), 0 2px 8px rgba(30,40,60,.06);
    width:min(92vw,560px); text-align:center; max-height:94vh; overflow:auto;
  }
  .panel::before {
    content:""; position:absolute; top:0; left:26px; right:26px; height:3px;
    background:linear-gradient(90deg, transparent, #b8935f, transparent);
    border-radius:0 0 4px 4px;
  }
  h1 { font-size:30px; color:#263244; letter-spacing:.16em; font-weight:700; }
  .sub { margin:10px 0 8px; color:#8a919b; font-size:14px; letter-spacing:.06em; }
  .divider { width:54px; height:1px; background:#d8c9a8; margin:0 auto 18px; }
  .row { margin:14px 0; text-align:left; }
  .row .label { font-size:13px; font-weight:600; color:#5a6472; letter-spacing:.1em; margin-bottom:8px; }
  .opts { display:flex; gap:8px; flex-wrap:wrap; }
  .opts button {
    flex:1 1 auto; padding:11px 8px; border-radius:12px;
    border:1px solid #dcd5c7; background:rgba(255,255,255,.72);
    font-size:14px; font-weight:600; color:#4a5568; cursor:pointer; font-family:inherit;
    transition:all .15s; min-width:74px; letter-spacing:.03em;
  }
  .opts button:hover { border-color:#b8935f; color:#7a5f2e; }
  .opts button.sel { background:#263244; border-color:#263244; color:#f3ead8; box-shadow:0 6px 16px rgba(38,50,68,.32); }
  .swatches { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; padding-bottom:4px; }
  .swatch { width:52px; height:52px; border-radius:14px; cursor:pointer; border:3px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.18); position:relative; transition:transform .12s; }
  .swatch:hover { transform:scale(1.1); }
  .swatch.sel { border-color:#263244; }
  .swatch.sel::after { content:"✓"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:24px; color:#fff; text-shadow:0 1px 5px rgba(0,0,0,.55); }
  .sw-name { font-size:11px; color:#6b7a8a; margin-top:4px; }
  .big {
    margin-top:22px; width:100%; padding:16px 0; border:none; border-radius:14px; cursor:pointer;
    background:linear-gradient(180deg,#31415c,#223045); color:#f5ecd9;
    font-size:20px; font-weight:700; font-family:inherit; letter-spacing:.14em;
    box-shadow:0 10px 22px rgba(34,48,69,.35); transition:transform .12s, box-shadow .12s;
  }
  .big:hover { transform:translateY(-2px); box-shadow:0 14px 28px rgba(34,48,69,.42); }
  .big:active { transform:translateY(0); }
  .big.ghost { background:transparent; color:#263244; border:1px solid #263244; box-shadow:none; margin-top:12px; }
  .help { margin-top:16px; font-size:12px; color:#9aa3ae; line-height:2; letter-spacing:.03em; }

  #game-hud { position:fixed; top:0; left:0; right:0; z-index:10; padding:12px 16px; display:flex; justify-content:space-between; pointer-events:none; }
  #game-hud > * { pointer-events:auto; }
  #hud-left { color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.4); font-weight:bold; font-size:16px; line-height:1.5; }
  #hud-right { display:flex; gap:8px; }
  #game-hud button { min-width:46px; height:40px; padding:0 14px; border-radius:12px; border:none; background:rgba(255,255,255,.85); font-size:14px; font-weight:700; color:#263244; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.15); }
  #game-hud button.muted { opacity:.55; }
  #hud-hint { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); z-index:10; background:rgba(30,40,55,.72); color:#fff; padding:9px 20px; border-radius:20px; font-size:13px; font-weight:bold; letter-spacing:.5px; white-space:nowrap; }

  #message { position:fixed; left:50%; top:26%; transform:translate(-50%,-50%) scale(.5); z-index:30; font-size:42px; font-weight:900; opacity:0; transition:all .22s cubic-bezier(.34,1.56,.64,1); pointer-events:none; }
  #message.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
  #message.correct { color:#2ec56a; -webkit-text-stroke:3px #fff; }
  #message.wrong { color:#ff5b5b; -webkit-text-stroke:3px #fff; }

  #end-screen .panel { padding:28px 40px; }
  #end-stars { font-size:46px; letter-spacing:8px; color:#b8935f; margin:10px 0 6px; }
  #end-text { font-size:20px; font-weight:bold; color:#4a5a6a; line-height:1.8; }
  #end-msg { margin-top:4px; font-size:15px; color:#7f8c9b; }
  #loading { position:fixed; inset:0; z-index:50; background:rgba(240,243,247,.85); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; font-weight:bold; color:#4a5a6a; }
  .loader { width:46px; height:46px; border-radius:50%; border:6px solid #e2e6ec; border-top-color:#b8935f; animation:spin 0.9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
  <div id="stage"></div>

  <div id="loading"><div class="loader"></div><div>じゅんびちゅう…</div></div>

  <div id="start-screen" class="screen">
    <div class="panel">
      <h1>3D かたはめパズル</h1>
      <p class="sub">つみきを くぼみに ぴったり はめましょう</p>
      <div class="divider"></div>
      <div class="row"><div class="label">はめかた</div>
        <div class="opts" data-role="mode">
          <button data-v="up" class="sel">上からはめる</button><button data-v="front">正面からはめる</button>
        </div>
      </div>
      <div class="row"><div class="label">もんだいすう</div>
        <div class="opts" data-role="count">
          <button data-v="5">5</button><button data-v="10" class="sel">10</button><button data-v="15">15</button><button data-v="20">20</button>
        </div>
      </div>
      <div class="row"><div class="label">むずかしさ</div>
        <div class="opts" data-role="diff">
          <button data-v="easy">やさしい</button><button data-v="normal" class="sel">ふつう</button><button data-v="hard">むずかしい</button><button data-v="veryhard">ちょうむずかしい</button><button data-v="superhard">ぜつむ</button>
        </div>
      </div>
      <div class="row"><div class="label">えらぶかず（2〜4）</div>
        <div class="opts" data-role="choices">
          <button data-v="2">2 こ</button><button data-v="3" class="sel">3 こ</button><button data-v="4">4 こ</button>
        </div>
      </div>
      <div class="row"><div class="label">３Ｄのいろ</div>
        <div class="swatches" data-role="theme"></div>
      </div>
      <button id="btn-start" class="big">はじめる</button>
      <p class="help">ドラッグ（指をずらす）で まわす・ピンチ（スクロール）で ズーム<br>つみきを タップ（クリック）で えらんで はめる</p>
    </div>
  </div>

  <div id="game-hud" class="hidden">
    <div id="hud-left">
      <div id="hud-q">もんだい 1 / 10</div>
      <div id="hud-score">せいかい 0</div>
    </div>
    <div id="hud-right">
      <button id="btn-sound" title="おと">おと</button>
      <button id="btn-home" title="はじめにもどる">もどる</button>
    </div>
  </div>
  <div id="hud-hint" class="hidden">つみきを タップ　どれが ぴったり はまるかな？</div>
  <div id="message"></div>

  <div id="end-screen" class="screen hidden">
    <div class="panel">
      <h1>けっか</h1>
      <div id="end-stars"></div>
      <div id="end-text"></div>
      <div id="end-msg"></div>
      <button id="btn-retry" class="big">もういちど</button>
      <button id="btn-config" class="big ghost">せっていにもどる</button>
    </div>
  </div>

  <div id="errlog" style="display:none"></div>

  <script src="game.js"></script>
</body>
</html>
