<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>キャンバの入り方</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1226;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;}
body{overscroll-behavior:none;touch-action:manipulation;}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;}
#imgWrap{position:relative;line-height:0;}
#imgWrap img{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;touch-action:manipulation;}
.hl{position:absolute;display:none;pointer-events:none;z-index:10;border:4px solid #ff2222;border-radius:12px;touch-action:none;}
.hl .sweep{position:absolute;left:0;right:0;top:0;height:100%;background:linear-gradient(to bottom,rgba(255,0,0,0) 0%,rgba(255,0,0,.5) 55%,rgba(255,255,255,.65) 100%);animation:sweep 1.1s linear infinite;}
@keyframes sweep{0%{transform:translateY(-101%);}100%{transform:translateY(101%);}}
.hl.dots{border-style:dashed;background:rgba(255,0,0,.08);animation:blink .9s ease-in-out infinite;}
.hl.fav{background:rgba(255,0,0,.28);animation:blink .8s ease-in-out infinite;}
.hl.canva{border-color:#ff3b3b;animation:glow 1s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:.35;}50%{opacity:1;}}
@keyframes glow{0%,100%{box-shadow:0 0 12px rgba(255,0,0,.5);background:rgba(255,0,0,.15);}50%{box-shadow:0 0 42px rgba(255,0,0,1);background:rgba(255,0,0,.45);}}
#arrow{position:absolute;display:none;pointer-events:none;z-index:11;color:#ff2222;text-align:center;line-height:1;text-shadow:0 0 16px rgba(255,0,0,.95),0 0 4px #fff;animation:bounce .7s ease-in-out infinite;touch-action:none;}
#arrow span{display:block;font-weight:900;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(10px);}}
#bar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:50;background:rgba(0,0,0,.78);color:#fff;padding:10px 20px;border-radius:40px;font-size:min(3.4vh,20px);font-weight:bold;text-align:center;white-space:nowrap;border:2px solid rgba(255,255,255,.28);display:none;align-items:center;gap:12px;}
#nextBtn{pointer-events:auto;background:#ffd500;color:#1a1a1a;border:none;border-radius:30px;padding:8px 18px;font-weight:bold;font-size:inherit;cursor:pointer;font-family:inherit;}
#caption{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);z-index:50;background:rgba(255,255,255,.92);color:#b00000;padding:8px 18px;border-radius:30px;font-size:min(3.4vh,20px);font-weight:bold;box-shadow:0 2px 10px rgba(0,0,0,.4);display:none;pointer-events:none;white-space:normal;max-width:94vw;text-align:center;}
#title{position:fixed;inset:0;z-index:60;background:linear-gradient(160deg,#1b2a4a 0%,#0d1226 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;cursor:pointer;padding:0 5vw;}
#title h1{font-size:min(10vh,58px);letter-spacing:.12em;margin-bottom:3vh;}
#title .sub{font-size:min(4vh,24px);margin-bottom:8vh;color:#ccd;}
#title .go{font-size:min(4.5vh,26px);color:#ffd500;animation:blink 1.1s ease-in-out infinite;}
</style>
</head>
<body>
<div id="stage">
  <div id="imgWrap">
    <img id="img" alt="" draggable="false">
    <div class="hl dots" id="hlDots"><div class="sweep"></div></div>
    <div class="hl canva" id="hlCanva"></div>
    <div id="arrow"><span>&#9660;</span></div>
  </div>
</div>
<div id="bar">
  <span>エンターか左クリック、タッチを押して進めてね！</span>
  <button id="nextBtn">つぎへ ▶</button>
</div>
<div id="caption"></div>
<div id="title">
  <h1>キャンバの入り方</h1>
  <div class="sub">3まいの えで おぼえよう</div>
  <div class="go">▼ クリック・タッチ・エンターで はじめる ▼</div>
</div>
<script>
(function(){
  function $(id){return document.getElementById(id);}
  var img=$('img'),wrap=$('imgWrap'),stage=$('stage'),
      hlDots=$('hlDots'),hlCanva=$('hlCanva'),arrow=$('arrow'),
      title=$('title'),bar=$('bar'),caption=$('caption');
  var favEls=[];

  var CFG_KEY='iriguti_cfg';
  var DEFAULT={
    dots:{x:93.53637695312501,y:2.1062331809094657,w:3.9689127604166665,h:7.22869008714597},
    favBoxes:[{x:81.45833333333331,y:6.570806100217865,w:16.510416666666668,h:60.70091230936819}],
    arrow:{x:85.52083333333334,y:65.88235294117646,w:10,h:8},
    canva:{x:82.27083333333331,y:32.570806100217865,w:4.1357421875,h:7.523148148148148}
  };
  function load(){try{var c=JSON.parse(localStorage.getItem(CFG_KEY));if(c)return c;}catch(e){}return JSON.parse(JSON.stringify(DEFAULT));}
  var CFG=load();

  var PAGES=[
    {img:'1.jpg',speak:'みぎうえの きゅうこの点を おしてみよう',show:['dots']},
    {img:'2.jpg',speak:'下の方にあります',show:['fav','arrow']},
    {img:'3.jpg',speak:'キャンバを おしましょう',show:['canva']}
  ];
  var cur=-1;

  function buildFavEls(){
    for(var i=0;i<CFG.favBoxes.length;i++){
      var el=document.createElement('div');
      el.className='hl fav';el.dataset.fav=i;
      wrap.appendChild(el);favEls.push(el);
    }
  }
  function place(el,c){
    el.style.left=c.x+'%';el.style.top=c.y+'%';el.style.width=c.w+'%';el.style.height=c.h+'%';
  }
  function placeAll(){
    place(hlDots,CFG.dots);
    for(var i=0;i<favEls.length;i++)place(favEls[i],CFG.favBoxes[i]);
    place(arrow,CFG.arrow);
    arrow.querySelector('span').style.fontSize=(CFG.arrow.h*wrap.clientHeight/100)+'px';
    place(hlCanva,CFG.canva);
  }
  function applyShow(keys){
    hlDots.style.display=(keys.indexOf('dots')>=0)?'block':'none';
    hlCanva.style.display=(keys.indexOf('canva')>=0)?'block':'none';
    arrow.style.display=(keys.indexOf('arrow')>=0)?'block':'none';
    for(var i=0;i<favEls.length;i++)favEls[i].style.display=(keys.indexOf('fav')>=0)?'block':'none';
    placeAll();
  }
  function fit(){
    if(img.naturalWidth){
      var ar=img.naturalWidth/img.naturalHeight;
      var sw=stage.clientWidth,sh=stage.clientHeight;
      if(sw/sh>ar){wrap.style.width=(sh*ar)+'px';wrap.style.height=sh+'px';}
      else{wrap.style.width=sw+'px';wrap.style.height=(sw/ar)+'px';}
    }else{
      wrap.style.width=stage.clientWidth+'px';wrap.style.height=stage.clientHeight+'px';
    }
    placeAll();
  }

  var voices=[];
  function loadVoices(){if(window.speechSynthesis)voices=window.speechSynthesis.getVoices();}
  if(window.speechSynthesis){window.speechSynthesis.onvoiceschanged=loadVoices;loadVoices();}
  function speak(text){
    caption.textContent=text;
    try{window.speechSynthesis.cancel();}catch(e){}
    var u=new SpeechSynthesisUtterance(text);
    u.lang='ja-JP';u.rate=0.95;u.pitch=1.05;
    var v=voices.filter(function(x){return /^ja/i.test(x.lang);})[0];
    if(v)u.voice=v;
    try{window.speechSynthesis.speak(u);}catch(e){}
  }

  function showPage(i){
    var p=PAGES[i];
    bar.style.display='flex';caption.style.display='block';
    applyShow(p.show);
    img.onload=function(){fit();if(p.speak)speak(p.speak);};
    img.src=p.img;
  }
  function toTitle(){
    try{window.speechSynthesis.cancel();}catch(e){}
    caption.style.display='none';bar.style.display='none';
    img.removeAttribute('src');
    applyShow([]);
    title.style.display='flex';
  }
  function advance(){
    if(title.style.display!=='none'){title.style.display='none';cur=0;showPage(0);return;}
    cur++;
    if(cur>=PAGES.length){cur=-1;toTitle();return;}
    showPage(cur);
  }

  document.addEventListener('click',advance);
  document.addEventListener('contextmenu',function(e){e.preventDefault();advance();});
  document.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '){e.preventDefault();advance();}
  });
  $('nextBtn').addEventListener('click',function(e){e.stopPropagation();advance();});
  title.addEventListener('click',function(e){e.stopPropagation();advance();});

  window.addEventListener('resize',fit);

  buildFavEls();
  toTitle();
})();
</script>
</body>
</html>
