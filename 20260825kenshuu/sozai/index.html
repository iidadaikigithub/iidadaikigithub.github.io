<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>素材のつかいかた</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1226;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;}
body{overscroll-behavior:none;touch-action:manipulation;}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;}
#imgWrap{position:relative;line-height:0;}
#imgWrap img{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;touch-action:manipulation;}
.hl{position:absolute;display:none;pointer-events:none;z-index:10;border:4px solid #ff2222;border-radius:12px;animation:blink .8s ease-in-out infinite;}
.hl.box{background:rgba(255,0,0,.28);}
@keyframes blink{0%,100%{opacity:.35;}50%{opacity:1;}}
#arrow{position:absolute;display:none;pointer-events:none;z-index:11;color:#ff2222;text-align:center;line-height:1;text-shadow:0 0 16px rgba(255,0,0,.95),0 0 4px #fff;animation:bounce .7s ease-in-out infinite;}
#arrow span{display:block;font-weight:900;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(10px);}}
#bar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:50;background:rgba(0,0,0,.78);color:#fff;padding:10px 20px;border-radius:40px;font-size:min(3.4vh,20px);font-weight:bold;text-align:center;white-space:nowrap;border:2px solid rgba(255,255,255,.28);display:none;align-items:center;gap:12px;}
#nextBtn{pointer-events:auto;background:#ffd500;color:#1a1a1a;border:none;border-radius:30px;padding:8px 18px;font-weight:bold;font-size:inherit;cursor:pointer;font-family:inherit;}
#caption{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);z-index:50;background:rgba(255,255,255,.92);color:#b00000;padding:8px 18px;border-radius:30px;font-size:min(3.4vh,20px);font-weight:bold;box-shadow:0 2px 10px rgba(0,0,0,.4);display:none;pointer-events:none;white-space:normal;max-width:94vw;text-align:center;}
#title{position:fixed;inset:0;z-index:60;background:linear-gradient(160deg,#1b2a4a 0%,#0d1226 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;cursor:pointer;padding:0 5vw;}
#title h1{font-size:min(8vh,48px);letter-spacing:.12em;margin-bottom:3vh;}
#title .sub{font-size:min(4vh,24px);margin-bottom:8vh;color:#ccd;}
#title .go{font-size:min(4.5vh,26px);color:#ffd500;animation:blink 1.1s ease-in-out infinite;}
#menuBtn{position:fixed;top:12px;right:12px;z-index:80;background:rgba(0,0,0,.65);color:#fff;text-decoration:none;padding:10px 18px;border-radius:30px;font-size:min(3.4vh,18px);font-weight:bold;border:2px solid rgba(255,255,255,.28);font-family:inherit;cursor:pointer;}
</style>
</head>
<body>
<div id="stage">
  <div id="imgWrap">
    <img id="img" alt="" draggable="false">
    <div id="arrow"><span>&#9660;</span></div>
  </div>
</div>
<div id="bar">
  <span>エンターか左クリック、タッチを押して進めてね！</span>
  <button id="nextBtn">つぎへ ▶</button>
</div>
<div id="caption"></div>
<div id="title">
  <h1>素材のつかいかた</h1>
  <div class="sub">19まいの えで おぼえよう</div>
  <div class="go">▼ クリック・タッチ・エンターで はじめる ▼</div>
</div>
<a id="menuBtn" href="../matomeindex.html">☰ メニューにもどる</a>
<script>
(function(){
  function $(id){return document.getElementById(id);}
  var img=$('img'),wrap=$('imgWrap'),stage=$('stage'),arrow=$('arrow'),
      title=$('title'),bar=$('bar'),caption=$('caption');
  var boxEls={};

  var PAGES=[
    {img:'1.jpg',speak:'安全安心な気持ちで使える好きな素材を探しましょう、素材アイコンは最初の画面に出ていないので、だしかたを説明します。テンプレートをおしましょう'},
    {img:'2.jpg',speak:'教育用テンプレートを押しましょう、別のところでも大丈夫です'},
    {img:'3.jpg',speak:'素材と言うアイコンが出ましたね。今回はイラストで素材を探しましょう'},
    {img:'4.jpg',speak:'見本がいっぱい出ました、ここにあるのは膨大な数の素材のほんのいちぶですね、欲しいものを検索をしてみましょう'},
    {img:'5.jpg',speak:'夏 と打ち込みましょう'},
    {img:'6.jpg',speak:'それらしいものがでました、無料で安全な画像たちです'},
    {img:'7.jpg',speak:'レモンかき氷を選んでみました、これはパワーポイントでもキーノートでもグーグルスライドでも使えます'},
    {img:'8.jpg',speak:'これはEDU、教育用とついているので、単体では保存できない特殊な画像もあります、だけど、２つ以上選ぶと保存できます。お金にきたない人がそのまま保存してラインスタンプとかにしないようなささやかな対抗ですかね、うえのほうの共有を押します'},
    {img:'9.jpg',speak:'本来ならダウンロードを押せばできるのですが、このEDU画像は単体ではできないようです、さきほども言いましたね'},
    {img:'10.jpg',speak:'押すと、なんか注意書きがでましたね、２つ表示すれば保存できるという謎仕様です'},
    {img:'11.jpg',speak:'今度は、EDUがついていないのをえらんでみましょう'},
    {img:'12.jpg',speak:'ひまわりがでました。これは保存してパワーポイントやキーノートやワードにらくらくともっていけますね'},
    {img:'13.jpg',speak:'保存しましょう、うえのほうの共有をおします'},
    {img:'14.jpg',speak:'ダウンロードをおします'},
    {img:'15.jpg',speak:'さっきの表示はでませんね、またダウンロードをおします'},
    {img:'16.jpg',speak:'できたようですね'},
    {img:'17.jpg',speak:'もし、気に入る画像がなかったらAIで作りましょう。ここにリアルなひまわりといれます、そして生成ボタンをおします'},
    {img:'18.jpg',speak:'ちょっと待つと、作ってくれます。気に入ったのがあったら、えらんでください'},
    {img:'19.jpg',speak:'でてきました。同じように保存できます。もちろん、このままキャンバの狙い通りここでパワーポイントのように資料作ったほうが楽ではありますね。そして、いまたくさんここに画像だしたので、EDUの画像も保存できます。以上でおしまいです。'}
  ];

  var CFG_KEY='sozai_cfg';
  var DEFAULT={
    boxes:{
      b1:{x:5.3125,y:32.5,w:5.104166666666667,h:9.83695652173913},
      b2:{x:0,y:36.630434782608695,w:3.125,h:7.66304347826087},
      b3:{x:4.84375,y:43.91304347826087,w:12.65625,h:9.729959239130435},
      b4:{x:0,y:13.586956521739133,w:3.4375000000000004,h:8.96399456521739},
      b5:{x:3.854166666666667,y:24.456521739130434,w:18.021647135416664,h:74.50917119565217},
      b6:{x:4.427083333333329,y:11.413043478260867,w:17.8125,h:19.833559782608695},
      b7:{x:4.739583333333336,y:34.67391304347826,w:16.666666666666664,h:62.880434782608695},
      b8:{x:9.791666666666664,y:34.45652173913044,w:6.145833333333333,h:13.31521739130435},
      b9:{x:94.01041666666667,y:0.21739130434782972,w:3.4375000000000004,h:7.985733695652174},
      b10:{x:11.510416666666664,y:41.95652173913044,w:4.21875,h:6.032608695652174},
      b11:{x:79.375,y:50.43478260869565,w:5.572916666666667,h:10.816915760869565},
      b12:{x:79.6875,y:48.04347826086956,w:20,h:10},
      b13:{x:10.15625,y:43.69565217391305,w:4.791666666666667,h:12.447350543478262},
      b14:{x:57.135416666666664,y:33.69565217391305,w:9.739583333333334,h:32.33695652173913},
      b15:{x:93.59375,y:0,w:4.010416666666667,h:8.637907608695652},
      b16:{x:79.47916666666667,y:50,w:5.15625,h:10.599524456521738},
      b17:{x:79.32291666666666,y:47.82608695652174,w:20.572916666666664,h:6.68648097826087},
      b18:{x:76.77083333333333,y:0,w:17.65625,h:8.41881793478261},
      b19:{x:4.270833333333336,y:11.847826086956523,w:11.822916666666666,h:6.681385869565218},
      b21:{x:12.604166666666664,y:37.173913043478265,w:7.968749999999999,h:16.25},
      b22:{x:68.17708333333333,y:22.934782608695652,w:16.614583333333332,h:50.37873641304348},
      b23:{x:4.114583333333336,y:24.456521739130434,w:9.114583333333332,h:6.900475543478262}
    },
    arrow:{x:4.947916666666667,y:19.84782608695652,w:10,h:8},
    pageBoxes:[["b1","b2"],["b3"],["b4"],["b5"],["b6"],["b7"],["b8"],["b9","b10"],["b11"],["b12"],["b13"],["b14"],["b15"],["b16"],["b17"],["b18"],["b19","b23"],["b21"],["b22"]],
    pageArrows:[false,false,false,false,false,false,false,true,false,false,false,false,false,false,false,false,true,false,false]
  };
  function load(){
    try{var c=JSON.parse(localStorage.getItem(CFG_KEY));if(c&&c.boxes&&c.pageBoxes)return c;}catch(e){}
    return JSON.parse(JSON.stringify(DEFAULT));
  }
  var CFG=load();
  var cur=-1;

  function buildBoxEls(){
    for(var id in CFG.boxes){
      if(boxEls[id])continue;
      var el=document.createElement('div');
      el.className='hl box';el.dataset.id=id;
      wrap.appendChild(el);boxEls[id]=el;
    }
  }
  function place(el,c){
    el.style.left=c.x+'%';el.style.top=c.y+'%';el.style.width=c.w+'%';el.style.height=c.h+'%';
  }
  function placeAll(){
    for(var id in CFG.boxes)place(boxEls[id],CFG.boxes[id]);
    place(arrow,CFG.arrow);
    arrow.querySelector('span').style.fontSize=(CFG.arrow.h*wrap.clientHeight/100)+'px';
  }
  function applyShow(i){
    for(var id in boxEls){
      var on=(CFG.pageBoxes[i]||[]).indexOf(id)>=0;
      boxEls[id].style.display=on?'block':'none';
    }
    arrow.style.display=CFG.pageArrows[i]?'block':'none';
    placeAll();
  }
  function fit(){
    if(img.naturalWidth){
      var ar=img.naturalWidth/img.naturalHeight;
      var sw=stage.clientWidth,sh=stage.clientHeight;
      if(sw/sh>ar){wrap.style.width=(sh*ar)+'px';wrap.style.height=sh+'px';}
      else{wrap.style.width=sw+'px';wrap.style.height=(sw/ar)+'px';}
    }else{
      wrap.style.width=stage.clientWidth+'px';wrap.style.height=stage.clientHeight+'px';
    }
    placeAll();
  }

  var voices=[];
  function loadVoices(){if(window.speechSynthesis)voices=window.speechSynthesis.getVoices();}
  if(window.speechSynthesis){window.speechSynthesis.onvoiceschanged=loadVoices;loadVoices();}
  function speak(text){
    caption.textContent=text;
    try{window.speechSynthesis.cancel();}catch(e){}
    var u=new SpeechSynthesisUtterance(text);
    u.lang='ja-JP';u.rate=0.95;u.pitch=1.05;
    var v=voices.filter(function(x){return /^ja/i.test(x.lang);})[0];
    if(v)u.voice=v;
    try{window.speechSynthesis.speak(u);}catch(e){}
  }

  function showPage(i){
    var p=PAGES[i];
    bar.style.display='flex';caption.style.display='block';
    applyShow(i);
    img.onload=function(){fit();if(p.speak)speak(p.speak);};
    img.src=p.img;
  }
  function toTitle(){
    try{window.speechSynthesis.cancel();}catch(e){}
    caption.style.display='none';bar.style.display='none';
    img.removeAttribute('src');
    for(var id in boxEls)boxEls[id].style.display='none';
    arrow.style.display='none';
    title.style.display='flex';
  }
  function advance(){
    if(title.style.display!=='none'){title.style.display='none';cur=0;showPage(0);return;}
    cur++;
    if(cur>=PAGES.length){cur=-1;toTitle();return;}
    showPage(cur);
  }

  document.addEventListener('click',advance);
  document.addEventListener('contextmenu',function(e){e.preventDefault();advance();});
  document.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '){e.preventDefault();advance();}
  });
  $('nextBtn').addEventListener('click',function(e){e.stopPropagation();advance();});
  title.addEventListener('click',function(e){e.stopPropagation();advance();});
  $('menuBtn').addEventListener('click',function(e){e.stopPropagation();});

  window.addEventListener('resize',fit);

  buildBoxEls();
  toTitle();
})();
</script>
</body>
</html>
