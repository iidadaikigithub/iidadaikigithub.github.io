<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:linear-gradient(160deg,#1b2a4a 0%,#0d1226 100%);min-height:100vh;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#fff;text-align:center;padding:4vh 4vw 6vh;}
h1{font-size:min(8vh,38px);letter-spacing:.12em;margin:2vh 0 1vh;}
.sub{font-size:min(4vh,18px);color:#ccd;margin-bottom:4vh;}
.list{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:min(3vw,18px);}
.card{display:grid;grid-template-columns:min(14vh,84px) 1fr;align-items:center;justify-items:center;gap:3vw;text-decoration:none;color:#fff;border-radius:24px;border:3px solid rgba(255,255,255,.25);box-shadow:0 8px 24px rgba(0,0,0,.45);padding:2.5vh 4vw;transition:transform .15s ease,box-shadow .15s ease;}
.card:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 14px 32px rgba(0,0,0,.6);}
.card .icon{font-size:min(9vh,56px);line-height:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4));justify-self:center;}
.card .label{font-size:min(4vh,24px);font-weight:bold;letter-spacing:.06em;text-shadow:0 2px 4px rgba(0,0,0,.5);text-align:center;}
.card .sub{display:block;font-size:min(2.8vh,14px);opacity:.85;letter-spacing:.1em;margin-top:4px;line-height:1.5;}
.c1{background:linear-gradient(160deg,#00b4d8,#0077b6);}
.c2{background:linear-gradient(160deg,#ffb703,#fb8500);}
.c3{background:linear-gradient(160deg,#06d6a0,#028090);}
.c4{background:linear-gradient(160deg,#ef476f,#c2185b);}

</head>
