<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>共有アカウントのデータは消えませんが少し特殊な立ち位置になります</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1226;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;}
body{overscroll-behavior:none;touch-action:manipulation;display:flex;flex-direction:column;}
#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000;}
#imgWrap{position:relative;line-height:0;}
#imgWrap img{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;touch-action:manipulation;}
.hl{position:absolute;display:none;pointer-events:none;z-index:10;border:4px solid #ff2222;border-radius:12px;animation:blink .8s ease-in-out infinite;}
.hl.box{background:rgba(255,0,0,.28);}
@keyframes blink{0%,100%{opacity:.35;}50%{opacity:1;}}
#arrow{position:absolute;display:none;pointer-events:none;z-index:11;color:#ff2222;text-align:center;line-height:1;text-shadow:0 0 16px rgba(255,0,0,.95),0 0 4px #fff;animation:bounce .7s ease-in-out infinite;}
#arrow span{display:block;font-weight:900;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(10px);}}
#bottomPanel{display:none;background:#0d1226;padding:10px 12px calc(10px + env(safe-area-inset-bottom));}
#caption{display:none;margin:0 auto 10px;background:rgba(255,255,255,.94);color:#b00000;padding:8px 18px;border-radius:16px;font-size:min(2.2vh,14px);font-weight:bold;box-shadow:0 2px 10px rgba(0,0,0,.4);max-width:94vw;text-align:center;line-height:1.5;}
#bar{display:none;margin:0 auto;width:fit-content;max-width:94vw;background:rgba(0,0,0,.78);color:#fff;padding:10px 20px;border-radius:40px;font-size:min(3.2vh,20px);font-weight:bold;text-align:center;border:2px solid rgba(255,255,255,.28);align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;}
#nextBtn{pointer-events:auto;background:#ffd500;color:#1a1a1a;border:none;border-radius:30px;padding:8px 18px;font-weight:bold;font-size:inherit;cursor:pointer;font-family:inherit;}
#title{position:fixed;inset:0;z-index:60;background:linear-gradient(160deg,#1b2a4a 0%,#0d1226 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;cursor:pointer;padding:0 5vw;}
#title h1{font-size:min(6vh,40px);letter-spacing:.06em;margin-bottom:3vh;line-height:1.4;}
#title .sub{font-size:min(4vh,24px);margin-bottom:8vh;color:#ccd;}
#title .go{font-size:min(4.5vh,26px);color:#ffd500;animation:blink 1.1s ease-in-out infinite;}
</style>
</head>
<body>
<div id="stage">
  <div id="imgWrap">
    <img id="img" alt="" draggable="false">
    <div id="arrow"><span>&#9660;</span></div>
  </div>
</div>
<div id="bottomPanel">
  <div id="caption"></div>
  <div id="bar">
    <span>エンターか左クリック、タッチを押して進めてね！</span>
    <button id="nextBtn">つぎへ ▶</button>
  </div>
</div>
<div id="title">
  <h1>以前使っていた共有アカウントのデータは消えませんが少し特殊な立ち位置になります</h1>
  <div class="sub">11まいの ずで おぼえよう</div>
  <div class="go">▼ クリック・タッチ・エンターで はじめる ▼</div>
</div>
<script src="../pdf-export.js"></script>
<script>
(function(){
  function $(id){return document.getElementById(id);}
  var img=$('img'),wrap=$('imgWrap'),stage=$('stage'),arrow=$('arrow'),
      title=$('title'),bottomPanel=$('bottomPanel'),bar=$('bar'),caption=$('caption');
  var boxEls={};

  var PAGES=[
    {img:'1.png',speak:'今回はデジタルデータについて説明します。パソコンやクラウドの保存場所を,畑に例えて、ファイルを花瓶や花に例えます。これでスライドなどのグーグルファイルの特殊性が分かるかと思います。'},
    {img:'2.png',speak:'我々は主に、手元にあるウィンドウズパソコン、アイパッド、クロムブックや電子黒板で様々な文章や画像などのファイルのやりとりや保存をしています。今度から、共有したい場合は上の共有ドライブ畑にうつすことになります。ここもグーグルの畑なので、ひとりひとりがグーグルアカウントとパスワードが必要です。ここにデータを置くとみんなで使えます。'},
    {img:'3.png',speak:'例えば、音楽や文章、画像やパワーポイント、PDFなどを手元のパソコンやアイパッドなどでつくって、みんなで使って欲しいので、共有ドライブにおきます。'},
    {img:'4.png',speak:'そうすると手元にデータが残ったまま、共有ドライブに同じものがコピーできます。デジタルファイルの良いところですね、同じものをコピーできて、端末があればどこからでも引き出せる。'},
    {img:'5.png',speak:'ところがグーグルのスライドやドキュメント、スプレットシートなどのファイルは少し特殊で、自由にコピーできません。例えば、共有アカウント30の畑で、スライドを作ったとします、これを共有ドライブの畑にコピーしてみましょう。'},
    {img:'6.png',speak:'そうすると一見花だけはコピーされましたが、はえているところは前の共有アカウント30の畑からです。一応誰でも使えますがリスクがあります。'},
    {img:'7.png',speak:'いま県から共有アカウント利用が禁止されたので、このまま使い続けると自動的に共有アカウントごと消されてしまうリスクが出てきました。もし、そうなると？'},
    {img:'8.png',speak:'元のスライドがはえている畑がなくなってしまうので、ファイルが一緒に消えてしまいます。'},
    {img:'9.png',speak:'さきほどの音楽や文章、画像やパワーポイント、PDFなどのファイルは、昔からあり、もともとコピーされることがあたりまえの時代の設計なので、こういうことは起こりません。'},
    {img:'10.png',speak:'たとえば、共有ドライブにコピーしたあと、学校が倒壊してパソコンが全部破壊されてデータがふっとんでも、共有ドライブにコピーしたものは残ります。新しいパソコンを買い替えても見られます。グーグルスライドなどの現代のファイルは、作成したユーザーでも所有権をはぎとられ、とにかく所有権などあらゆる面でグーグルなどの開発側に有利な設計になっていますので、グーグルなどのクラウドファイルを扱った際に、こうした事故が起こりやすいです。こういうのをライセンスビジネスと言います。どこからでもアクセスできるという利便性と引き換えにファイルを所有することを剥奪されている特徴があります。'},
    {img:'11.png',speak:'クラスルームは共有ドライブにコピーできません。これは生徒の提出した課題など、先生のだす課題、評価などさらに所有権が複雑になっているので、これを一律コピーできるとややこしくなるので最初から共有ドライブにコピーできないような設計になっています。古いクラスルームの運用については相談してください。'}
  ];

  var CFG_KEY='setumei_cfg';
  var DEFAULT={
    boxes:{
      b1:{x:83.9992935893231,y:82.41119483315394,w:15.156041072735071,h:16.566200215285253},
      b2:{x:55.74286651361102,y:76.81377825618945,w:16.124832858188057,h:22.80947255113025},
      b3:{x:21.835154022756516,y:82.73412271259419,w:16.286298155763554,h:16.02798708288482},
      b4:{x:2.459318313696798,y:75.95263724434876,w:96.61528369957364,h:24.047362755651235},
      b5:{x:2.5400509624845427,y:14.488697524219592,w:10.957943335772132,h:26.03875134553283},
      b6:{x:1.006130635517323,y:73.26157158234662,w:9.343290360017155,h:25.608180839612487},
      b7:{x:73.26185130055251,y:26.329386437029065,w:12.168933067588364,h:27.007534983853606},
      b8:{x:48.47692812271362,y:15.026910656620021,w:10.069884199106895,h:13.552206673842843},
      b9:{x:73.746247193279,y:27.082884822389666,w:11.03867598455988,h:25.177610333692144},
      b10:{x:75.11870222267075,y:24.607104413347685,w:21.37245502939173,h:29.268030139935412},
      b11:{x:50.65670963998284,y:11.044133476856835,w:12.572596311527107,h:19.79547900968784},
      b12:{x:73.66551454449126,y:24.930032292787942,w:23.794434493024195,h:29.483315392895587},
      b13:{x:68.57935767086309,y:25.468245425188375,w:11.523071877286375,h:28.083961248654468}
    },
    arrow:{x:50,y:8,w:10,h:8},
    pageBoxes:[[],["b1","b2","b3"],["b4"],["b5","b6"],["b7"],["b8","b9"],["b10"],["b11","b12"],[],[],["b13"]],
    pageArrows:[false,false,false,false,false,false,false,false,false,false,false]
  };
  function load(){
    try{var c=JSON.parse(localStorage.getItem(CFG_KEY));if(c&&c.boxes&&c.pageBoxes)return c;}catch(e){}
    return JSON.parse(JSON.stringify(DEFAULT));
  }
  var CFG=load();
  var cur=-1;

  function buildBoxEls(){
    for(var id in CFG.boxes){
      if(boxEls[id])continue;
      var el=document.createElement('div');
      el.className='hl box';el.dataset.id=id;
      wrap.appendChild(el);boxEls[id]=el;
    }
  }
  function place(el,c){
    el.style.left=c.x+'%';el.style.top=c.y+'%';el.style.width=c.w+'%';el.style.height=c.h+'%';
  }
  function placeAll(){
    for(var id in CFG.boxes)place(boxEls[id],CFG.boxes[id]);
    place(arrow,CFG.arrow);
    if(wrap.clientHeight)arrow.querySelector('span').style.fontSize=(CFG.arrow.h*wrap.clientHeight/100)+'px';
  }
  function applyShow(i){
    for(var id in boxEls){
      var on=(CFG.pageBoxes[i]||[]).indexOf(id)>=0;
      boxEls[id].style.display=on?'block':'none';
    }
    arrow.style.display=CFG.pageArrows[i]?'block':'none';
    placeAll();
  }
  function fit(){
    if(img.naturalWidth){
      var ar=img.naturalWidth/img.naturalHeight;
      var sw=stage.clientWidth,sh=stage.clientHeight;
      if(sw<=0||sh<=0)return;
      if(sw/sh>ar){wrap.style.width=(sh*ar)+'px';wrap.style.height=sh+'px';}
      else{wrap.style.width=sw+'px';wrap.style.height=(sw/ar)+'px';}
    }else{
      wrap.style.width=stage.clientWidth+'px';wrap.style.height=stage.clientHeight+'px';
    }
    placeAll();
  }

  var voices=[];
  function loadVoices(){if(window.speechSynthesis)voices=window.speechSynthesis.getVoices();}
  if(window.speechSynthesis){window.speechSynthesis.onvoiceschanged=loadVoices;loadVoices();}
  function speak(text){
    caption.textContent=text;
    try{window.speechSynthesis.cancel();}catch(e){}
    var u=new SpeechSynthesisUtterance(text);
    u.lang='ja-JP';u.rate=0.95;u.pitch=1.05;
    var v=voices.filter(function(x){return /^ja/i.test(x.lang);})[0];
    if(v)u.voice=v;
    try{window.speechSynthesis.speak(u);}catch(e){}
  }

  function showPage(i){
    var p=PAGES[i];
    bottomPanel.style.display='block';bar.style.display='flex';caption.style.display='block';
    applyShow(i);
    img.onload=function(){fit();if(p.speak)speak(p.speak);};
    img.src=p.img;
  }
  function toTitle(){
    try{window.speechSynthesis.cancel();}catch(e){}
    bottomPanel.style.display='none';bar.style.display='none';caption.style.display='none';
    img.removeAttribute('src');
    for(var id in boxEls)boxEls[id].style.display='none';
    arrow.style.display='none';
    title.style.display='flex';
  }
  function advance(){
    if(title.style.display!=='none'){title.style.display='none';cur=0;showPage(0);return;}
    cur++;
    if(cur>=PAGES.length){cur=-1;toTitle();return;}
    showPage(cur);
  }

  document.addEventListener('click',advance);
  document.addEventListener('contextmenu',function(e){e.preventDefault();advance();});
  document.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '){e.preventDefault();advance();}
  });
  $('nextBtn').addEventListener('click',function(e){e.stopPropagation();advance();});
  title.addEventListener('click',function(e){e.stopPropagation();advance();});

  window.addEventListener('resize',fit);

  buildBoxEls();
  toTitle();
  window.exportGuidePdf(PAGES,CFG,document.title);
})();
</script>
</body>
</html>
