<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>コピーのしかた</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1226;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;}
body{overscroll-behavior:none;touch-action:manipulation;}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;}
#imgWrap{position:relative;line-height:0;}
#imgWrap img{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;touch-action:manipulation;}
.hl{position:absolute;display:none;pointer-events:none;z-index:10;border:4px solid #ff2222;border-radius:12px;animation:blink .8s ease-in-out infinite;}
.hl.box{background:rgba(255,0,0,.28);}
@keyframes blink{0%,100%{opacity:.35;}50%{opacity:1;}}
#arrow{position:absolute;display:none;pointer-events:none;z-index:11;color:#ff2222;text-align:center;line-height:1;text-shadow:0 0 16px rgba(255,0,0,.95),0 0 4px #fff;animation:bounce .7s ease-in-out infinite;}
#arrow span{display:block;font-weight:900;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(10px);}}
#bar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:50;background:rgba(0,0,0,.78);color:#fff;padding:10px 20px;border-radius:40px;font-size:min(3.4vh,20px);font-weight:bold;text-align:center;white-space:nowrap;border:2px solid rgba(255,255,255,.28);display:none;align-items:center;gap:12px;}
#nextBtn{pointer-events:auto;background:#ffd500;color:#1a1a1a;border:none;border-radius:30px;padding:8px 18px;font-weight:bold;font-size:inherit;cursor:pointer;font-family:inherit;}
#caption{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);z-index:50;background:rgba(255,255,255,.92);color:#b00000;padding:8px 18px;border-radius:30px;font-size:min(3.4vh,20px);font-weight:bold;box-shadow:0 2px 10px rgba(0,0,0,.4);display:none;pointer-events:none;white-space:normal;max-width:94vw;text-align:center;}
#title{position:fixed;inset:0;z-index:60;background:linear-gradient(160deg,#1b2a4a 0%,#0d1226 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;cursor:pointer;padding:0 5vw;}
#title h1{font-size:min(8vh,48px);letter-spacing:.12em;margin-bottom:3vh;}
#title .sub{font-size:min(4vh,24px);margin-bottom:8vh;color:#ccd;}
#title .go{font-size:min(4.5vh,26px);color:#ffd500;animation:blink 1.1s ease-in-out infinite;}
</style>
</head>
<body>
<div id="stage">
  <div id="imgWrap">
    <img id="img" alt="" draggable="false">
    <div id="arrow"><span>&#9660;</span></div>
  </div>
</div>
<div id="bar">
  <span>エンターか左クリック、タッチを押して進めてね！</span>
  <button id="nextBtn">つぎへ ▶</button>
</div>
<div id="caption"></div>
<div id="title">
  <h1>共有アカウントで以前作ったファイルを、自分のアカウントのファイルにしよう</h1>
  <div class="sub">10まいの 絵で おぼえよう</div>
  <div class="go">▼ クリック・タッチ・エンターで はじめる ▼</div>
</div>
<script>
(function(){
  function $(id){return document.getElementById(id);}
  var img=$('img'),wrap=$('imgWrap'),stage=$('stage'),arrow=$('arrow'),
      title=$('title'),bar=$('bar'),caption=$('caption');
  var boxEls={};

  var PAGES=[
    {img:'2026y09m12d_144718557.jpg',speak:'以前共有アカウントで作ったファイルを、共有アカウントから自分のアカウントに移動させたい場合。例えばこのテストという名前のファイルを移動します。共有フォルダにあっても基本的にライセンスは以前の共有アカウントなのは変わらないので、もし共有アカウントが消えたら、共有フォルダのデーターも消えてしまうので心配なら、ここからさきに進めてください'},
    {img:'2026y09m12d_144729792.jpg',speak:'上のファイルを押します。いま、個人のグーグルアカウントでアクセスしていますが、共有アカウントが所有しているデータになります'},
    {img:'2026y09m12d_144738878.jpg',speak:'コピーを作成をおします'},
    {img:'2026y09m12d_144744369.jpg',speak:'プレゼンテーション全体をおします、作った全ページのデータまるごと自分のものになります'},
    {img:'2026y09m12d_144747759.jpg',speak:'名前は好きなものでよいです。ここから保存するやり方を説明します。フォルダの下の楕円をおしてください。前回保存した場所がでると思います'},
    {img:'2026y09m12d_144932509.jpg',speak:'どこに保存するか出ます。あとはフォルダなので、自分の学年のところに保存をしてください。ダブルクリックを押すとどんどんフォルダを展開していきます。今回は共有ドライブの中の06その他フォルダを選びました。クリックして保存したい場所の色が変わったら、下の選択をおしてください'},
    {img:'2026y09m12d_144935437.jpg',speak:'フォルダのところが、06　その他　になっていると思います。ここに保存されます。コピーを作成をおしてください。これで保存が完了します。'},
    {img:'2026y09m12d_144950590.jpg',speak:'本当に保存されているかみてみましょう。ここにあったテスト用ファイルがR8フォルダの中の　06　その他フォルダ　にコピーが入っているはずです'},
    {img:'2026y09m12d_145003439.jpg',speak:'このなかにコピーされています、ひらいてみましょう'},
    {img:'2026y09m12d_145006156.jpg',speak:'コピーしたのがありました。これは自分のアカウントでひらいて、コピーしたので、自分のものになります。もし共有アカウントが消されても、このファイルは残ります。厳密な意味では自分で作ったファイルでもグーグルのページで作ったならグーグルの所有物です。'}
  ];

  var CFG_KEY='copynosikata_cfg';
  var DEFAULT={
    boxes:{
      b1:{x:21.510416666666664,y:59.52902519167579,w:13.385416666666666,h:7.5078723986856515},
      b2:{x:1.9270833333333357,y:3.6692223439211418,w:4.584147135416667,h:3.000068455640745},
      b3:{x:2.65625,y:16.922234392113907,w:12.760416666666666,h:4.3178395399780936},
      b4:{x:19.53125,y:17.579408543263966,w:9.791666666666666,h:4.098781489594742},
      b5:{x:39.479166666666664,y:38.38992332968237,w:13.489583333333332,h:10.239252464403068},
      b6:{x:34.322916666666664,y:52.62869660460022,w:30.677083333333332,h:4.328107886089814},
      b7:{x:61.354166666666664,y:72.56297918948522,w:4.739583333333333,h:7.1827081051478645},
      b8:{x:53.75,y:72.78203723986857,w:7.708333333333334,h:6.52553395399781},
      b9:{x:39.895833333333336,y:43.75684556407448,w:7.8125,h:6.8455640744797375},
      b10:{x:22.1875,y:43.975903614457835,w:7.083333333333333,h:7.3932092004381165},
      b11:{x:21.822916666666664,y:76.50602409638554,w:10.3125,h:7.732064622124864},
      b12:{x:22.135416666666668,y:36.30887185104052,w:14.947916666666666,h:8.04867196056955}
    },
    arrow:{x:50,y:8,w:10,h:8},
    pageBoxes:[["b1"],["b2"],["b3"],["b4"],["b5"],["b6","b7"],["b8","b9"],["b10"],["b11"],["b12"]],
    pageArrows:[false,false,false,false,false,false,false,false,false,false]
  };
  function load(){
    try{var c=JSON.parse(localStorage.getItem(CFG_KEY));if(c&&c.boxes&&c.pageBoxes)return c;}catch(e){}
    return JSON.parse(JSON.stringify(DEFAULT));
  }
  var CFG=load();
  var cur=-1;

  function buildBoxEls(){
    for(var id in CFG.boxes){
      if(boxEls[id])continue;
      var el=document.createElement('div');
      el.className='hl box';el.dataset.id=id;
      wrap.appendChild(el);boxEls[id]=el;
    }
  }
  function place(el,c){
    el.style.left=c.x+'%';el.style.top=c.y+'%';el.style.width=c.w+'%';el.style.height=c.h+'%';
  }
  function placeAll(){
    for(var id in CFG.boxes)place(boxEls[id],CFG.boxes[id]);
    place(arrow,CFG.arrow);
    arrow.querySelector('span').style.fontSize=(CFG.arrow.h*wrap.clientHeight/100)+'px';
  }
  function applyShow(i){
    for(var id in boxEls){
      var on=(CFG.pageBoxes[i]||[]).indexOf(id)>=0;
      boxEls[id].style.display=on?'block':'none';
    }
    arrow.style.display=CFG.pageArrows[i]?'block':'none';
    placeAll();
  }
  function fit(){
    if(img.naturalWidth){
      var ar=img.naturalWidth/img.naturalHeight;
      var sw=stage.clientWidth,sh=stage.clientHeight;
      if(sw/sh>ar){wrap.style.width=(sh*ar)+'px';wrap.style.height=sh+'px';}
      else{wrap.style.width=sw+'px';wrap.style.height=(sw/ar)+'px';}
    }else{
      wrap.style.width=stage.clientWidth+'px';wrap.style.height=stage.clientHeight+'px';
    }
    placeAll();
  }

  var voices=[];
  function loadVoices(){if(window.speechSynthesis)voices=window.speechSynthesis.getVoices();}
  if(window.speechSynthesis){window.speechSynthesis.onvoiceschanged=loadVoices;loadVoices();}
  function speak(text){
    caption.textContent=text;
    try{window.speechSynthesis.cancel();}catch(e){}
    var u=new SpeechSynthesisUtterance(text);
    u.lang='ja-JP';u.rate=0.95;u.pitch=1.05;
    var v=voices.filter(function(x){return /^ja/i.test(x.lang);})[0];
    if(v)u.voice=v;
    try{window.speechSynthesis.speak(u);}catch(e){}
  }

  function showPage(i){
    var p=PAGES[i];
    bar.style.display='flex';caption.style.display='block';
    applyShow(i);
    img.onload=function(){fit();if(p.speak)speak(p.speak);};
    img.src=p.img;
  }
  function toTitle(){
    try{window.speechSynthesis.cancel();}catch(e){}
    caption.style.display='none';bar.style.display='none';
    img.removeAttribute('src');
    for(var id in boxEls)boxEls[id].style.display='none';
    arrow.style.display='none';
    title.style.display='flex';
  }
  function advance(){
    if(title.style.display!=='none'){title.style.display='none';cur=0;showPage(0);return;}
    cur++;
    if(cur>=PAGES.length){cur=-1;toTitle();return;}
    showPage(cur);
  }

  document.addEventListener('click',advance);
  document.addEventListener('contextmenu',function(e){e.preventDefault();advance();});
  document.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '){e.preventDefault();advance();}
  });
  $('nextBtn').addEventListener('click',function(e){e.stopPropagation();advance();});
  title.addEventListener('click',function(e){e.stopPropagation();advance();});

  window.addEventListener('resize',fit);

  buildBoxEls();
  toTitle();
})();
</script>
</body>
</html>
