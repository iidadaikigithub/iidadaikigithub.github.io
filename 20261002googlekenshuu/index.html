<!DOCTYPE html><html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Google研修 2026年</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;min-height:100%;background:linear-gradient(160deg,#1b2a4a 0%,#0d1226 100%);font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#fff;}
#wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6vh 4vw;}
h1{font-size:min(8vw,56px);letter-spacing:.14em;text-align:center;margin-bottom:2vh;
   text-shadow:0 0 18px rgba(255,213,0,.55);}
.sub{font-size:min(4vw,22px);color:#ccd;margin-bottom:6vh;text-align:center;}


/* プリロード画面 */
#load{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#1b2a4a 0%,#0d1226 100%);
      display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 8vw;}
#load .lt{font-size:min(7vw,40px);letter-spacing:.12em;margin-bottom:5vh;text-align:center;}
#barWrap{width:80%;max-width:600px;height:min(3vh,22px);background:rgba(255,255,255,.18);
         border-radius:30px;overflow:hidden;border:2px solid rgba(255,255,255,.3);}
#barFill{height:100%;width:0%;background:linear-gradient(90deg,#ffd500,#ff8a00);transition:width .2s ease;}
#pct{font-size:min(9vw,64px);font-weight:bold;margin-top:4vh;color:#ffd500;
      text-shadow:0 0 18px rgba(255,213,0,.6);}
#lmsg{font-size:min(4vw,20px);color:#ccd;margin-top:3vh;text-align:center;}


/* メニュー */
#icons{display:none;flex-wrap:wrap;justify-content:center;gap:min(4vw,40px);width:100%;max-width:1100px;}
.icon{flex:1 1 180px;max-width:230px;display:flex;flex-direction:column;align-items:center;
      text-decoration:none;color:#fff;background:rgba(255,255,255,.06);
      border:2px solid rgba(255,255,255,.25);border-radius:18px;padding:14px;
      transition:transform .15s ease,box-shadow .15s ease,background .15s ease;}
.icon:hover,.icon:active{transform:translateY(-6px);background:rgba(255,255,255,.14);
      box-shadow:0 10px 30px rgba(255,213,0,.35);border-color:#ffd500;}
.icon img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:12px;
      background:#000;display:block;pointer-events:none;}
.icon span{margin-top:12px;font-size:min(4.4vw,20px);font-weight:bold;text-align:center;letter-spacing:.04em;}
.icon small{margin-top:4px;font-size:min(3.2vw,14px);color:#9ab;font-weight:normal;}
</style>
</head>
<body>


<div id="load">
  <div class="lt">共有アカウントが禁止されました、これからの保存先の紹介</div>
  <div id="barWrap"><div id="barFill"></div></div>
  <div id="pct">0%</div>
  <div id="lmsg">画像をよみこみ中…</div>
</div>


<div id="wrap" style="display:none;">
  <h1>県から共有アカウント利用が禁止されました！<br>新しい保存の仕方や場所などの手順書です！</h1>
  <div class="sub">自分のグーグルアカウントが分からなくなったらICT推進チームに聞いてね</div>
  <div id="icons">
    <a class="icon" href="atarasiicopynosikata/index.html">
      <img src="atarasiicopynosikata/2026y09m12d_181003449.jpg" alt="新しいコピーの仕方">
      <span>googleで作ったスライドなどのファイルを共有フォルダに入れてみよう</span>
      <small>これからの保存の仕方</small>
    </a>
    <a class="icon" href="copynosikata/index.html">
      <img src="copynosikata/2026y09m12d_144718557.jpg" alt="コピーの仕方">
      <span>以前、共有アカウントで作ったファイルを個人アカウントで保存する方法</span>
      <small>万が一、共有アカウントを強制的に削除されてもいいようにデータを守る方法です、本当に大事なデータのみ使ってください</small>
    </a>
    <a class="icon" href="kyouyuuhadoko/index.html">
      <img src="kyouyuuhadoko/2026y09m12d_144319290.jpg" alt="共有はどこ">
      <span>これからは「共有フォルダ」を使います</span>
      <small>新しく使う場所への行き方</small>
    </a>
  </div>
</div>


<script>
(function(){
  var files=[
    "atarasiicopynosikata/2026y09m12d_181003449.jpg",
    "atarasiicopynosikata/2026y09m12d_181011839.jpg",
    "atarasiicopynosikata/2026y09m12d_181029495.jpg",
    "atarasiicopynosikata/2026y09m12d_181042707.jpg",
    "atarasiicopynosikata/2026y09m12d_181054174.jpg",
    "atarasiicopynosikata/2026y09m12d_181101810.jpg",
    "atarasiicopynosikata/2026y09m12d_181120598.jpg",
    "atarasiicopynosikata/2026y09m12d_181123125.jpg",
    "atarasiicopynosikata/2026y09m12d_181134935.jpg",
    "atarasiicopynosikata/2026y09m12d_181145442.jpg",
    "atarasiicopynosikata/2026y09m12d_181200555.jpg",
    "atarasiicopynosikata/2026y09m12d_181202893.jpg",
    "atarasiicopynosikata/2026y09m12d_181204691.jpg",
    "copynosikata/2026y09m12d_144718557.jpg",
    "copynosikata/2026y09m12d_144729792.jpg",
    "copynosikata/2026y09m12d_144738878.jpg",
    "copynosikata/2026y09m12d_144744369.jpg",
    "copynosikata/2026y09m12d_144747759.jpg",
    "copynosikata/2026y09m12d_144932509.jpg",
    "copynosikata/2026y09m12d_144935437.jpg",
    "copynosikata/2026y09m12d_144950590.jpg",
    "copynosikata/2026y09m12d_145003439.jpg",
    "copynosikata/2026y09m12d_145006156.jpg",
    "kyouyuuhadoko/2026y09m12d_144319290.jpg",
    "kyouyuuhadoko/2026y09m12d_144330245.jpg",
    "kyouyuuhadoko/2026y09m12d_144351618.jpg",
    "kyouyuuhadoko/2026y09m12d_144359067.jpg",
    "kyouyuuhadoko/2026y09m12d_144407661.jpg"
  ];


  var total=files.length, done=0;
  var barFill=document.getElementById('barFill');
  var pct=document.getElementById('pct');
  var lmsg=document.getElementById('lmsg');


  function update(){
    var p=Math.floor(done/total*100);
    barFill.style.width=p+'%';
    pct.textContent=p+'%';
    lmsg.textContent='画像をよみこみ中… '+done+' / '+total;
  }
  var finished=false;
  function finish(){
    if(finished)return;
    finished=true;
    pct.textContent='100%';
    barFill.style.width='100%';
    lmsg.textContent='よみこみ かんりょう！ えらんでね';
    document.getElementById('load').style.display='none';
    document.getElementById('wrap').style.display='flex';
    document.getElementById('icons').style.display='flex';
  }


  if(total===0){finish();return;}




  files.forEach(function(src){
    var img=new Image();
    var settled=false;
    function step(){
      if(settled)return;settled=true;
      done++;update();
      if(done>=total)finish();
    }
    img.onload=step;
    img.onerror=step;
    img.src=src;
  });


  /* 安全策：最長30秒で強制表示（一部未読み込みでも操作できる） */
  setTimeout(finish,30000);
})();
</script>
</body>
</html>
