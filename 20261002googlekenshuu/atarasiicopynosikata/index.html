<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>googleで作ったファイル共有フォルダに入れてみよう</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1226;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;}
body{overscroll-behavior:none;touch-action:manipulation;}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;}
#imgWrap{position:relative;line-height:0;}
#imgWrap img{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;touch-action:manipulation;}
.hl{position:absolute;display:none;pointer-events:none;z-index:10;border:4px solid #ff2222;border-radius:12px;animation:blink .8s ease-in-out infinite;}
.hl.box{background:rgba(255,0,0,.28);}
@keyframes blink{0%,100%{opacity:.35;}50%{opacity:1;}}
#arrow{position:absolute;display:none;pointer-events:none;z-index:11;color:#ff2222;text-align:center;line-height:1;text-shadow:0 0 16px rgba(255,0,0,.95),0 0 4px #fff;animation:bounce .7s ease-in-out infinite;}
#arrow span{display:block;font-weight:900;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(10px);}}
#bar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:50;background:rgba(0,0,0,.78);color:#fff;padding:10px 20px;border-radius:40px;font-size:min(3.4vh,20px);font-weight:bold;text-align:center;white-space:nowrap;border:2px solid rgba(255,255,255,.28);display:none;align-items:center;gap:12px;}
#nextBtn{pointer-events:auto;background:#ffd500;color:#1a1a1a;border:none;border-radius:30px;padding:8px 18px;font-weight:bold;font-size:inherit;cursor:pointer;font-family:inherit;}
#caption{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);z-index:50;background:rgba(255,255,255,.92);color:#b00000;padding:8px 18px;border-radius:30px;font-size:min(3.4vh,20px);font-weight:bold;box-shadow:0 2px 10px rgba(0,0,0,.4);display:none;pointer-events:none;white-space:normal;max-width:94vw;text-align:center;}
#caption.middle{top:50%;bottom:auto;transform:translate(-50%,-50%);}
#title{position:fixed;inset:0;z-index:60;background:linear-gradient(160deg,#1b2a4a 0%,#0d1226 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;cursor:pointer;padding:0 5vw;}
#title h1{font-size:min(8vh,48px);letter-spacing:.12em;margin-bottom:3vh;}
#title .sub{font-size:min(4vh,24px);margin-bottom:8vh;color:#ccd;}
#title .go{font-size:min(4.5vh,26px);color:#ffd500;animation:blink 1.1s ease-in-out infinite;}
</style>
</head>
<body>
<div id="stage">
  <div id="imgWrap">
    <img id="img" alt="" draggable="false">
    <div id="arrow"><span>&#9660;</span></div>
  </div>
</div>
<div id="bar">
  <span>エンターか左クリック、タッチを押して進めてね！</span>
  <button id="nextBtn">つぎへ ▶</button>
</div>
<div id="caption"></div>
<div id="title">
  <h1>googleで作ったファイル共有フォルダに入れてみよう</h1>
  <div class="sub">13まいの 絵で おぼえよう</div>
  <div class="go">▼ クリック・タッチ・エンターで はじめる ▼</div>
</div>
<script>
(function(){
  function $(id){return document.getElementById(id);}
  var img=$('img'),wrap=$('imgWrap'),stage=$('stage'),arrow=$('arrow'),
      title=$('title'),bar=$('bar'),caption=$('caption');
  var boxEls={};

  var PAGES=[
    {img:'2026y09m12d_181003449.jpg',speak:'例えば、このグーグルのスライドファイルを共有フォルダに保存してみましょう。ファイルをおします'},
    {img:'2026y09m12d_181011839.jpg',speak:'コピーを作成をおして、プレゼンテーション全体をおします'},
    {img:'2026y09m12d_181029495.jpg',speak:'名前をつけます、今回はじっけんようとつけます'},
    {img:'2026y09m12d_181042707.jpg',speak:'フォルダの下の楕円をおしてください'},
    {img:'2026y09m12d_181054174.jpg',speak:'すべての場所をおすと共有ドライブが出ます。候補のところは、自分が以前保存したフォルダがでます。共有ドライブをダブルクリックします'},
    {img:'2026y09m12d_181101810.jpg',speak:'学校のフォルダが出ますので、またダブルクリックをおします'},
    {img:'2026y09m12d_181120598.jpg',speak:'R8フォルダをまたダブルクリックします'},
    {img:'2026y09m12d_181123125.jpg',speak:'各学部のフォルダが出ます。自分の学部を選びましょう。今回は共有フォルダの中のR8フォルダに保存します。選択をおします'},
    {img:'2026y09m12d_181134935.jpg',speak:'保存するフォルダがR8になりました。コピーを作成を押すと、共有フォルダへの保存が完了します'},
    {img:'2026y09m12d_181145442.jpg',speak:'保存が完了すると元のスライド画面にもどります。保存はこれでOKですが、確認してみましょう。今度はまたグーグルドライブのページにいきましょう。共有フォルダに本当に保存できたか確認しましょう'},
    {img:'2026y09m12d_181200555.jpg',speak:'グーグルのドライブをひらきます。共有ドライブをおして、学校名をおします'},
    {img:'2026y09m12d_181202893.jpg',speak:'R８フォルダをひらきます'},
    {img:'2026y09m12d_181204691.jpg',speak:'下に「じっけんよう」とつけたファイルがここにはいっていますね。次回から電子黒板でもアイパッドでも、自分のグーグルアカウントでログインして、ドライブをおして、共有ドライブをおせば、インターネットがつながっていればどこからでもファイルにアクセスできますのでよかったら使ってください。以上で終わります'}
  ];

  var CFG_KEY='atarasiicopynosikata_cfg';
  var DEFAULT={
    boxes:{
      b1:{x:1.6141764322916625,y:2.873041713397523,w:5.625813802083333,h:4.095358707557502},
      b2:{x:19.895833333333336,y:17.14129244249726,w:11.614583333333334,h:4.865484665936473},
      b3:{x:2.65625,y:17.031763417305584,w:15.885416666666666,h:3.879723439211391},
      b4:{x:39.895833333333336,y:30.284775465498356,w:15.937499999999998,h:8.046960569550931},
      b5:{x:39.947916666666664,y:43.53778751369113,w:8.697916666666666,h:6.8455640744797375},
      b6:{x:43.489583333333336,y:21.960569550930998,w:5.572916666666667,h:6.729189485213581},
      b7:{x:34.53125,y:30.72289156626506,w:11.510416666666666,h:4.213444687842278},
      b8:{x:34.270833333333336,y:33.78970427163198,w:22.447916666666668,h:4.213444687842278},
      b9:{x:61.510416666666664,y:72.56297918948522,w:4.322916666666667,h:6.744592004381161},
      b10:{x:53.854166666666664,y:72.89156626506025,w:7.239583333333334,h:6.635062979189485},
      b11:{x:40,y:43.975903614457835,w:5.208333333333334,h:6.188389923329683},
      b12:{x:21.822916666666664,y:37.07557502738226,w:17.864583333333332,h:6.296207557502738},
      b13:{x:0.5729166666666643,y:47.042716319824756,w:17.396647135416668,h:5.859802847754655},
      b14:{x:21.5625,y:43.2092004381161,w:7.291666666666667,h:8.159912376779847},
      b15:{x:21.666666666666668,y:83.95399780941949,w:11.822916666666666,h:8.61000821467689},
      b16:{x:34.79166666666667,y:31.70865279299014,w:6.979166666666667,h:4.213444687842278}
    },
    arrow:{x:36.35416666666667,y:25.962760131434827,w:10,h:8},
    pageBoxes:[["b1"],["b2","b3"],["b4"],["b5"],["b6","b16"],["b7"],["b8"],["b9"],["b10","b11"],[],["b12","b13"],["b14"],["b15"]],
    pageArrows:[false,true,false,false,true,false,false,false,false,false,false,false,false]
  };
  function load(){
    try{var c=JSON.parse(localStorage.getItem(CFG_KEY));if(c&&c.boxes&&c.pageBoxes)return c;}catch(e){}
    return JSON.parse(JSON.stringify(DEFAULT));
  }
  var CFG=load();
  var cur=-1;

  function buildBoxEls(){
    for(var id in CFG.boxes){
      if(boxEls[id])continue;
      var el=document.createElement('div');
      el.className='hl box';el.dataset.id=id;
      wrap.appendChild(el);boxEls[id]=el;
    }
  }
  function place(el,c){
    el.style.left=c.x+'%';el.style.top=c.y+'%';el.style.width=c.w+'%';el.style.height=c.h+'%';
  }
  function placeAll(){
    for(var id in CFG.boxes)place(boxEls[id],CFG.boxes[id]);
    place(arrow,CFG.arrow);
    arrow.querySelector('span').style.fontSize=(CFG.arrow.h*wrap.clientHeight/100)+'px';
  }
  function applyShow(i){
    for(var id in boxEls){
      var on=(CFG.pageBoxes[i]||[]).indexOf(id)>=0;
      boxEls[id].style.display=on?'block':'none';
    }
    arrow.style.display=CFG.pageArrows[i]?'block':'none';
    placeAll();
  }
  function fit(){
    if(img.naturalWidth){
      var ar=img.naturalWidth/img.naturalHeight;
      var sw=stage.clientWidth,sh=stage.clientHeight;
      if(sw/sh>ar){wrap.style.width=(sh*ar)+'px';wrap.style.height=sh+'px';}
      else{wrap.style.width=sw+'px';wrap.style.height=(sw/ar)+'px';}
    }else{
      wrap.style.width=stage.clientWidth+'px';wrap.style.height=stage.clientHeight+'px';
    }
    placeAll();
  }

  var voices=[];
  var speechTimer=null;
  var returnTimer=null;
  function loadVoices(){if(window.speechSynthesis)voices=window.speechSynthesis.getVoices();}
  if(window.speechSynthesis){window.speechSynthesis.onvoiceschanged=loadVoices;loadVoices();}
  function speak(text){
    if(!text)return;
    caption.textContent=text;
    try{window.speechSynthesis.cancel();}catch(e){}
    var u=new SpeechSynthesisUtterance(text);
    u.lang='ja-JP';u.rate=0.95;u.pitch=1.05;
    var v=voices.filter(function(x){return /^ja/i.test(x.lang);})[0];
    if(v)u.voice=v;
    try{window.speechSynthesis.speak(u);}catch(e){}
  }
  function scheduleSpeech(text){
    if(!text)return;
    if(speechTimer)clearTimeout(speechTimer);
    speechTimer=setTimeout(function(){speak(text);speechTimer=null;},120);
  }
  function scheduleReturn(){
    if(returnTimer)clearTimeout(returnTimer);
    var p=PAGES[cur];
    var delay=Math.max(4000,Math.min(12000,(p&&p.speak?p.speak.length:0)*120));
    returnTimer=setTimeout(function(){window.location.href='../index.html';},delay);
  }

  function showPage(i){
    var p=PAGES[i];
    cur=i;
    bar.style.display='flex';caption.style.display='block';
    caption.classList.toggle('middle',i===PAGES.length-1);
    applyShow(i);
    img.onload=function(){fit();};
    img.src=p.img;
    scheduleSpeech(p.speak);
    if(i===PAGES.length-1){scheduleReturn();}else if(returnTimer){clearTimeout(returnTimer);returnTimer=null;}
  }
  function toTitle(){
    if(speechTimer)clearTimeout(speechTimer);
    if(returnTimer)clearTimeout(returnTimer);
    try{window.speechSynthesis.cancel();}catch(e){}
    caption.style.display='none';caption.classList.remove('middle');bar.style.display='none';
    img.removeAttribute('src');
    for(var id in boxEls)boxEls[id].style.display='none';
    arrow.style.display='none';
    title.style.display='flex';
    window.location.href='../index.html';
  }
  function advance(){
    if(title.style.display!=='none'){title.style.display='none';cur=0;showPage(0);return;}
    cur++;
    if(cur>=PAGES.length){cur=-1;toTitle();return;}
    showPage(cur);
  }

  document.addEventListener('click',advance);
  document.addEventListener('contextmenu',function(e){e.preventDefault();advance();});
  document.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '){e.preventDefault();advance();}
  });
  $('nextBtn').addEventListener('click',function(e){e.stopPropagation();advance();});
  title.addEventListener('click',function(e){e.stopPropagation();advance();});

  window.addEventListener('resize',fit);

  buildBoxEls();
  toTitle();
})();
</script>
</body>
</html>
