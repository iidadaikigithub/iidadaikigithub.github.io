<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>crane Game 1 設定</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#e0e0e0;font-family:'Segoe UI',sans-serif;display:flex;justify-content:center;padding:30px 10px;min-height:100vh}
.card{background:#16213e;border-radius:16px;padding:30px;width:100%;max-width:480px;box-shadow:0 8px 32px rgba(0,0,0,.4)}
h1{text-align:center;color:#FFD700;font-size:1.4rem;margin-bottom:24px}
.row{margin-bottom:18px}
.row label{display:flex;justify-content:space-between;margin-bottom:6px;font-size:.9rem;color:#aaa}
.row label span{color:#FFD700;font-weight:600}
input[type=range]{width:100%;-webkit-appearance:none;height:6px;border-radius:3px;background:#0f3460;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#FFD700;cursor:pointer}
.section-title{color:#FFD700;font-size:.95rem;margin:20px 0 10px;border-bottom:1px solid #0f3460;padding-bottom:6px}
.images{display:flex;flex-wrap:wrap;gap:10px;max-height:200px;overflow-y:auto;padding:4px 0}
.images::-webkit-scrollbar{width:6px}
.images::-webkit-scrollbar-thumb{background:#0f3460;border-radius:3px}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:8px;border:2px solid transparent;cursor:pointer;transition:border-color .2s,transform .2s}
.thumb:hover{transform:scale(1.08)}
.thumb.selected{border-color:#FFD700;box-shadow:0 0 8px rgba(255,215,0,.5)}
.images.glow{box-shadow:0 0 16px rgba(255,215,0,0.9);border-radius:10px;animation:glowPulse 1s ease-in-out infinite}
@keyframes glowPulse{0%,100%{box-shadow:0 0 12px rgba(255,215,0,0.7)}50%{box-shadow:0 0 20px rgba(255,215,0,1)}}
.slot-hint{font-size:.8rem;color:#888;margin:8px 0 4px}
.slot .szBadge{position:absolute;bottom:2px;right:2px;background:rgba(0,0,0,0.7);color:#FFD700;font-size:9px;padding:1px 4px;border-radius:4px;font-weight:600}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{width:64px;height:64px;border-radius:8px;border:2px dashed #0f3460;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .2s,border-style .2s;position:relative;overflow:hidden}
.slot:hover{border-color:#FFD700}
.slot.assigned{border-style:solid;border-color:#4ecca3}
.slot.assigned img{width:100%;height:100%;object-fit:cover;border-radius:6px}
.slot .num{color:#555;font-size:12px;font-weight:600}
.slot .clear{position:absolute;top:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:#ff4444;color:#fff;font-size:11px;display:none;align-items:center;justify-content:center;cursor:pointer;line-height:1;z-index:1}
.slot.assigned .clear{display:flex}
.buttons{display:flex;gap:12px;margin-top:24px}
button{flex:1;padding:12px;border:none;border-radius:10px;font-size:.95rem;font-weight:600;cursor:pointer;transition:background .2s}
.btn-save{background:#FFD700;color:#1a1a2e}
.btn-save:hover{background:#e6c200}
.btn-load{background:#0f3460;color:#e0e0e0;border:1px solid #FFD700}
.btn-load:hover{background:#1a3a6e}
.msg{text-align:center;margin-top:14px;min-height:20px;font-size:.85rem;color:#4ecca3;transition:opacity .3s}
</style>
</head>
<body>
<div class="card">
  <h1>クレーンゲーム 1 設定</h1>
  <div id="playerBar" style="text-align:center;margin-bottom:14px;font-size:.82rem;color:#FFD700"></div>

  <div class="row">
    <label>ボタンを押した時のクレーンの移動のスピード <span id="v_spd">50</span></label>
    <input type="range" id="spd" min="1" max="100" value="50" oninput="document.getElementById('v_spd').textContent=this.value">
  </div>
  <div class="row">
    <label>クレーンのつめのついている幅 <span id="v_size">5</span></label>
    <input type="range" id="size" min="1" max="10" value="5" oninput="document.getElementById('v_size').textContent=this.value">
  </div>
  <div class="row">
    <label>つめの数 <span id="v_claw">3</span></label>
    <input type="range" id="claw" min="2" max="6" value="3" oninput="document.getElementById('v_claw').textContent=this.value">
  </div>
  <div class="row">
    <label>自動でおかれる景品のかず <span id="v_prize">14</span></label>
    <input type="range" id="prize" min="4" max="30" value="14" oninput="document.getElementById('v_prize').textContent=this.value;renderSlots()">
  </div>
  <div class="row">
    <label>無印景品の大きさ <span id="v_psz">5</span></label>
    <input type="range" id="psz" min="1" max="10" value="5" oninput="document.getElementById('v_psz').textContent=this.value">
  </div>
  <div class="row">
    <label>アームの強さ（しまり具合） <span id="v_armStr">5</span></label>
    <input type="range" id="armStr" min="1" max="10" value="5" oninput="document.getElementById('v_armStr').textContent=this.value">
  </div>
  <div class="row">
    <label>アームのまがり方 <span id="v_armCurve">0</span></label>
    <input type="range" id="armCurve" min="0" max="10" value="0" oninput="document.getElementById('v_armCurve').textContent=this.value">
  </div>
  <div class="row">
    <label>アームの付けねのやわらかさ（0=かたい、景品が跳ねる / 10=やわらかい、アームが傾く） <span id="v_armFlex">5</span></label>
    <input type="range" id="armFlex" min="0" max="10" value="5" oninput="document.getElementById('v_armFlex').textContent=this.value">
  </div>
  <div class="row">
    <label>つかんだあとの移動のスピード <span id="v_dropSpd">5</span></label>
    <input type="range" id="dropSpd" min="1" max="10" value="5" oninput="document.getElementById('v_dropSpd').textContent=this.value">
  </div>
  <div class="row">
    <label>アームのゴム（取れやすさ） <span id="v_grip">ふつうのゴム</span></label>
    <input type="range" id="grip" min="0" max="4" step="1" value="2" oninput="gripLabel(this.value)">
    <div style="display:flex;justify-content:space-between;font-size:10px;color:#666;margin-top:2px"><span>なし</span><span>プラスチック</span><span>硬いゴム</span><span>ふつうのゴム</span><span>やわらかいゴム</span></div>
  </div>

  <div class="section-title">利用可能な画像</div>
  <div class="images" id="imgList"></div>
  <div id="imgDetail" style="display:none;margin-top:10px;padding:10px;background:#0f3460;border-radius:8px;">
    <div style="font-size:12px;color:#FFD700;margin-bottom:6px">選択中の画像の景品情報</div>
    <input id="imgName" type="text" placeholder="景品名" style="width:100%;padding:6px;border-radius:6px;border:1px solid #333;background:#1a1a2e;color:#fff;margin-bottom:6px;font-size:13px">
    <input id="imgDesc" type="text" placeholder="説明" style="width:100%;padding:6px;border-radius:6px;border:1px solid #333;background:#1a1a2e;color:#fff;margin-bottom:6px;font-size:13px">
    <div style="display:flex;gap:8px">
      <button onclick="saveImgDetail()" style="flex:1;padding:6px;border:none;border-radius:6px;background:#FFD700;color:#1a1a2e;font-weight:600;cursor:pointer;font-size:12px">画像情報を保存</button>
      <button onclick="deleteImgDetail()" style="padding:6px 12px;border:none;border-radius:6px;background:#ff4444;color:#fff;font-weight:600;cursor:pointer;font-size:12px">削除</button>
    </div>
  </div>
  <div class="slot-hint">画像を選んでからスロットをクリックで割り当て / スロットをクリックで名前・説明を編集（ガラス球の中に画像）</div>
  <div class="section-title">景品スロット（画像をドラッグ＆ドロップまたはタップで割り当て）</div>
  <div class="slots" id="slotList"></div>

  <div class="buttons">
    <button class="btn-load" onclick="loadSettings()">読み込み</button>
    <button class="btn-save" onclick="saveSettings()">保存</button>
  </div>
  <div class="msg" id="msg"></div>
</div>

<script>
// 名前別セーブ（entrance.htmlで入力・?name=／localStorageで継続）
const PLAYER=(function(){try{const q=new URL(location.href).searchParams.get('name');if(q&&q.trim())return q.trim().replace(/\//g,'_').slice(0,30);}catch(e){}try{const s=localStorage.getItem('cranePlayer');if(s&&s.trim())return s.trim().replace(/\//g,'_').slice(0,30);}catch(e){}return '';})();
const DOC = PLAYER?('game1__'+PLAYER):'game1';
try{
  if(PLAYER){try{localStorage.setItem('cranePlayer',PLAYER);}catch(e){}}
  document.addEventListener('DOMContentLoaded',()=>{
    const bar=document.getElementById('playerBar');
    if(bar)bar.innerHTML=(PLAYER?('👤 '+PLAYER+' さんのスペースに保存します'):'👤 ゲスト（共用スペース）')+' ・ <a href="entrance.html'+(PLAYER?('?name='+encodeURIComponent(PLAYER)):'')+'" style="color:#FFD700">入り口へ</a>';
  });
}catch(e){}

const firebaseConfig = {apiKey:"AIzaSyAz9BzwKNFHVzJ8rzqegk2zmleE0wQtl3M",authDomain:"crane-243f1.firebaseapp.com",projectId:"crane-243f1",storageBucket:"crane-243f1.firebasestorage.app",messagingSenderId:"953128740269",appId:"1:953128740269:web:41cd389b56a96e04efed24"};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let selectedImg = null;
let prizeImages = []; // [{imgId, name, desc, size}, null, ...]
let imgUrls = {};
let imgDataMap = {};
const sliders = ['spd','size','claw','prize','psz','armStr','armCurve','armFlex','dropSpd','grip'];
const GRIP_NAMES = ['なし','プラスチック','硬いゴム','ふつうのゴム','やわらかいゴム'];
function gripLabel(v){document.getElementById('v_grip').textContent=GRIP_NAMES[Number(v)]||v;}

function showMsg(t){const m=document.getElementById('msg');m.textContent=t;m.style.opacity=1;setTimeout(()=>m.style.opacity=0,2500)}

function loadImages(){
  db.collection('images').get().then(snap=>{
    const c=document.getElementById('imgList');c.innerHTML='';
    snap.forEach(doc=>{
      const d=doc.data();
      imgDataMap[doc.id]=d;
      const imgUrl='data:image/jpeg;base64,'+d.data;
      imgUrls[doc.id]=imgUrl;
      const wrap=document.createElement('div');
      wrap.style.cssText='position:relative;display:inline-block;width:64px;height:64px';
      wrap.draggable=true;
      wrap.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',doc.id);e.dataTransfer.effectAllowed='copy';});
      wrap.addEventListener('touchstart',()=>{selectedImg=doc.id;document.querySelectorAll('.thumb.selected').forEach(el=>el.classList.remove('selected'));const im=wrap.querySelector('img');if(im)im.classList.add('selected');document.getElementById('imgDetail').style.display='block';const dd=imgDataMap[doc.id]||{};document.getElementById('imgName').value=dd.name||'';document.getElementById('imgDesc').value=dd.desc||'';},{passive:true});
      const img=document.createElement('img');
      img.className='thumb';
      img.src=imgUrl;
      img.title=(d.name||doc.id)+(d.desc?' - '+d.desc:'');
      img.style.cssText='width:64px;height:64px;object-fit:cover;border-radius:8px;border:2px solid transparent;cursor:pointer;transition:border-color .2s,transform .2s;display:block';
      img.onclick=()=>{
        if(selectedImg===doc.id){selectedImg=null;img.classList.remove('selected');document.getElementById('imgDetail').style.display='none';}
        else{
          document.querySelectorAll('.thumb.selected').forEach(e=>e.classList.remove('selected'));img.classList.add('selected');selectedImg=doc.id;
          document.getElementById('imgDetail').style.display='block';
          document.getElementById('imgName').value=d.name||'';
          document.getElementById('imgDesc').value=d.desc||'';
        }
      };
      const del=document.createElement('div');
      del.textContent='×';
      del.title='削除';
      del.style.cssText='position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#ff4444;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;line-height:1';
      del.onclick=async(e)=>{
        e.stopPropagation();
        if(!confirm('この画像を削除しますか？'))return;
        try{await db.collection('images').doc(doc.id).delete();showMsg('画像を削除しました');loadImages();}catch(err){showMsg('削除失敗: '+err.message);}
      };
      wrap.appendChild(img);
      wrap.appendChild(del);
      c.appendChild(wrap);
    });
    if(snap.empty){c.innerHTML='<span style="color:#888;font-size:13px">画像がありません。upload.htmlで追加してください</span>';}
  });
}

function speakSelect(){try{const u=new SpeechSynthesisUtterance('景品にしたい画像を選んでください');u.lang='ja-JP';u.rate=1;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
function glowImages(on){const el=document.getElementById('imgList');if(on)el.classList.add('glow');else el.classList.remove('glow');}
function renderSlots(){
  const n=Number(document.getElementById('prize').value);
  while(prizeImages.length<n)prizeImages.push(null);
  while(prizeImages.length>n)prizeImages.pop();
  const c=document.getElementById('slotList');c.innerHTML='';
  for(let i=0;i<n;i++){
    const slot=document.createElement('div');
    slot.className='slot'+(prizeImages[i]?' assigned':'');
    slot.dataset.idx=i;
    if(prizeImages[i]){
      const thumbImg=document.createElement('img');
      thumbImg.src=imgUrls[prizeImages[i].imgId]||'';
      slot.appendChild(thumbImg);
      const badge=document.createElement('div');badge.className='szBadge';badge.textContent='x'+(prizeImages[i].size||document.getElementById('psz').value);slot.appendChild(badge);
      const shapeBadge=document.createElement('div');shapeBadge.style.cssText='position:absolute;top:2px;left:2px;background:rgba(255,215,0,0.9);color:#1a1a2e;font-size:8px;padding:1px 3px;border-radius:3px;font-weight:700';shapeBadge.textContent=prizeImages[i].shape==='box'?'箱':'球';slot.appendChild(shapeBadge);
      const clr=document.createElement('div');
      clr.className='clear';
      clr.textContent='\u00d7';
      clr.onclick=(e)=>{e.stopPropagation();prizeImages[i]=null;renderSlots();};
      slot.appendChild(clr);
    }else{
      const num=document.createElement('div');
      num.className='num';
      num.textContent=i+1;
      slot.appendChild(num);
    }
    slot.onclick=()=>{
      if(selectedImg){
        glowImages(false);
        const src=imgDataMap[selectedImg]||{};
        const defSz=Number(document.getElementById('psz').value);
        prizeImages[i]={imgId:selectedImg,name:src.name||'',desc:src.desc||'',size:defSz,shape:'sphere'};
        renderSlots();
        showSlotEditor(i);
      }else if(prizeImages[i]){
        showSlotEditor(i);
      }else{
        speakSelect();
        glowImages(true);
        setTimeout(()=>glowImages(false),2500);
      }
    };
    slot.ondragover=(e)=>{e.preventDefault();slot.style.borderColor='#FFD700';};
    slot.ondragleave=()=>{slot.style.borderColor='';};
    slot.ondrop=(e)=>{
      e.preventDefault();slot.style.borderColor='';
      const imgId=e.dataTransfer.getData('text/plain');
      if(imgId){
        const src=imgDataMap[imgId]||{};
        const defSz=Number(document.getElementById('psz').value);
        prizeImages[i]={imgId:imgId,name:src.name||'',desc:src.desc||'',size:defSz,shape:'sphere'};
        renderSlots();showSlotEditor(i);
      }
    };
    c.appendChild(slot);
  }
}

function showSlotEditor(i){
  const existing=document.getElementById('slotEditor');
  if(existing)existing.remove();
  const item=prizeImages[i];
  if(!item)return;
  const ed=document.createElement('div');
  ed.id='slotEditor';
  ed.style.cssText='margin-top:12px;padding:12px;background:#0f3460;border-radius:10px;';
  ed.innerHTML='<div style="font-size:13px;color:#FFD700;margin-bottom:8px">Slot '+(i+1)+' - '+item.imgId.slice(0,8)+'</div>'+
    '<input id="edName" type="text" placeholder="景品名" value="'+(item.name||'').replace(/"/g,'&quot;')+'" style="width:100%;padding:8px;border-radius:6px;border:1px solid #333;background:#1a1a2e;color:#fff;margin-bottom:6px;font-size:13px">'+
    '<input id="edDesc" type="text" placeholder="説明" value="'+(item.desc||'').replace(/"/g,'&quot;')+'" style="width:100%;padding:8px;border-radius:6px;border:1px solid #333;background:#1a1a2e;color:#fff;margin-bottom:8px;font-size:13px">'+
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><label style="font-size:12px;color:#aaa;white-space:nowrap">オリジナル景品の大きさ</label><input id="edSize" type="range" min="1" max="10" value="'+(item.size||document.getElementById('psz').value)+'" style="flex:1;background:#fff;height:8px;border-radius:4px;accent-color:#FFD700" oninput="this.nextElementSibling.textContent=this.value"><span style="color:#FFD700;font-size:13px;min-width:20px">'+(item.size||document.getElementById('psz').value)+'</span></div>'+
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><label style="font-size:12px;color:#aaa;white-space:nowrap">形状</label><select id="edShape" style="flex:1;padding:6px;border-radius:6px;border:1px solid #333;background:#fff;color:#333;font-size:13px"><option value="sphere" '+(item.shape!=='box'?'selected':'')+'>ガラス球（画像入り）</option><option value="box" '+(item.shape==='box'?'selected':'')+'>しかく箱（取りやすい）</option></select></div>'+
    '<div style="display:flex;gap:8px"><button onclick="saveSlot('+i+')" style="flex:1;padding:8px;border:none;border-radius:6px;background:#FFD700;color:#1a1a2e;font-weight:600;cursor:pointer;font-size:13px">確定</button><button onclick="cancelSlot()" style="flex:1;padding:8px;border:none;border-radius:6px;background:#333;color:#fff;font-weight:600;cursor:pointer;font-size:13px">キャンセル</button></div>';
  document.querySelector('.slots').parentNode.insertBefore(ed,document.querySelector('.buttons'));
  document.getElementById('edName').focus();
}
function saveSlot(i){
  const name=document.getElementById('edName').value;
  const desc=document.getElementById('edDesc').value;
  const sz=Number(document.getElementById('edSize').value);
  const shape=document.getElementById('edShape').value;
  if(prizeImages[i]){prizeImages[i].name=name;prizeImages[i].desc=desc;prizeImages[i].size=sz;prizeImages[i].shape=shape;}
  const ed=document.getElementById('slotEditor');if(ed)ed.remove();
  renderSlots();
  showMsg('スロット '+(i+1)+' を更新');
}
function cancelSlot(){const ed=document.getElementById('slotEditor');if(ed)ed.remove();}
function saveImgDetail(){
  if(!selectedImg){showMsg('画像が選択されていません');return;}
  const name=document.getElementById('imgName').value;
  const desc=document.getElementById('imgDesc').value;
  db.collection('images').doc(selectedImg).update({name:name,desc:desc}).then(()=>{
    showMsg('画像情報を保存しました');
    if(imgDataMap[selectedImg]){imgDataMap[selectedImg].name=name;imgDataMap[selectedImg].desc=desc;}
  }).catch(e=>showMsg('保存失敗: '+e.message));
}
function deleteImgDetail(){
  if(!selectedImg)return;
  if(!confirm('この画像を削除しますか？Firebaseから完全に削除されます'))return;
  db.collection('images').doc(selectedImg).delete().then(()=>{
    showMsg('削除しました');
    selectedImg=null;
    document.getElementById('imgDetail').style.display='none';
    loadImages();
  }).catch(e=>showMsg('削除失敗: '+e.message));
}

function saveSettings(){
  const data={};
  sliders.forEach(k=>data[k]=Number(document.getElementById(k).value));
  data.prizeImages=prizeImages;
  db.collection('settings').doc(DOC).set(data,{merge:true}).then(()=>showMsg('Saved!')).catch(e=>showMsg('Error: '+e.message));
}

function loadSettings(){
  db.collection('settings').doc(DOC).get().then(doc=>{
    if(!doc.exists){showMsg('No data found');return}
    const d=doc.data();
    sliders.forEach(k=>{if(d[k]!==undefined){document.getElementById(k).value=d[k];document.getElementById('v_'+k).textContent=d[k]}});
    if(d.grip!==undefined)gripLabel(d.grip);
    if(d.prizeImages&&d.prizeImages.length){
      prizeImages=d.prizeImages.map(item=>{
        if(typeof item==='string')return{imgId:item,name:'',desc:''};
        return item;
      });
      renderSlots();
    }else if(d.selectedImg){
      const n=Number(document.getElementById('prize').value);
      prizeImages=new Array(n).fill(null);
      if(n>0)prizeImages[0]={imgId:d.selectedImg,name:'',desc:''};
      renderSlots();
    }
    selectedImg=null;
    document.querySelectorAll('.thumb.selected').forEach(e=>e.classList.remove('selected'));
    showMsg('Loaded!');
  }).catch(e=>showMsg('Error: '+e.message));
}

loadImages();
const n0=Number(document.getElementById('prize').value);
prizeImages=new Array(n0).fill(null);
renderSlots();
</script>
</body>
</html>
