<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>シムカード はずしのおしごと</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      background: #f5f1e9;
      color: #252a34;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 38%, #fffdf8 0, #f5f1e9 70%);
    }

    .heading {
      position: relative;
      z-index: 2;
      padding: 18px 12px 0;
      text-align: center;
      transition: opacity 1.2s ease;
    }

    h1 {
      margin: 0;
      color: #25466c;
      font-size: clamp(1.8rem, 5vw, 3.5rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      text-shadow: 0 2px 0 #fff, 0 5px 16px #25466c30;
    }

    .subtitle {
      margin: 3px 0 0;
      color: #687487;
      font-size: clamp(1rem, 2.5vw, 1.45rem);
      font-weight: 700;
    }

    .scene {
      position: relative;
      z-index: 1;
      display: grid;
      width: min(94vw, 1100px);
      aspect-ratio: 4 / 3;
      max-height: 74vh;
      margin: 8px auto 0;
      place-items: center;
      transition: opacity 1.2s ease;
    }

    .scene img {
      grid-area: 1 / 1;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #cardOverlay {
      pointer-events: none;
    }

    .scene.moving #cardOverlay {
      animation: lift-and-return 5s ease-in-out infinite alternate;
      will-change: transform;
    }

    @keyframes lift-and-return {
      from { transform: translate(0, 0); }
      to { transform: translate(30%, -32%); }
    }

    .dimmed .heading,
    .dimmed .scene {
      opacity: 0.3;
    }

    .counter {
      position: fixed;
      z-index: 5;
      top: 36%;
      left: 50%;
      width: 100%;
      padding: 0.08em 0;
      background: rgba(255, 253, 248, 0.78);
      text-align: center;
      transform: translate(-50%, -50%);
      color: #25466c;
      font-size: clamp(3rem, 10vw, 7rem);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 0 #fff, 0 0 12px #fff, 0 4px 18px #25466c70;
    }

    .stacks {
      position: fixed;
      z-index: 3;
      left: 50%;
      bottom: 78px;
      display: grid;
      width: min(96vw, 1200px);
      height: min(54vh, 390px);
      pointer-events: none;
      transform: translateX(-50%);
    }

    .stacks canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .result {
      position: fixed;
      z-index: 6;
      top: 50%;
      left: 50%;
      width: max-content;
      max-width: 94vw;
      padding: 0.35em 0.6em;
      border-radius: 0.25em;
      background: #fff9;
      color: #e58b00;
      font-size: clamp(2.8rem, 10vw, 7rem);
      font-weight: 900;
      letter-spacing: 0.06em;
      text-align: center;
      text-shadow: 0 0 8px #fff, 0 0 18px #ffd45e, 0 0 34px #ffae00;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0.8);
    }

    .result.visible {
      animation: shine 1.2s ease-in-out infinite alternate;
    }

    @keyframes shine {
      from {
        opacity: 0.85;
        transform: translate(-50%, -50%) scale(0.98);
        filter: brightness(1);
      }
      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.06);
        filter: brightness(1.25);
      }
    }

    @media (max-height: 600px) {
      .heading { padding-top: 8px; }
      .scene { width: min(72vw, 760px); max-height: 55vh; margin-top: 2px; }
      .stacks { height: min(42vh, 260px); bottom: 68px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .result.visible {
        animation: none;
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
        filter: brightness(1.25);
      }
    }
  </style>
</head>
<body>
  <header class="heading">
    <h1>シムカード　はずしのおしごと</h1>
    <p class="subtitle">スマホにいれるカードだよ</p>
  </header>

  <main>
    <div class="scene" id="scene">
      <img src="02.png" alt="SIMカードをはずす台紙">
      <img id="cardOverlay" src="01.png" alt="はずすSIMカード">
    </div>
    <div class="stacks" id="stacks" aria-hidden="true">
      <canvas id="stackCanvas"></canvas>
    </div>
  </main>

  <span class="counter" id="counter" aria-live="polite"></span>
  <div class="result" id="result" role="status">1060枚できました</div>

  <script>
    const scene = document.getElementById("scene");
    const stacks = document.getElementById("stacks");
    const canvas = document.getElementById("stackCanvas");
    const context = canvas.getContext("2d");
    const counter = document.getElementById("counter");
    const result = document.getElementById("result");
    const groups = [200, 200, 200, 200, 200, 60];
    const pileCounts = Array(6).fill(0);
    const fallingCards = [];
    let phase = "ready";
    let groupIndex = 0;
    let dropped = 0;
    let audioContext;
    let frameRequest = 0;
    let canvasWidth = 0;
    let canvasHeight = 0;
    let deviceScale = 1;

    function playDropSound(final = false) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      audioContext ??= new AudioContextClass();
      if (audioContext.state === "suspended") audioContext.resume();
      const now = audioContext.currentTime;
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      oscillator.type = "sine";
      oscillator.frequency.setValueAtTime(final ? 660 : 420, now);
      oscillator.frequency.exponentialRampToValueAtTime(final ? 990 : 300, now + 0.07);
      gain.gain.setValueAtTime(final ? 0.12 : 0.035, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + (final ? 0.35 : 0.07));
      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start(now);
      oscillator.stop(now + (final ? 0.36 : 0.08));
    }

    function resizeCanvas() {
      const bounds = stacks.getBoundingClientRect();
      deviceScale = window.devicePixelRatio || 1;
      canvasWidth = bounds.width;
      canvasHeight = bounds.height;
      canvas.width = Math.round(canvasWidth * deviceScale);
      canvas.height = Math.round(canvasHeight * deviceScale);
      context.setTransform(deviceScale, 0, 0, deviceScale, 0, 0);
      drawStacks(performance.now());
    }

    function drawCard(centerX, bottomY, cardWidth) {
      const halfWidth = cardWidth / 2;
      const cardHeight = cardWidth * 9 / 16;
      const perspective = cardHeight * 0.22;
      const thickness = Math.max(5, cardHeight * 0.09);
      context.beginPath();
      context.moveTo(centerX - halfWidth, bottomY);
      context.lineTo(centerX + halfWidth, bottomY);
      context.lineTo(centerX + halfWidth - perspective, bottomY - cardHeight);
      context.lineTo(centerX - halfWidth - perspective, bottomY - cardHeight);
      context.closePath();
      context.fillStyle = "#fff";
      context.fill();
      context.strokeStyle = "rgba(55, 75, 102, 0.8)";
      context.lineWidth = 1;
      context.stroke();
      context.beginPath();
      context.moveTo(centerX - halfWidth, bottomY);
      context.lineTo(centerX - halfWidth, bottomY + thickness);
      context.lineTo(centerX + halfWidth, bottomY + thickness);
      context.lineTo(centerX + halfWidth, bottomY);
      context.closePath();
      context.fillStyle = "#cbd5e2";
      context.fill();
      context.strokeStyle = "rgba(55, 75, 102, 0.78)";
      context.stroke();
      context.beginPath();
      context.moveTo(centerX + halfWidth, bottomY);
      context.lineTo(centerX + halfWidth, bottomY + thickness);
      context.lineTo(centerX + halfWidth - perspective, bottomY - cardHeight + thickness);
      context.lineTo(centerX + halfWidth - perspective, bottomY - cardHeight);
      context.closePath();
      context.fillStyle = "#aebbcf";
      context.fill();
      context.strokeStyle = "rgba(55, 75, 102, 0.82)";
      context.stroke();
    }

    function drawStacks(now = 0) {
      if (!canvasWidth || !canvasHeight) return;
      context.clearRect(0, 0, canvasWidth, canvasHeight);
      const columnWidth = canvasWidth / 6;
      const cardWidth = Math.max(40, Math.min(110, window.innerWidth * 0.085));
      const cardHeight = cardWidth * 9 / 16;
      const cardThickness = Math.max(5, cardHeight * 0.09);
      const baseline = canvasHeight - cardThickness - 3;
      const stackStep = Math.min(2.4, Math.max(0.5, (canvasHeight - cardHeight - cardThickness - 8) / 200));

      for (let index = 0; index < 6; index += 1) {
        const centerX = columnWidth * (index + 0.5);
        context.beginPath();
        context.moveTo(columnWidth * index + 8, baseline);
        context.lineTo(columnWidth * (index + 1) - 8, baseline);
        context.strokeStyle = "#8291a3";
        context.lineWidth = 2;
        context.stroke();

        for (let cardIndex = 0; cardIndex < pileCounts[index]; cardIndex += 1) {
          drawCard(centerX, baseline - cardIndex * stackStep, cardWidth);
        }
      }

      for (const card of fallingCards) {
        const progress = Math.min(1, (now - card.startedAt) / card.duration);
        const eased = 1 - Math.pow(1 - progress, 2);
        const targetY = baseline - pileCounts[card.pileIndex] * stackStep;
        const y = -12 + (targetY + 12) * eased;
        drawCard(columnWidth * (card.pileIndex + 0.5), y, cardWidth);
      }
    }

    function animateDrops(now) {
      for (let index = fallingCards.length - 1; index >= 0; index -= 1) {
        const card = fallingCards[index];
        if (now - card.startedAt < card.duration) continue;
        fallingCards.splice(index, 1);
        pileCounts[card.pileIndex] += 1;
        dropped += 1;
        if (dropped % 5 === 0 || dropped === 1060) {
          counter.textContent = `${dropped} まい`;
        }
        if (dropped % 10 === 0) playDropSound();
        if (card.groupComplete) finishGroup();
      }

      drawStacks(now);
      if (fallingCards.length) {
        frameRequest = window.requestAnimationFrame(animateDrops);
      } else {
        frameRequest = 0;
      }
    }

    function finishGroup() {
      groupIndex += 1;
      if (groupIndex === groups.length) {
        phase = "finish";
        counter.textContent = "";
        playDropSound(true);
      } else {
        phase = "waiting";
        playDropSound(true);
      }
    }

    function requestDraw() {
      if (!frameRequest) frameRequest = window.requestAnimationFrame(animateDrops);
    }

    function startGroup() {
      if (groupIndex >= groups.length) return;
      phase = "dropping";
      const amount = groups[groupIndex];
      let created = 0;
      const timer = window.setInterval(() => {
        fallingCards.push({
          pileIndex: groupIndex,
          startedAt: performance.now(),
          duration: 700,
          groupComplete: created === amount - 1
        });
        created += 1;
        if (created === amount) window.clearInterval(timer);
        requestDraw();
      }, 28);
    }

    function handleEnter(event) {
      if (event.key !== "Enter" || event.repeat) return;
      event.preventDefault();
      if (phase === "ready") {
        phase = "moving";
        scene.classList.add("moving");
      } else if (phase === "moving") {
        phase = "waiting";
        scene.classList.remove("moving");
        document.body.classList.add("dimmed");
        startGroup();
      } else if (phase === "waiting") {
        startGroup();
      } else if (phase === "finish") {
        phase = "done";
        result.classList.add("visible");
        playDropSound(true);
      }
    }

    new ResizeObserver(resizeCanvas).observe(stacks);
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
    window.addEventListener("keydown", handleEnter);
  </script>
</body>
</html>
