<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>この紙のチェックリストを埋めて提出します。</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1226;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;}
body{overscroll-behavior:none;touch-action:manipulation;}

#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;}
#imgWrap{position:relative;line-height:0;}
#imgWrap img{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;touch-action:manipulation;}

/* 記録した囲み（ふだんは薄い赤で点滅） */
.hl{position:absolute;display:none;pointer-events:none;z-index:10;
  border:4px solid rgba(255,105,105,.9);border-radius:12px;background:rgba(255,60,60,.22);
  animation:blink .9s ease-in-out infinite;}
/* 編集モード中は点滅なしの点線 */
body.edit .hl{border:3px dashed #ff2222;background:rgba(255,0,0,.10);animation:none;}
/* ドラッグ中のプレビュー */
#drawBox{position:absolute;display:none;pointer-events:none;z-index:12;
  border:3px dashed #ff2222;background:rgba(255,0,0,.15);border-radius:10px;}
@keyframes blink{0%,100%{opacity:.15;}50%{opacity:.75;}}

/* 上のカウンター */
#counter{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:50;
  background:rgba(0,0,0,.78);color:#fff;padding:8px 20px;border-radius:40px;
  font-size:min(3.2vh,19px);font-weight:bold;white-space:nowrap;
  border:2px solid rgba(255,255,255,.28);display:none;}

/* 囲み編集ボタン（右上） */
#editBtn{display:none;position:fixed;top:14px;right:16px;z-index:70;cursor:pointer;
  background:#ffd500;color:#1a1a1a;border:none;border-radius:999px;padding:10px 18px;
  font-size:min(3vh,18px);font-weight:bold;font-family:inherit;
  box-shadow:0 6px 18px rgba(0,0,0,.35);}
#editBtn:hover{background:#ffe45c;}

/* 下の説明文 */
#caption{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:50;
  background:rgba(255,255,255,.94);color:#b00000;padding:10px 20px;border-radius:24px;
  font-size:min(3.2vh,19px);font-weight:bold;box-shadow:0 2px 10px rgba(0,0,0,.4);
  display:none;max-width:92vw;max-height:34vh;overflow-y:auto;text-align:center;line-height:1.55;}
#caption .num{display:inline-block;background:#b00000;color:#fff;border-radius:99px;
  min-width:1.7em;padding:.12em .5em;margin-right:.5em;font-size:.95em;}

/* 下の操作バー（ふだん） */
#bar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:50;
  background:rgba(0,0,0,.78);color:#fff;padding:8px 20px;border-radius:40px;
  font-size:min(2.9vh,17px);font-weight:bold;text-align:center;white-space:nowrap;
  border:2px solid rgba(255,255,255,.28);display:none;align-items:center;gap:12px;}
#bar .hint{color:#ffd500;font-size:.9em;}
.navBtn{pointer-events:auto;background:#ffd500;color:#1a1a1a;border:none;border-radius:30px;
  padding:7px 16px;font-weight:bold;font-size:inherit;cursor:pointer;font-family:inherit;}
.navBtn:hover{background:#ffe45c;}
#prevBtn{background:rgba(255,255,255,.85);}

/* 下の操作バー（編集中） */
#editBar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:50;
  background:rgba(120,0,0,.85);color:#fff;padding:8px 20px;border-radius:40px;
  font-size:min(2.9vh,17px);font-weight:bold;text-align:center;white-space:nowrap;
  border:2px solid rgba(255,120,120,.6);display:none;align-items:center;gap:10px;}
#editBar .hint{color:#ffb3b3;font-size:.9em;}
#editExitBtn,#editClearBtn,#editDataBtn{background:rgba(255,255,255,.85);}
#editBakeBtn{background:#ffd500;box-shadow:0 0 14px rgba(255,213,0,.8);}

/* タイトル画面 */
#title{position:fixed;inset:0;z-index:80;background:linear-gradient(160deg,#1b2a4a 0%,#0d1226 100%);
  display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;
  text-align:center;cursor:pointer;padding:0 6vw;}
#title h1{font-size:min(6.5vh,44px);letter-spacing:.1em;margin-bottom:2vh;line-height:1.5;
  text-shadow:0 0 18px rgba(255,213,0,.45);}
#title .sub{font-size:min(3.6vh,22px);margin-bottom:3vh;color:#ccd;line-height:1.8;}
#title .ops{font-size:min(3vh,18px);color:#9ab;margin-bottom:5vh;line-height:2;
  background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.2);
  border-radius:16px;padding:14px 26px;}
#title .ops b{color:#ffd500;}
#pdfBtn{margin-bottom:2vh;background:#ffd500;color:#1a1a1a;border:0;border-radius:999px;
  padding:12px 24px;font:inherit;font-size:min(3.4vh,20px);font-weight:bold;cursor:pointer;
  box-shadow:0 6px 18px rgba(0,0,0,.35);}
#pdfBtn:hover{background:#ffe45c;}
#pdfBtn:disabled{opacity:.65;cursor:wait;}
#pdfStatus{min-height:1.5em;margin-bottom:1vh;color:#ccd;font-size:min(2.6vh,15px);}
#title .go{font-size:min(4.2vh,25px);color:#ffd500;animation:blink 1.1s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:.35;}50%{opacity:1;}}

/* 枠データのコピーパネル */
#dataOverlay{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.72);display:none;
  align-items:center;justify-content:center;padding:4vh 4vw;}
#dataPanel{background:linear-gradient(160deg,#1b2a4a 0%,#0d1226 100%);color:#fff;
  border:2px solid rgba(255,255,255,.3);border-radius:20px;padding:24px;
  width:min(720px,94vw);display:flex;flex-direction:column;gap:12px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);}
#dataPanel h2{font-size:min(3.6vh,21px);color:#ffd500;text-align:center;}
#dataPanel p{font-size:min(2.8vh,14px);color:#ccd;text-align:center;}
#dataArea{width:100%;height:26vh;background:#fff;color:#222;border:none;border-radius:10px;
  font-family:Consolas,monospace;font-size:13px;padding:10px;resize:none;}
#dataBtns{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;}
#dataBtns button{border:none;border-radius:30px;padding:10px 22px;font-weight:bold;
  font-size:min(3vh,16px);cursor:pointer;font-family:inherit;}
#copyBtn{background:#ffd500;color:#1a1a1a;}
#importBtn{background:rgba(255,255,255,.85);color:#1a1a1a;}
#dataCloseBtn{background:rgba(255,255,255,.15);color:#fff;border:2px solid rgba(255,255,255,.35)!important;}

/* 読み込み画面 */
#load{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#1b2a4a 0%,#0d1226 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 8vw;color:#fff;}
#load .lt{font-size:min(6vh,36px);letter-spacing:.1em;margin-bottom:4vh;text-align:center;}
#barWrap{width:80%;max-width:600px;height:min(3vh,20px);background:rgba(255,255,255,.18);
  border-radius:30px;overflow:hidden;border:2px solid rgba(255,255,255,.3);}
#barFill{height:100%;width:0%;background:linear-gradient(90deg,#ffd500,#ff8a00);transition:width .2s ease;}
#pct{font-size:min(8vh,52px);font-weight:bold;margin-top:3vh;color:#ffd500;}
#lmsg{font-size:min(3.6vh,18px);color:#ccd;margin-top:2vh;text-align:center;}
</style>

<body>

<div id="stage">
  <div id="imgWrap">
    <img id="img" alt="手順の画像" draggable="false">
    <div id="drawBox"></div>
  </div>
</div>

<div id="counter"></div>
<button id="editBtn" type="button">囲み編集（事前準備）</button>
<div id="caption"></div>
<div id="bar">
  <button class="navBtn" id="prevBtn" type="button">◀ もどる</button>
  <span class="hint">左クリック・タップで すすむ／バックスペースで もどる</span>
  <button class="navBtn" id="nextBtn" type="button">つぎへ ▶</button>
</div>
<div id="editBar">
  <span class="hint">ドラッグで囲む／囲みをクリックで削除（じどう保存）</span>
  <button class="navBtn" id="editDataBtn" type="button">枠データ</button>
  <button class="navBtn" id="editClearBtn" type="button">全消去</button>
  <button class="navBtn" id="editExitBtn" type="button">編集おわり</button>
  <button class="navBtn" id="editBakeBtn" type="button">HTMLに書き込んで固定 ▶</button>
</div>

<div id="title">
  <h1>この紙のチェックリストを埋めて提出します。</h1>
  <div class="sub">Googleアカウントのセキュリティ確認 14ステップ<br>大事な場所は あかい点滅で 囲んであります</div>
  <div class="ops">
    <b>左クリック / タップ</b> … つぎへ<br>
    <b>バックスペース</b> … もどる<br>
  </div>
  <button id="pdfBtn" type="button">PDFをダウンロード</button>
  <div id="pdfStatus" aria-live="polite"></div>
  <div class="go">▼ クリック・タップで はじめる ▼</div>
</div>

<div id="dataOverlay">
  <div id="dataPanel">
    <h2>囲みデータのコピー／読み込み</h2>
    <p>このテキストをコピーして別のパソコンの「読み込み」に貼ると、囲みをうつせます</p>
    <textarea id="dataArea" spellcheck="false"></textarea>
    <div id="dataBtns">
      <button id="copyBtn" type="button">コピー</button>
      <button id="importBtn" type="button">読み込み</button>
      <button id="dataCloseBtn" type="button">とじる</button>
    </div>
  </div>
</div>

<div id="load">
  <div class="lt">この紙のチェックリストを埋めて提出します。</div>
  <div id="barWrap"><div id="barFill"></div></div>
  <div id="pct">0%</div>
  <div id="lmsg">画像をよみこみ中…</div>
</div>

<script>
(function(){
  /* 固定（書き込み）用に、まだ何も変更していない最初のソースを記憶しておく */
  var SOURCE='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  function $(id){return document.getElementById(id);}
  var img=$('img'),wrap=$('imgWrap'),stage=$('stage'),
      title=$('title'),counter=$('counter'),caption=$('caption'),bar=$('bar'),
      editBtn=$('editBtn'),editBar=$('editBar'),drawBox=$('drawBox'),
      dataOverlay=$('dataOverlay'),dataArea=$('dataArea');
  var pdfBtn=$('pdfBtn'),pdfStatus=$('pdfStatus'),pdfBusy=false;

  var PAGES=[
    {img:'0.jpg', cover:true, text:'この紙のチェックリストを埋めて提出します。これから14の手順で確認していきます。'},
    {img:'1.jpg', text:'まずグーグルにログインしましょう。アカウントが分からない時は、飯田までチャットください'},
    {img:'2.jpg', text:'パスワードが分からない時は、飯田までチャットください'},
    {img:'3.jpg', text:'アカウントをクリック'},
    {img:'4.jpg', text:'セキュリティとログイン　を　クリック'},
    {img:'5.jpg', text:'セキュリティ関連のアクティビティの確認をクリック。履歴やこのアカウントでやったことですね。身に覚えのないことや不審なことがあったら管理職へ報告しましょう'},
    {img:'6.jpg', text:'細かくでます。特になにもなければOK'},
    {img:'7.jpg', text:'下にスクロールしましょう。ログインデバイスの確認、自分がログインした場所が表示されます。他国からアクセスされたりしていたら管理職に報告しましょう。'},
    {img:'8.jpg', text:'パスワードの変更をクリック'},
    {img:'9.jpg', text:'パスワードの変更及び強化です。新しいものを設定します。大文字や小文字のローマ字、数字、記号など12桁でお願いします。'},
    {img:'10.jpg', text:'またセキュリティとログインに戻ります。'},
    {img:'11.jpg', text:'リンク済みアプリを見てください。３つのうち、試しにひとつ消しましょう。'},
    {img:'12.jpg', text:'アプリ名をクリックすると、そのアプリの詳細が開きます。いらないものは削除を押すと消えます'},
    {img:'13.jpg', text:'３つあったものが２つになりました、消えました。いらないものや仕事に関係ないものがあったら消しましょう。'},
    {img:'14.jpg', text:'ドライブも整理をお願いします。個人情報は入れないでください、仕事に関係ないものもいれないでください。これでリストのチェックが埋まると思います。googleサイト非公開化とは、グーグル版の簡易アプリを作成するところです。やったことないなら問題ないです。以上です。'}
  ];

  /* ===== 囲み（枠）座標の保存 =====
     ふだんはlocalStorageに自動保存。「HTMLに書き込んで固定」を押すと
     このファイル自体の window.BAKED_BOXES に焼き込まれる（別のパソコンでも表示される） */
  var BOX_KEY='20261126ictgoogle_boxes_v2';       /* 表紙を足したのでページ番号が+1 */
  var BOX_KEY_OLD='20261126ictgoogle_boxes_v1';
  function sanitize(b){
    var clean={};
    for(var k in b){
      if(!Array.isArray(b[k]))continue;
      var n=parseInt(k,10);
      if(isNaN(n)||n<0||n>=PAGES.length)continue;
      clean[n]=b[k].filter(function(c){
        return c&&typeof c.x==='number'&&typeof c.y==='number'&&typeof c.w==='number'&&typeof c.h==='number';
      }).map(function(c){
        return {x:Math.max(0,Math.min(100,c.x)),y:Math.max(0,Math.min(100,c.y)),
                w:Math.max(0,Math.min(100,c.w)),h:Math.max(0,Math.min(100,c.h))};
      });
    }
    return clean;
  }
  function loadBoxes(){
    try{
      var t=localStorage.getItem(BOX_KEY);
      if(t){var b=JSON.parse(t);if(b&&typeof b==='object')return sanitize(b);}
    }catch(e){}
    /* 表紙を足す前(v1)に記録した囲みは、ページ番号を+1して引きつぐ */
    try{
      var o=localStorage.getItem(BOX_KEY_OLD);
      if(o){
        var ob=JSON.parse(o);
        if(ob&&typeof ob==='object'){
          var mapped={};
          for(var k in ob){
            if(Array.isArray(ob[k]))mapped[String(parseInt(k,10)+1)]=ob[k];
          }
          var s=sanitize(mapped);
          try{localStorage.setItem(BOX_KEY,JSON.stringify(s));localStorage.removeItem(BOX_KEY_OLD);}catch(e2){}
          return s;
        }
      }
    }catch(e){}
    if(window.BAKED_BOXES)return sanitize(window.BAKED_BOXES); /* ファイルに固定された囲み */
    return {};
  }
  var boxes=loadBoxes();
  function boxesFor(i){if(!Array.isArray(boxes[i]))boxes[i]=[];return boxes[i];}
  function saveBoxes(){try{localStorage.setItem(BOX_KEY,JSON.stringify(boxes));}catch(e){}}

  var cur=-1; /* -1 = タイトル */
  var editMode=false,editUnlocked=false,unlockInput='',dragging=false,startPt=null;

  function updateEditButton(){
    editBtn.style.display=editUnlocked&&!editMode&&cur>=0?'block':'none';
  }

  /* 画像を画面に合わせる */
  function fit(){
    if(!img.naturalWidth)return;
    var ar=img.naturalWidth/img.naturalHeight;
    var sw=stage.clientWidth,sh=stage.clientHeight;
    if(sw/sh>ar){wrap.style.width=(sh*ar)+'px';wrap.style.height=sh+'px';}
    else{wrap.style.width=sw+'px';wrap.style.height=(sw/ar)+'px';}
  }

  /* 囲みを表示（編集中は点線、ふだんは薄い赤の点滅） */
  function renderBoxes(){
    wrap.querySelectorAll('.hl').forEach(function(el){el.remove();});
    if(cur<0)return;
    boxesFor(cur).forEach(function(c){
      var el=document.createElement('div');
      el.className='hl';
      el.style.left=c.x+'%';el.style.top=c.y+'%';
      el.style.width=c.w+'%';el.style.height=c.h+'%';
      el.style.display='block';
      wrap.appendChild(el);
    });
  }

  function showPage(i){
    cur=i;
    var p=PAGES[i];
    title.style.display='none';
    counter.style.display='block';
    /* 表紙はステップ番号なし、1枚目から14枚目までを数える */
    counter.textContent=p.cover?'表紙':'ステップ '+i+' / '+(PAGES.length-1);
    caption.style.display='block';
    updateEditButton();
    bar.style.display=editMode?'none':'flex';
    editBar.style.display=editMode?'flex':'none';
    caption.innerHTML='<span class="num">'+(p.cover?'表紙':i)+'</span>'+p.text;
    caption.scrollTop=0;
    img.onload=function(){fit();};
    img.src=p.img;
    renderBoxes();
  }

  function toTitle(){
    cur=-1;
    counter.style.display='none';bar.style.display='none';
    caption.style.display='none';updateEditButton();
    editBar.style.display='none';
    img.removeAttribute('src');
    renderBoxes();
    title.style.display='flex';
  }

  function advance(){
    if(editMode)return;
    if(cur<0){showPage(0);return;}
    cur++;
    if(cur>=PAGES.length){toTitle();return;}
    showPage(cur);
  }
  function back(){
    if(editMode)return;
    if(cur<=0){toTitle();return;}
    showPage(cur-1);
  }

  /* ===== 編集モード ===== */
  function setEdit(on){
    editMode=on;
    dragging=false;
    drawBox.style.display='none';
    document.body.classList.toggle('edit',on);
    updateEditButton();
    bar.style.display=on?'none':'flex';
    editBar.style.display=on?'flex':'none';
  }
  function ptToPct(e){
    var r=wrap.getBoundingClientRect();
    var x=(e.clientX-r.left)/r.width*100;
    var y=(e.clientY-r.top)/r.height*100;
    x=Math.max(0,Math.min(100,x));
    y=Math.max(0,Math.min(100,y));
    return {x:x,y:y};
  }
  stage.addEventListener('pointerdown',function(e){
    if(!editMode||cur<0)return;
    e.preventDefault();
    dragging=true;
    startPt=ptToPct(e);
    try{stage.setPointerCapture(e.pointerId);}catch(err){}
  });
  stage.addEventListener('pointermove',function(e){
    if(!editMode||!dragging)return;
    var p=ptToPct(e);
    drawBox.style.display='block';
    drawBox.style.left=Math.min(startPt.x,p.x)+'%';
    drawBox.style.top=Math.min(startPt.y,p.y)+'%';
    drawBox.style.width=Math.abs(p.x-startPt.x)+'%';
    drawBox.style.height=Math.abs(p.y-startPt.y)+'%';
  });
  stage.addEventListener('pointerup',function(e){
    if(!editMode||!dragging)return;
    dragging=false;
    drawBox.style.display='none';
    var p=ptToPct(e);
    var w=Math.abs(p.x-startPt.x),h=Math.abs(p.y-startPt.y);
    if(w>1.5&&h>1.5){ /* ドラッグ → 囲みを追加 */
      boxesFor(cur).push({x:Math.min(startPt.x,p.x),y:Math.min(startPt.y,p.y),w:w,h:h});
      saveBoxes();renderBoxes();
    }else{ /* クリック → その場所の囲みを削除 */
      var arr=boxesFor(cur);
      for(var i=arr.length-1;i>=0;i--){
        var b=arr[i];
        if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){
          arr.splice(i,1);saveBoxes();renderBoxes();break;
        }
      }
    }
  });

  /* ===== 枠データのコピー／読み込み ===== */
  function openData(){
    dataArea.value=JSON.stringify(boxes);
    dataOverlay.style.display='flex';
  }
  function closeData(){dataOverlay.style.display='none';}

  /* ===== HTMLに書き込んで固定 ===== */
  function buildHtml(){
    /* タグ文字列を分割して書くのは、このスクリプト自身と誤マッチしないため */
    var tag='<scr'+'ipt id="bakedBoxes">window.BAKED_BOXES='+JSON.stringify(boxes)+';</scr'+'ipt>';
    var re=new RegExp('<scr'+'ipt id="bakedBoxes">[\\s\\S]*?</scr'+'ipt>');
    var src=SOURCE;
    if(re.test(src))src=src.replace(re,tag);
    else src=src.replace(/<\/head>/i,tag+'\n<\/head>');
    return src;
  }
  async function bakeAndSave(){
    var html=buildHtml();
    if(window.showSaveFilePicker){
      try{
        var handle=await window.showSaveFilePicker({
          suggestedName:'index.html',
          types:[{description:'HTMLファイル',accept:{'text/html':['.html']}}]
        });
        var w=await handle.createWritable();
        await w.write(html);
        await w.close();
        alert('index.html に囲みを書き込みました。\n囲みがこのファイルに固定されました。');
        setEdit(false);
        return;
      }catch(err){
        if(err&&err.name==='AbortError')return; /* 保存先選択をキャンセル */
      }
    }
    /* 保存ダイアログが使えない環境のときはダウンロードで出す */
    var blob=new Blob([html],{type:'text/html'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='index.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
    alert('ダウンロードフォルダに index.html を保存しました。\n元の index.html と入れかえてください。');
    setEdit(false);
  }

  /* ===== 赤枠を含む全ページPDFの保存 ===== */
  function loadPdfImage(src){
    return new Promise(function(resolve,reject){
      var image=new Image();
      image.onload=function(){resolve(image);};
      image.onerror=function(){reject(new Error(src+' を読み込めませんでした'));};
      image.src=src;
    });
  }
  function pageToJpeg(image,index){
    var canvas=document.createElement('canvas');
    canvas.width=image.naturalWidth;
    canvas.height=image.naturalHeight;
    var imageHeight=canvas.height;
    var page=PAGES[index],fontSize=Math.max(16,Math.round(canvas.width*.022));
    var padding=Math.round(fontSize*.8),lineHeight=Math.round(fontSize*1.5);
    var textWidth=canvas.width-padding*2;
    var ctx=canvas.getContext('2d');
    if(!ctx)throw new Error('画像のPDF変換を開始できませんでした');
    ctx.font='bold '+fontSize+'px "Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif';
    var lines=[],line='';
    Array.from(page.text).forEach(function(char){
      var candidate=line+char;
      if(line&&ctx.measureText(candidate).width>textWidth){
        lines.push(line);line=char;
      }else line=candidate;
    });
    if(line)lines.push(line);
    var label=page.cover?'表紙':'ステップ '+index;
    var labelHeight=Math.round(fontSize*1.6);
    var captionHeight=padding*2+labelHeight+lines.length*lineHeight;
    canvas.height=imageHeight+captionHeight;
    ctx=canvas.getContext('2d');
    ctx.drawImage(image,0,0);
    ctx.lineWidth=Math.max(6,Math.min(canvas.width,imageHeight)*.004);
    ctx.strokeStyle='#ff0000';
    ctx.fillStyle='rgba(255,0,0,.18)';
    (boxes[index]||[]).forEach(function(box){
      var x=box.x/100*canvas.width,y=box.y/100*imageHeight;
      var w=box.w/100*canvas.width,h=box.h/100*imageHeight;
      ctx.fillRect(x,y,w,h);
      ctx.strokeRect(x,y,w,h);
    });
    ctx.fillStyle='#fff';
    ctx.fillRect(0,imageHeight,canvas.width,captionHeight);
    ctx.fillStyle='#b00000';
    ctx.font='bold '+fontSize+'px "Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif';
    ctx.textBaseline='top';
    ctx.fillText(label,padding,imageHeight+padding);
    lines.forEach(function(text,lineIndex){
      ctx.fillText(text,padding,imageHeight+padding+labelHeight+lineIndex*lineHeight);
    });
    return new Promise(function(resolve,reject){
      canvas.toBlob(function(blob){
        if(!blob){reject(new Error('画像をPDF用に変換できませんでした'));return;}
        blob.arrayBuffer().then(function(buffer){
          resolve({w:canvas.width,h:canvas.height,bytes:new Uint8Array(buffer)});
        },reject);
      },'image/jpeg',.92);
    }).then(function(jpeg){
      canvas.width=0;canvas.height=0;
      return jpeg;
    });
  }
  function buildChecklistPDF(jpegs){
    var pageW=841.89,pageH=595.28,enc=new TextEncoder(),chunks=[],length=0;
    var pushStr=function(s){var b=enc.encode(s);chunks.push(b);length+=b.length;};
    var pushBytes=function(b){chunks.push(b);length+=b.length;};
    var n=jpegs.length,objCount=3*n+3,offsets=new Array(objCount).fill(0);
    var startObj=function(num){offsets[num]=length;pushStr(num+' 0 obj\n');};
    var endObj=function(){pushStr('endobj\n');};
    var num=function(v){return String(Math.round(v*100)/100);};

    pushStr('%PDF-1.4\n');
    pushBytes(new Uint8Array([0x25,0xE2,0xE3,0xCF,0xD3,0x0A]));
    startObj(1);pushStr('<< /Type /Catalog /Pages 2 0 R >>\n');endObj();
    var kids=[];
    for(var i=0;i<n;i++)kids.push((3+2*i)+' 0 R');
    startObj(2);pushStr('<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+n+' >>\n');endObj();

    for(var p=0;p<n;p++){
      var pageNum=3+2*p,contNum=pageNum+1,imgNum=3+2*n+p,jpeg=jpegs[p];
      startObj(pageNum);
      pushStr('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+num(pageW)+' '+num(pageH)+
        '] /Resources << /XObject << /Im0 '+imgNum+' 0 R >> /ProcSet [/PDF /ImageC] >> /Contents '+contNum+' 0 R >>\n');
      endObj();
      var scale=Math.min((pageW-48)/jpeg.w,(pageH-48)/jpeg.h);
      var drawW=jpeg.w*scale,drawH=jpeg.h*scale;
      var content='q\n'+num(drawW)+' 0 0 '+num(drawH)+' '+num((pageW-drawW)/2)+' '+num((pageH-drawH)/2)+' cm\n/Im0 Do\nQ\n';
      startObj(contNum);
      pushStr('<< /Length '+content.length+' >>\nstream\n'+content+'endstream\n');
      endObj();
    }
    for(var k=0;k<n;k++){
      var j=jpegs[k],inum=3+2*n+k;
      startObj(inum);
      pushStr('<< /Type /XObject /Subtype /Image /Width '+j.w+' /Height '+j.h+
        ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+j.bytes.length+' >>\nstream\n');
      pushBytes(j.bytes);pushStr('\nendstream\n');endObj();
    }
    var xrefOffset=length;
    pushStr('xref\n0 '+objCount+'\n0000000000 65535 f \n');
    for(var x=1;x<objCount;x++)pushStr(String(offsets[x]).padStart(10,'0')+' 00000 n \n');
    pushStr('trailer\n<< /Size '+objCount+' /Root 1 0 R >>\nstartxref\n'+xrefOffset+'\n%%EOF\n');
    return new Blob(chunks,{type:'application/pdf'});
  }
  async function downloadChecklistPDF(){
    if(pdfBusy)return;
    pdfBusy=true;pdfBtn.disabled=true;
    var jpegs=[];
    try{
      for(var i=0;i<PAGES.length;i++){
        pdfStatus.textContent='PDFを作成しています… '+(i+1)+' / '+PAGES.length;
        await new Promise(function(resolve){setTimeout(resolve,0);});
        var image=await loadPdfImage(PAGES[i].img);
        jpegs.push(await pageToJpeg(image,i));
      }
      var blob=buildChecklistPDF(jpegs);
      var url=URL.createObjectURL(blob),link=document.createElement('a');
      link.href=url;link.download='Googleアカウントのセキュリティ確認.pdf';
      document.body.appendChild(link);link.click();link.remove();
      setTimeout(function(){URL.revokeObjectURL(url);},10000);
      pdfStatus.textContent='PDFをダウンロードしました';
    }catch(err){
      console.error(err);
      pdfStatus.textContent='PDFを作成できませんでした';
      alert('PDFを作成できませんでした。画像の読み込みを確認して、もう一度お試しください。');
    }finally{
      pdfBusy=false;pdfBtn.disabled=false;
    }
  }

  /* ===== 操作 ===== */
  document.addEventListener('click',function(e){
    if(e.target===pdfBtn||pdfBtn.contains(e.target))return;
    advance();
  });
  document.addEventListener('keydown',function(e){
    if(editMode){
      if(e.key==='Escape'&&!dragging)setEdit(false);
      return;
    }
    if(!editUnlocked&&e.key.length===1&&/^[a-z]$/i.test(e.key)){
      unlockInput=(unlockInput+e.key.toLowerCase()).slice(-6);
      if(unlockInput==='kakomi'){
        editUnlocked=true;
        updateEditButton();
      }
    }else if(e.key.length===1){
      unlockInput='';
    }
    if(e.key==='Backspace'){e.preventDefault();back();}
    else if(e.key==='Enter'||e.key===' '||e.key==='ArrowRight'){e.preventDefault();advance();}
    else if(e.key==='ArrowLeft'){back();}
  });
  $('nextBtn').addEventListener('click',function(e){e.stopPropagation();advance();});
  $('prevBtn').addEventListener('click',function(e){e.stopPropagation();back();});
  pdfBtn.addEventListener('click',function(e){
    e.preventDefault();e.stopPropagation();downloadChecklistPDF();
  });
  editBtn.addEventListener('click',function(e){e.stopPropagation();setEdit(true);});
  $('editExitBtn').addEventListener('click',function(e){e.stopPropagation();setEdit(false);});
  $('editBakeBtn').addEventListener('click',function(e){e.stopPropagation();bakeAndSave();});
  $('editClearBtn').addEventListener('click',function(e){
    e.stopPropagation();
    boxes[cur]=[];saveBoxes();renderBoxes();
  });
  $('editDataBtn').addEventListener('click',function(e){e.stopPropagation();openData();});
  dataOverlay.addEventListener('click',function(e){e.stopPropagation();});
  $('dataCloseBtn').addEventListener('click',function(e){e.stopPropagation();closeData();});
  $('copyBtn').addEventListener('click',function(e){
    e.stopPropagation();
    dataArea.focus();dataArea.select();
    var ok=false;
    try{ok=document.execCommand('copy');}catch(err){}
    if(!ok&&navigator.clipboard){navigator.clipboard.writeText(dataArea.value).catch(function(){});}
  });
  $('importBtn').addEventListener('click',function(e){
    e.stopPropagation();
    try{
      var b=JSON.parse(dataArea.value);
      if(!b||typeof b!=='object')throw new Error('bad');
      boxes=sanitize(b);saveBoxes();renderBoxes();closeData();
    }catch(err){alert('読み込めませんでした。テキストを確認してください');}
  });
  window.addEventListener('resize',fit);

  /* ===== 画像の事前読み込み ===== */
  var total=PAGES.length,done=0,
      barFill=$('barFill'),pct=$('pct'),lmsg=$('lmsg'),loadEl=$('load');
  function step(){
    done++;
    var p=Math.floor(done/total*100);
    barFill.style.width=p+'%';pct.textContent=p+'%';
    lmsg.textContent='画像をよみこみ中… '+done+' / '+total;
    if(done>=total){
      pct.textContent='100%';barFill.style.width='100%';
      loadEl.style.display='none';
      toTitle();
    }
  }
  PAGES.forEach(function(p){
    var im=new Image();
    im.onload=step;im.onerror=step;
    im.src=p.img;
  });
  setTimeout(function(){if(loadEl.style.display!=='none')step();},30000); /* 安全策 */
})();
</script></body></html>
